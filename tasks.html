<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050812">
  <title>Tasks & Projects — Quantum OPS</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("quantum_theme") || "system";
        var day = t === "day" || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        if (day) document.documentElement.classList.remove("dark");
        else document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] },
          colors: {
            canvas: "#050812",
            sidebar: "#080B17",
            card: "#0B1020",
            cardElevated: "#0E1326",
            borderSubtle: "#1A2035",
            primaryPurple: "#7C4DFF",
            brightPurple: "#8B5CFF",
            textPrimary: "#F4F6FF",
            textSecondary: "#A0A7BB",
            textMuted: "#68718A",
            positiveGreen: "#31D17C",
            dangerRed: "#FF4F67",
            warningYellow: "#F5C451",
            cyanAccent: "#4C9AFF"
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #050812; }
    ::-webkit-scrollbar-thumb { background: #1A2035; border-radius: 4px; }
    .nav-link.active { background: rgba(124,77,255,0.18); color: #fff; border-left: 2px solid #7C4DFF; }
    body.theme-day { background: #F4F6FB !important; color: #0F172A !important; }
    body.theme-day .bg-canvas, body.theme-day main { background: #F4F6FB !important; }
    body.theme-day .bg-sidebar, body.theme-day aside { background: #fff !important; border-color: #E2E8F0 !important; }
    body.theme-day .bg-card, body.theme-day .bg-cardElevated { background: #fff !important; border-color: #E2E8F0 !important; }
    body.theme-day .text-white, body.theme-day .text-textPrimary, body.theme-day h1 { color: #0F172A !important; }
    body.theme-day .text-textMuted, body.theme-day .text-textSecondary { color: #64748B !important; }
    body.theme-day .border-borderSubtle { border-color: #E2E8F0 !important; }
    body.theme-day header { background: rgba(255,255,255,0.95) !important; border-color: #E2E8F0 !important; }
    body.theme-day input, body.theme-day select, body.theme-day textarea {
      background: #F1F5F9 !important; border-color: #E2E8F0 !important; color: #0F172A !important;
    }
    body.theme-day .nav-link { color: #64748B !important; }
    body.theme-day .nav-link.active { background: rgba(108,92,231,0.12) !important; color: #5B3DFF !important; }
  </style>
</head>
<body class="bg-canvas text-textPrimary font-sans antialiased min-h-screen flex">
  <aside class="w-[210px] bg-sidebar border-r border-borderSubtle flex flex-col p-3 shrink-0">
    <div class="flex items-center gap-2 px-1 pt-1 mb-4">
      <div class="w-8 h-8 rounded-lg bg-primaryPurple/20 flex items-center justify-center text-primaryPurple font-bold text-sm">Q</div>
      <div>
        <div class="font-extrabold text-sm text-white leading-none">QUANTUM <span class="text-primaryPurple">OPS</span></div>
        <div class="text-[9px] font-bold tracking-widest text-textMuted uppercase mt-0.5">Tasks</div>
      </div>
    </div>
    <nav class="space-y-0.5 text-xs flex-1 overflow-y-auto">
      <a href="desktop.html" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-textSecondary hover:text-white hover:bg-cardElevated"><i class="ph-bold ph-squares-four text-base"></i>Dashboard</a>
      <a href="pos.html" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-textSecondary hover:text-white hover:bg-cardElevated"><i class="ph-bold ph-shopping-cart text-base"></i>POS / Sales</a>
      <a href="inventory.html" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-textSecondary hover:text-white hover:bg-cardElevated"><i class="ph-bold ph-package text-base"></i>Inventory</a>
      <a href="staff.html" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-textSecondary hover:text-white hover:bg-cardElevated"><i class="ph-bold ph-identification-card text-base"></i>Staff & Payroll</a>
      <a href="branches.html" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-textSecondary hover:text-white hover:bg-cardElevated"><i class="ph-bold ph-git-fork text-base"></i>Multi-Branch</a>
      <a href="tasks.html" class="nav-link active flex items-center gap-2.5 px-3 py-2 rounded-lg font-medium"><i class="ph-bold ph-check-square text-base text-primaryPurple"></i>Tasks & Projects</a>

      <a href="profile.html" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-textSecondary hover:text-white hover:bg-cardElevated"><i class="ph-bold ph-gear text-base"></i>Settings</a>
    </nav>

  <main class="flex-1 flex flex-col min-w-0 bg-canvas overflow-y-auto">
    <header class="h-14 border-b border-borderSubtle px-5 flex items-center justify-between sticky top-0 bg-canvas/90 backdrop-blur-md z-20">
      <div>
        <h1 class="text-base font-extrabold text-white">Tasks & Projects</h1>
        <p class="text-[11px] text-textMuted">To-dos · priorities · deadlines for your team</p>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="toggleTheme()" class="w-8 h-8 rounded-lg bg-card border border-borderSubtle flex items-center justify-center text-textSecondary">
          <i class="ph-bold ph-moon text-sm" id="theme-icon"></i>
        </button>
        <button type="button" onclick="openTaskModal()" class="px-3 py-2 rounded-lg bg-primaryPurple text-white text-xs font-bold hover:opacity-90">
          + New Task
        </button>
      </div>
    </header>

    <div class="p-5 space-y-4">
      <!-- KPIs -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="rounded-xl bg-card border border-borderSubtle p-4">
          <div class="text-[10px] text-textMuted font-semibold uppercase">Total</div>
          <div class="text-lg font-extrabold text-white mt-1" id="sum-total">0</div>
        </div>
        <div class="rounded-xl bg-card border border-borderSubtle p-4">
          <div class="text-[10px] text-textMuted font-semibold uppercase">To Do</div>
          <div class="text-lg font-extrabold text-warningYellow mt-1" id="sum-todo">0</div>
        </div>
        <div class="rounded-xl bg-card border border-borderSubtle p-4">
          <div class="text-[10px] text-textMuted font-semibold uppercase">In Progress</div>
          <div class="text-lg font-extrabold text-cyanAccent mt-1" id="sum-progress">0</div>
        </div>
        <div class="rounded-xl bg-card border border-borderSubtle p-4">
          <div class="text-[10px] text-textMuted font-semibold uppercase">Done</div>
          <div class="text-lg font-extrabold text-positiveGreen mt-1" id="sum-done">0</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap items-center gap-2">
        <select id="filter-status" onchange="renderList()" class="px-3 py-1.5 rounded-lg bg-card border border-borderSubtle text-xs text-textPrimary focus:outline-none focus:border-primaryPurple">
          <option value="all">All status</option>
          <option value="todo">To Do</option>
          <option value="in_progress">In Progress</option>
          <option value="done">Done</option>
        </select>
        <select id="filter-priority" onchange="renderList()" class="px-3 py-1.5 rounded-lg bg-card border border-borderSubtle text-xs text-textPrimary focus:outline-none focus:border-primaryPurple">
          <option value="all">All priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <input id="search-input" type="text" placeholder="Search tasks…" oninput="renderList()"
          class="px-3 py-1.5 rounded-lg bg-card border border-borderSubtle text-xs text-textPrimary w-48 focus:outline-none focus:border-primaryPurple">
      </div>

      <!-- Table -->
      <div class="rounded-xl bg-card border border-borderSubtle overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="text-textMuted border-b border-borderSubtle">
                <th class="px-4 py-3 font-semibold">Task</th>
                <th class="px-4 py-3 font-semibold">Priority</th>
                <th class="px-4 py-3 font-semibold">Status</th>
                <th class="px-4 py-3 font-semibold">Assigned</th>
                <th class="px-4 py-3 font-semibold">Due</th>
                <th class="px-4 py-3 font-semibold text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="tasks-body">
              <tr><td colspan="6" class="px-4 py-8 text-center text-textMuted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="task-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background:rgba(0,0,0,0.75)">
    <div class="w-full max-w-md rounded-2xl bg-card border border-borderSubtle p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-extrabold text-white" id="modal-title">New Task</h2>
        <button type="button" onclick="closeTaskModal()" class="text-textMuted hover:text-white text-xl">&times;</button>
      </div>
      <input type="hidden" id="t-id">
      <div class="space-y-3">
        <div>
          <label class="text-[10px] text-textMuted font-semibold block mb-1">Title *</label>
          <input id="t-title" type="text" placeholder="What needs to be done?" class="w-full px-3 py-2 rounded-lg bg-cardElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-primaryPurple">
        </div>
        <div>
          <label class="text-[10px] text-textMuted font-semibold block mb-1">Description</label>
          <textarea id="t-desc" rows="3" placeholder="Optional details" class="w-full px-3 py-2 rounded-lg bg-cardElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-primaryPurple resize-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] text-textMuted font-semibold block mb-1">Status</label>
            <select id="t-status" class="w-full px-3 py-2 rounded-lg bg-cardElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-primaryPurple">
              <option value="todo">To Do</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-textMuted font-semibold block mb-1">Priority</label>
            <select id="t-priority" class="w-full px-3 py-2 rounded-lg bg-cardElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-primaryPurple">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] text-textMuted font-semibold block mb-1">Assigned to</label>
            <input id="t-assigned" type="text" placeholder="Name or role" class="w-full px-3 py-2 rounded-lg bg-cardElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-primaryPurple">
          </div>
          <div>
            <label class="text-[10px] text-textMuted font-semibold block mb-1">Due date</label>
            <input id="t-due" type="date" class="w-full px-3 py-2 rounded-lg bg-cardElevated border border-borderSubtle text-sm text-textPrimary focus:outline-none focus:border-primaryPurple">
          </div>
        </div>
      </div>
      <div class="flex gap-2 mt-5">
        <button type="button" onclick="closeTaskModal()" class="flex-1 px-4 py-2 rounded-lg border border-borderSubtle text-xs font-semibold text-textSecondary">Cancel</button>
        <button type="button" id="save-task-btn" onclick="saveTask()" class="flex-1 px-4 py-2 rounded-lg bg-primaryPurple text-white text-xs font-bold">Save</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let userCompanyId = null;
    let tasks = [];
    let editingId = null;

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    function applyTheme() {
      try {
        const t = localStorage.getItem("quantum_theme") || "system";
        const day = t === "day" || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.body.classList.toggle("theme-day", day);
        document.documentElement.classList.toggle("dark", !day);
        const icon = $("theme-icon");
        if (icon) icon.className = day ? "ph-bold ph-sun text-sm" : "ph-bold ph-moon text-sm";
      } catch (e) {}
    }
    function toggleTheme() {
      const cur = localStorage.getItem("quantum_theme") || "system";
      const next = cur === "day" ? "night" : cur === "night" ? "system" : "day";
      localStorage.setItem("quantum_theme", next);
      applyTheme();
    }

    function statusBadge(status) {
      const s = status || "todo";
      if (s === "done") return '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-positiveGreen/15 text-positiveGreen">Done</span>';
      if (s === "in_progress") return '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-cyanAccent/15 text-cyanAccent">In Progress</span>';
      return '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-warningYellow/15 text-warningYellow">To Do</span>';
    }
    function priorityBadge(p) {
      const v = p || "medium";
      if (v === "high") return '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-dangerRed/15 text-dangerRed">High</span>';
      if (v === "low") return '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-textMuted/20 text-textMuted">Low</span>';
      return '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-primaryPurple/15 text-brightPurple">Medium</span>';
    }

    function openTaskModal(task) {
      editingId = task ? task.id : null;
      $("modal-title").textContent = task ? "Edit Task" : "New Task";
      $("t-id").value = task ? task.id : "";
      $("t-title").value = task ? (task.title || "") : "";
      $("t-desc").value = task ? (task.description || "") : "";
      $("t-status").value = task ? (task.status || "todo") : "todo";
      $("t-priority").value = task ? (task.priority || "medium") : "medium";
      $("t-assigned").value = task ? (task.assigned_to || "") : "";
      $("t-due").value = task && task.due_date ? String(task.due_date).slice(0, 10) : "";
      $("task-modal").classList.remove("hidden");
      $("task-modal").classList.add("flex");
    }
    function closeTaskModal() {
      editingId = null;
      $("task-modal").classList.add("hidden");
      $("task-modal").classList.remove("flex");
    }

    async function saveTask() {
      const title = ($("t-title").value || "").trim();
      if (!title) return alert("Enter task title");
      if (!userCompanyId) return alert("Company not loaded");

      const payload = {
        company_id: userCompanyId,
        title: title,
        description: ($("t-desc").value || "").trim() || null,
        status: $("t-status").value || "todo",
        priority: $("t-priority").value || "medium",
        assigned_to: ($("t-assigned").value || "").trim() || null,
        due_date: $("t-due").value || null,
        updated_at: new Date().toISOString()
      };

      const btn = $("save-task-btn");
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }

      try {
        if (editingId) {
          const { error } = await supabaseClient
            .from("tasks")
            .update(payload)
            .eq("id", editingId)
            .eq("company_id", userCompanyId);
          if (error) throw error;
        } else {
          const { error } = await supabaseClient.from("tasks").insert([payload]);
          if (error) throw error;
        }
        closeTaskModal();
        await loadTasks();
      } catch (err) {
        console.error(err);
        alert(err.message || "Could not save task");
      }
      if (btn) { btn.disabled = false; btn.textContent = "Save"; }
    }

    async function deleteTask(id, title) {
      if (!confirm("Delete task \"" + title + "\"?")) return;
      try {
        const { error } = await supabaseClient
          .from("tasks")
          .delete()
          .eq("id", id)
          .eq("company_id", userCompanyId);
        if (error) throw error;
        await loadTasks();
      } catch (err) {
        alert(err.message || "Could not delete");
      }
    }

    async function cycleStatus(id, current) {
      const next = current === "todo" ? "in_progress" : current === "in_progress" ? "done" : "todo";
      try {
        const { error } = await supabaseClient
          .from("tasks")
          .update({ status: next, updated_at: new Date().toISOString() })
          .eq("id", id)
          .eq("company_id", userCompanyId);
        if (error) throw error;
        await loadTasks();
      } catch (err) {
        alert(err.message || "Could not update status");
      }
    }

    function isOverdue(due, status) {
      if (!due || status === "done") return false;
      const d = new Date(due);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return d < today;
    }

    function renderList() {
      const statusF = ($("filter-status") || {}).value || "all";
      const priorityF = ($("filter-priority") || {}).value || "all";
      const q = (($("search-input") || {}).value || "").toLowerCase().trim();

      let list = tasks.slice();
      if (statusF !== "all") list = list.filter(function (t) { return (t.status || "todo") === statusF; });
      if (priorityF !== "all") list = list.filter(function (t) { return (t.priority || "medium") === priorityF; });
      if (q) {
        list = list.filter(function (t) {
          return String(t.title || "").toLowerCase().indexOf(q) !== -1 ||
            String(t.description || "").toLowerCase().indexOf(q) !== -1 ||
            String(t.assigned_to || "").toLowerCase().indexOf(q) !== -1;
        });
      }

      // Sort: high priority first, then due date
      list.sort(function (a, b) {
        const pr = { high: 0, medium: 1, low: 2 };
        const pa = pr[a.priority || "medium"] ?? 1;
        const pb = pr[b.priority || "medium"] ?? 1;
        if (pa !== pb) return pa - pb;
        return String(a.due_date || "9999").localeCompare(String(b.due_date || "9999"));
      });

      const body = $("tasks-body");
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-textMuted">No tasks found. Click + New Task.</td></tr>';
        return;
      }

      body.innerHTML = list.map(function (t) {
        const due = t.due_date
          ? new Date(t.due_date).toLocaleDateString("en-GB", { day: "numeric", month: "short" })
          : "—";
        const overdue = isOverdue(t.due_date, t.status);
        return (
          "<tr class=\"border-b border-borderSubtle/60 hover:bg-cardElevated/50\">" +
          "<td class=\"px-4 py-3\"><div class=\"font-semibold text-white\">" + esc(t.title) + "</div>" +
          (t.description ? "<div class=\"text-[10px] text-textMuted truncate max-w-[220px]\">" + esc(t.description) + "</div>" : "") +
          "</td>" +
          "<td class=\"px-4 py-3\">" + priorityBadge(t.priority) + "</td>" +
          "<td class=\"px-4 py-3\">" +
            "<button type=\"button\" title=\"Click to change status\" onclick=\"cycleStatus('" + t.id + "','" + (t.status || "todo") + "')\">" +
            statusBadge(t.status) + "</button></td>" +
          "<td class=\"px-4 py-3 text-textSecondary\">" + (t.assigned_to ? esc(t.assigned_to) : "—") + "</td>" +
          "<td class=\"px-4 py-3 " + (overdue ? "text-dangerRed font-bold" : "text-textMuted") + "\">" +
            due + (overdue ? " · overdue" : "") + "</td>" +
          "<td class=\"px-4 py-3 text-right\">" +
            "<button type=\"button\" class=\"px-2 py-1 rounded text-[10px] font-semibold bg-primaryPurple/15 text-brightPurple mr-1\" onclick='openTaskModal(" + JSON.stringify(t).replace(/'/g, "&#39;") + ")'>Edit</button>" +
            "<button type=\"button\" class=\"px-2 py-1 rounded text-[10px] font-semibold bg-dangerRed/15 text-dangerRed\" onclick=\"deleteTask('" + t.id + "','" + esc(t.title).replace(/'/g, "") + "')\">Del</button>" +
          "</td></tr>"
        );
      }).join("");
    }

    function updateSummary() {
      let todo = 0, progress = 0, done = 0;
      tasks.forEach(function (t) {
        const s = t.status || "todo";
        if (s === "done") done++;
        else if (s === "in_progress") progress++;
        else todo++;
      });
      $("sum-total").textContent = String(tasks.length);
      $("sum-todo").textContent = String(todo);
      $("sum-progress").textContent = String(progress);
      $("sum-done").textContent = String(done);
    }

    async function loadTasks() {
      if (!userCompanyId) return;
      const { data, error } = await supabaseClient
        .from("tasks")
        .select("*")
        .eq("company_id", userCompanyId)
        .order("created_at", { ascending: false })
        .limit(300);
      if (error) {
        console.error(error);
        $("tasks-body").innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-dangerRed">Failed to load</td></tr>';
        return;
      }
      tasks = data || [];
      updateSummary();
      renderList();
    }

    async function init() {
      applyTheme();
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session || !session.user) {
          window.location.replace("index.html");
          return;
        }
        const { data: member } = await supabaseClient
          .from("company_users")
          .select("company_id")
          .eq("user_id", session.user.id)
          .maybeSingle();
        if (!member || !member.company_id) {
          window.location.href = "desktop.html";
          return;
        }
        userCompanyId = member.company_id;
        await loadTasks();
      } catch (err) {
        console.error(err);
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
