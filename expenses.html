<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - Quantum OPS Elite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { bg: '#07070F', card: '#121224', purple: '#6C5CE7' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }
    .iphone-frame {
      width: 100%; max-width: 410px; height: 100vh; max-height: 860px;
      background: #0B0B16; border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 0 25px 50px -12px rgba(15, 13, 35, 0.7);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }
    @media (min-width: 768px) {
      body { align-items: center; justify-content: center; display: flex; height: 100vh; }
      .iphone-frame { border-radius: 48px; }
    }
  </style>
</head>
<body>
  <div class="iphone-frame">
    <!-- TOP BAR -->
    <div class="px-4 pt-3 pb-3 flex items-center justify-between bg-[#0B0B16]/90 backdrop-blur-md z-30 flex-shrink-0 border-b border-purple-500/10">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="text-slate-300 hover:text-white transition">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div>
          <h2 class="font-bold tracking-wider text-xs text-white">EXPENSES</h2>
          <p class="text-[9px] text-slate-400">Track every business cost</p>
        </div>
      </div>
      <button onclick="openAddModal()" class="px-3 py-1.5 rounded-xl bg-purple-600/20 border border-purple-500/40 text-purple-300 text-[10px] font-semibold hover:bg-purple-600/30 transition">
        <i class="fa-solid fa-plus mr-1"></i> Add
      </button>
    </div>

    <!-- SUMMARY -->
    <div class="px-4 py-3 grid grid-cols-2 gap-2 flex-shrink-0 border-b border-purple-500/10">
      <div class="bg-[#121224] border border-purple-500/15 rounded-2xl p-3">
        <p class="text-[9px] text-slate-400">Today</p>
        <p class="text-sm font-bold text-rose-400" id="sum-today">₦0</p>
      </div>
      <div class="bg-[#121224] border border-purple-500/15 rounded-2xl p-3">
        <p class="text-[9px] text-slate-400">This Month</p>
        <p class="text-sm font-bold text-white" id="sum-month">₦0</p>
      </div>
    </div>

    <!-- FILTERS -->
    <div class="px-4 py-2 flex gap-1.5 overflow-x-auto custom-scrollbar flex-shrink-0">
      <button onclick="setFilter('all')" id="f-all" class="filter-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-purple-600 text-white flex-shrink-0">All</button>
      <button onclick="setFilter('today')" id="f-today" class="filter-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 flex-shrink-0">Today</button>
      <button onclick="setFilter('week')" id="f-week" class="filter-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 flex-shrink-0">This Week</button>
      <button onclick="setFilter('month')" id="f-month" class="filter-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 flex-shrink-0">This Month</button>
    </div>

    <!-- LIST -->
    <div class="flex-1 overflow-y-auto px-4 py-2 custom-scrollbar pb-20" id="expense-list">
      <div class="text-center py-16 text-slate-500 text-xs">Loading expenses…</div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-[#0E0E1C]/95 backdrop-blur-xl border-t border-purple-500/15 px-6 flex items-center justify-between z-40">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-gauge-high text-sm"></i><span class="text-[9px] font-medium">Dashboard</span>
      </a>
      <a href="inventory.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-boxes-stacked text-sm"></i><span class="text-[9px] font-medium">Inventory</span>
      </a>
      <a href="pos.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-cash-register text-sm"></i><span class="text-[9px] font-medium">POS</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-user text-sm"></i><span class="text-[9px] font-medium">Profile</span>
      </a>
    </nav>
  </div>

  <!-- ADD MODAL -->
  <div id="add-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-[#121224] border border-purple-500/30 rounded-3xl p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white"><i class="fa-solid fa-receipt text-rose-400 mr-2"></i>Record Expense</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="text-[10px] text-slate-400 font-medium">What did you spend on? *</label>
          <input type="text" id="ex-title" placeholder="e.g. Fuel to market"
            class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 font-medium">Category *</label>
          <select id="ex-category"
            class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
            <option value="Transport">Transport</option>
            <option value="Fuel">Fuel</option>
            <option value="Salary">Salary</option>
            <option value="Rent">Rent</option>
            <option value="Electricity">Electricity</option>
            <option value="Internet">Internet</option>
            <option value="Repairs">Repairs</option>
            <option value="Shop Supplies">Shop Supplies</option>
            <option value="Tax">Tax</option>
            <option value="Other" selected>Other</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] text-slate-400 font-medium">Amount (₦) *</label>
          <input type="number" id="ex-amount" placeholder="e.g. 5000" min="0" step="0.01"
            class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="text-[10px] text-slate-400 font-medium">Notes (optional)</label>
          <input type="text" id="ex-notes" placeholder="Optional note"
            class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <button onclick="saveExpense()" id="save-ex-btn"
          class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl text-white font-bold text-xs shadow-lg shadow-purple-600/30 hover:opacity-95 transition">
          Save Expense
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userCompanyId = null;
    let recordedBy = 'Owner';
    let allExpenses = [];
    let currentFilter = 'all';

    function formatCurrency(n) {
      return '₦' + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function parseMoney(v) {
      if (v == null || v === '') return 0;
      if (typeof v === 'number') return isNaN(v) ? 0 : v;
      const n = parseFloat(String(v).replace(/[₦$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }

    function getLocalDateString(d) {
      const x = new Date(d);
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    function openAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = 'filter-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 flex-shrink-0';
      });
      const active = document.getElementById('f-' + f);
      if (active) active.className = 'filter-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-purple-600 text-white flex-shrink-0';
      renderList();
    }

    function inFilter(ex) {
      const d = getLocalDateString(ex.created_at);
      const today = getLocalDateString(new Date());
      if (currentFilter === 'all') return true;
      if (currentFilter === 'today') return d === today;
      if (currentFilter === 'week') {
        const now = new Date();
        const day = now.getDay() || 7;
        const monday = new Date(now);
        monday.setDate(now.getDate() - day + 1);
        return d >= getLocalDateString(monday);
      }
      if (currentFilter === 'month') return d.startsWith(today.slice(0, 7));
      return true;
    }

    function updateSummary() {
      const today = getLocalDateString(new Date());
      const monthPrefix = today.slice(0, 7);
      let t = 0, m = 0;
      allExpenses.forEach(ex => {
        const amt = parseMoney(ex.amount);
        const d = getLocalDateString(ex.created_at);
        if (d === today) t += amt;
        if (d.startsWith(monthPrefix)) m += amt;
      });
      document.getElementById('sum-today').textContent = formatCurrency(t);
      document.getElementById('sum-month').textContent = formatCurrency(m);
    }

    function renderList() {
      const container = document.getElementById('expense-list');
      const list = allExpenses.filter(inFilter);

      if (!list.length) {
        container.innerHTML = '<div class="text-center py-16 text-slate-500 text-xs">No expenses for this period.<br><span class="text-[10px]">Tap + Add to record one.</span></div>';
        return;
      }

      container.innerHTML = list.map(ex => `
        <div class="bg-[#121224] border border-purple-500/15 rounded-2xl p-3.5 mb-2 flex items-start justify-between gap-2">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 mb-0.5">
              <span class="text-[9px] px-1.5 py-0.5 rounded-md bg-rose-500/15 text-rose-300 border border-rose-500/20">${ex.category || 'Other'}</span>
              <span class="text-[9px] text-slate-500">${formatTime(ex.created_at)}</span>
            </div>
            <p class="text-[12px] font-semibold text-white truncate">${ex.title || 'Expense'}</p>
            ${ex.notes ? `<p class="text-[10px] text-slate-400 mt-0.5 truncate">${ex.notes}</p>` : ''}
            <p class="text-[9px] text-slate-500 mt-0.5">${ex.recorded_by || 'Owner'}</p>
          </div>
          <div class="text-right flex-shrink-0">
            <p class="font-bold text-rose-400 text-sm">${formatCurrency(ex.amount)}</p>
            <button onclick="deleteExpense('${ex.id}')" class="text-[9px] text-slate-500 hover:text-rose-400 mt-1">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function loadExpenses() {
      if (!userCompanyId) return;
      const { data, error } = await supabaseClient
        .from('expenses')
        .select('*')
        .eq('company_id', userCompanyId)
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('expense-list').innerHTML =
          `<div class="text-center py-16 text-rose-400 text-xs">${error.message}</div>`;
        return;
      }
      allExpenses = data || [];
      updateSummary();
      renderList();
    }

    async function saveExpense() {
      const title = document.getElementById('ex-title').value.trim();
      const category = document.getElementById('ex-category').value;
      const amount = parseFloat(document.getElementById('ex-amount').value);
      const notes = document.getElementById('ex-notes').value.trim();

      if (!title) return alert('Enter what you spent on');
      if (!amount || amount <= 0) return alert('Enter a valid amount');
      if (!userCompanyId) return alert('Company not loaded. Refresh page.');

      const btn = document.getElementById('save-ex-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const { error } = await supabaseClient.from('expenses').insert([{
        company_id: userCompanyId,
        title,
        category,
        amount,
        notes: notes || null,
        recorded_by: recordedBy
      }]);

      btn.disabled = false;
      btn.textContent = 'Save Expense';

      if (error) {
        alert(error.message);
        return;
      }

      document.getElementById('ex-title').value = '';
      document.getElementById('ex-amount').value = '';
      document.getElementById('ex-notes').value = '';
      document.getElementById('ex-category').value = 'Other';
      closeAddModal();
      await loadExpenses();
    }

    async function deleteExpense(id) {
      if (!confirm('Delete this expense?')) return;
      const { error } = await supabaseClient.from('expenses').delete().eq('id', id);
      if (error) alert(error.message);
      else await loadExpenses();
    }

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }

      recordedBy = (user.user_metadata?.full_name || user.email?.split('@')[0] || 'Owner').split(' ')[0];

      const { data: member } = await supabaseClient
        .from('company_users')
        .select('company_id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (member?.company_id) {
        userCompanyId = member.company_id;
      } else {
        const { data: owned } = await supabaseClient
          .from('companies').select('id').eq('owner_id', user.id).maybeSingle();
        if (owned?.id) userCompanyId = owned.id;
      }

      if (!userCompanyId) {
        document.getElementById('expense-list').innerHTML =
          '<div class="text-center py-16 text-slate-500 text-xs">No business found. Please re-login.</div>';
        return;
      }

      await loadExpenses();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
