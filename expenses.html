<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Expenses - Quantum OPS Elite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }
    .iphone-frame {
      width: 100%; max-width: 100%; height: 100dvh;
      background: #0B0B16; position: relative; overflow: hidden;
      display: flex; flex-direction: column;
    }
    @media (min-width: 768px) {
      body { display: flex; align-items: center; justify-content: center; height: 100vh; }
      .iphone-frame {
        max-width: 410px; max-height: 860px; border-radius: 48px;
        border: 1px solid rgba(139,92,246,0.2);
        box-shadow: 0 25px 50px -12px rgba(15,13,35,0.7);
      }
    }
    .top-bar {
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      background: rgba(11,11,22,0.95); border-bottom: 1px solid rgba(139,92,246,0.1); flex-shrink: 0;
    }
    .btn-add {
      padding: 6px 12px; border-radius: 12px; background: rgba(108,92,231,0.2);
      border: 1px solid rgba(139,92,246,0.4); color: #c4b5fd; font-size: 10px; font-weight: 600; cursor: pointer;
    }
    .summary {
      padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      border-bottom: 1px solid rgba(139,92,246,0.1); flex-shrink: 0;
    }
    .sum-card {
      background: #121224; border: 1px solid rgba(139,92,246,0.15); border-radius: 16px; padding: 12px;
    }
    .filters {
      padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0;
    }
    .filter-btn {
      padding: 5px 10px; border-radius: 8px; font-size: 10px; font-weight: 600;
      background: #121224; color: #94a3b8; border: 1px solid rgba(139,92,246,0.15);
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .filter-btn.active { background: #6C5CE7; color: #fff; border-color: transparent; }
    .list { flex: 1; overflow-y: auto; padding: 8px 16px 88px; }
    .card {
      background: #121224; border: 1px solid rgba(139,92,246,0.15);
      border-radius: 16px; padding: 12px; margin-bottom: 8px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .badge {
      font-size: 9px; padding: 2px 6px; border-radius: 6px;
      background: rgba(244,63,94,0.15); color: #fda4af; border: 1px solid rgba(244,63,94,0.2);
    }
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
      background: rgba(14,14,28,0.95); border-top: 1px solid rgba(139,92,246,0.15);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 40;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: #94a3b8; text-decoration: none; font-size: 9px;
    }
    .nav-item i { font-size: 14px; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.hidden { display: none; }
    .modal {
      width: 100%; max-width: 384px; max-height: 90vh; overflow-y: auto;
      background: #121224; border: 1px solid rgba(139,92,246,0.3); border-radius: 24px; padding: 20px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; background: #191932; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 10px 12px; font-size: 12px; color: #fff; outline: none;
    }
    .btn-save {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(to right, #6C5CE7, #4F46E5); color: #fff;
      font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="iphone-frame">
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="dashboard.html" style="color:#cbd5e1;text-decoration:none;"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
          <div style="font-weight:700;font-size:12px;color:#fff;letter-spacing:0.04em;">EXPENSES</div>
          <div style="font-size:9px;color:#94a3b8;">Track every business cost</div>
        </div>
      </div>
      <button class="btn-add" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add</button>
    </div>

    <div class="summary">
      <div class="sum-card">
        <div style="font-size:9px;color:#94a3b8;">Today</div>
        <div style="font-size:14px;font-weight:700;color:#fb7185;" id="sum-today">₦0</div>
      </div>
      <div class="sum-card">
        <div style="font-size:9px;color:#94a3b8;">This Month</div>
        <div style="font-size:14px;font-weight:700;color:#fff;" id="sum-month">₦0</div>
      </div>
    </div>

    <div class="filters custom-scrollbar">
      <button class="filter-btn active" id="f-all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" id="f-today" onclick="setFilter('today')">Today</button>
      <button class="filter-btn" id="f-week" onclick="setFilter('week')">This Week</button>
      <button class="filter-btn" id="f-month" onclick="setFilter('month')">This Month</button>
    </div>

    <div class="list custom-scrollbar" id="expense-list">
      <div style="text-align:center;padding:64px 0;color:#64748b;font-size:12px;">Loading expenses…</div>
    </div>

    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i>Dashboard</a>
      <a href="inventory.html" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i>Inventory</a>
      <a href="pos.html" class="nav-item"><i class="fa-solid fa-cash-register"></i>POS</a>
      <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i>Profile</a>
    </nav>
  </div>

  <div id="add-modal" class="modal-bg hidden">
    <div class="modal custom-scrollbar">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="margin:0;font-size:14px;font-weight:700;color:#fff;">
          <i class="fa-solid fa-receipt" style="color:#fb7185;margin-right:8px;"></i>Record Expense
        </h3>
        <button onclick="closeAddModal()" style="background:none;border:none;color:#94a3b8;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="field">
        <label>What did you spend on? *</label>
        <input type="text" id="ex-title" placeholder="e.g. Fuel to market">
      </div>
      <div class="field">
        <label>Category *</label>
        <select id="ex-category">
          <option value="Transport">Transport</option>
          <option value="Fuel">Fuel</option>
          <option value="Salary">Salary</option>
          <option value="Rent">Rent</option>
          <option value="Electricity">Electricity</option>
          <option value="Internet">Internet</option>
          <option value="Repairs">Repairs</option>
          <option value="Shop Supplies">Shop Supplies</option>
          <option value="Tax">Tax</option>
          <option value="Other" selected>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Amount (₦) *</label>
        <input type="number" id="ex-amount" placeholder="e.g. 5000" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <input type="text" id="ex-notes" placeholder="Optional note">
      </div>
      <button onclick="saveExpense()" id="save-ex-btn" class="btn-save">Save Expense</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let userCompanyId = null;
    let recordedBy = 'Owner';
    let allExpenses = [];
    let currentFilter = 'all';
    let isSaving = false;
    let isLoading = false;

    function formatCurrency(n) {
      return '₦' + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }
    function parseMoney(v) {
      if (v == null || v === '') return 0;
      if (typeof v === 'number') return isNaN(v) ? 0 : v;
      var n = parseFloat(String(v).replace(/[₦$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }
    function getLocalDateString(d) {
      var x = new Date(d);
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    }
    function formatTime(iso) {
      return new Date(iso).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    function openAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }
    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
      var active = document.getElementById('f-' + f);
      if (active) active.classList.add('active');
      renderList();
    }

    function inFilter(ex) {
      var d = getLocalDateString(ex.created_at);
      var today = getLocalDateString(new Date());
      if (currentFilter === 'all') return true;
      if (currentFilter === 'today') return d === today;
      if (currentFilter === 'week') {
        var now = new Date();
        var day = now.getDay() || 7;
        var monday = new Date(now);
        monday.setDate(now.getDate() - day + 1);
        return d >= getLocalDateString(monday);
      }
      if (currentFilter === 'month') return d.indexOf(today.slice(0, 7)) === 0;
      return true;
    }

    function updateSummary() {
      var today = getLocalDateString(new Date());
      var monthPrefix = today.slice(0, 7);
      var t = 0, m = 0;
      allExpenses.forEach(function (ex) {
        var amt = parseMoney(ex.amount);
        var d = getLocalDateString(ex.created_at);
        if (d === today) t += amt;
        if (d.indexOf(monthPrefix) === 0) m += amt;
      });
      document.getElementById('sum-today').textContent = formatCurrency(t);
      document.getElementById('sum-month').textContent = formatCurrency(m);
    }

    function renderList() {
      var container = document.getElementById('expense-list');
      var list = allExpenses.filter(inFilter);
      if (!list.length) {
        container.innerHTML =
          '<div style="text-align:center;padding:64px 0;color:#64748b;font-size:12px;">No expenses for this period.<br><span style="font-size:10px;">Tap + Add to record one.</span></div>';
        return;
      }
      container.innerHTML = list.map(function (ex) {
        return ''
          + '<div class="card">'
          +   '<div style="min-width:0;flex:1;">'
          +     '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">'
          +       '<span class="badge">' + (ex.category || 'Other') + '</span>'
          +       '<span style="font-size:9px;color:#64748b;">' + formatTime(ex.created_at) + '</span>'
          +     '</div>'
          +     '<div style="font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (ex.title || 'Expense') + '</div>'
          +     (ex.notes ? '<div style="font-size:10px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + ex.notes + '</div>' : '')
          +     '<div style="font-size:9px;color:#64748b;margin-top:2px;">' + (ex.recorded_by || 'Owner') + '</div>'
          +   '</div>'
          +   '<div style="text-align:right;flex-shrink:0;">'
          +     '<div style="font-weight:700;color:#fb7185;font-size:14px;">' + formatCurrency(ex.amount) + '</div>'
          +     '<button onclick="deleteExpense(\'' + ex.id + '\')" style="background:none;border:none;font-size:9px;color:#64748b;margin-top:4px;cursor:pointer;">Delete</button>'
          +   '</div>'
          + '</div>';
      }).join('');
    }

    async function loadExpenses() {
      if (!userCompanyId) return;
      if (isLoading) return;
      isLoading = true;
      try {
        var res = await supabaseClient
          .from('expenses')
          .select('id, title, category, amount, notes, recorded_by, created_at')
          .eq('company_id', userCompanyId)
          .order('created_at', { ascending: false })
          .limit(300);
        if (res.error) throw res.error;
        allExpenses = res.data || [];
        updateSummary();
        renderList();
      } catch (err) {
        document.getElementById('expense-list').innerHTML =
          '<div style="text-align:center;padding:64px 0;color:#fb7185;font-size:12px;">' + (err.message || 'Error loading') + '</div>';
      } finally {
        isLoading = false;
      }
    }

    async function saveExpense() {
      if (isSaving) return;
      var title = document.getElementById('ex-title').value.trim();
      var category = document.getElementById('ex-category').value;
      var amount = parseFloat(document.getElementById('ex-amount').value);
      var notes = document.getElementById('ex-notes').value.trim();

      if (!title) return alert('Enter what you spent on');
      if (!amount || amount <= 0) return alert('Enter a valid amount');
      if (!userCompanyId) return alert('Company not loaded. Refresh page.');

      isSaving = true;
      var btn = document.getElementById('save-ex-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        var res = await supabaseClient.from('expenses').insert([{
          company_id: userCompanyId,
          title: title,
          category: category,
          amount: amount,
          notes: notes || null,
          recorded_by: recordedBy
        }]);
        if (res.error) throw res.error;

        document.getElementById('ex-title').value = '';
        document.getElementById('ex-amount').value = '';
        document.getElementById('ex-notes').value = '';
        document.getElementById('ex-category').value = 'Other';
        closeAddModal();
        await loadExpenses();
      } catch (err) {
        alert(err.message || 'Could not save');
      } finally {
        isSaving = false;
        btn.disabled = false;
        btn.textContent = 'Save Expense';
      }
    }

    async function deleteExpense(id) {
      if (!confirm('Delete this expense?')) return;
      try {
        var res = await supabaseClient
          .from('expenses')
          .delete()
          .eq('id', id)
          .eq('company_id', userCompanyId);
        if (res.error) throw res.error;
        await loadExpenses();
      } catch (err) {
        alert(err.message || 'Could not delete');
      }
    }

    async function init() {
      try {
        var sessionRes = await supabaseClient.auth.getSession();
        var session = sessionRes.data && sessionRes.data.session;
        if (!session || !session.user) {
          window.location.replace('index.html');
          return;
        }
        var user = session.user;
        recordedBy = ((user.user_metadata && user.user_metadata.full_name) || (user.email && user.email.split('@')[0]) || 'Owner').split(' ')[0];

        var memberRes = await supabaseClient
          .from('company_users')
          .select('company_id')
          .eq('user_id', user.id)
          .maybeSingle();
        var member = memberRes.data;

        if (member && member.company_id) {
          userCompanyId = member.company_id;
        } else {
          var ownedRes = await supabaseClient
            .from('companies').select('id').eq('owner_id', user.id).maybeSingle();
          if (ownedRes.data && ownedRes.data.id) userCompanyId = ownedRes.data.id;
        }

        if (!userCompanyId) {
          document.getElementById('expense-list').innerHTML =
            '<div style="text-align:center;padding:64px 0;color:#64748b;font-size:12px;">No business found. Please re-login.</div>';
          return;
        }
        await loadExpenses();
      } catch (err) {
        console.error(err);
        document.getElementById('expense-list').innerHTML =
          '<div style="text-align:center;padding:64px 0;color:#fb7185;font-size:12px;">Could not load. Refresh page.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
