<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Expenses - Quantum OPS Elite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; min-height: 100vh; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }

    /* STRICT ISOLATION */
    .mobile-only { display: block !important; }
    .desktop-only { display: none !important; }
    @media (min-width: 1024px) {
      .mobile-only { display: none !important; }
      .desktop-only { display: flex !important; }
    }

    /* ===== MOBILE (SAFE AREA FIXED) ===== */
    .iphone-frame {
      width: 100%; max-width: 100%; height: 100dvh; height: 100vh;
      background: #0B0B16; position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .top-bar {
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(11,11,22,0.95); border-bottom: 1px solid rgba(139,92,246,0.1);
      flex-shrink: 0; z-index: 20;
    }
    .btn-add {
      padding: 7px 14px; border-radius: 12px; background: linear-gradient(135deg,#6C5CE7,#4F46E5);
      border: none; color: #fff; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .summary {
      padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      border-bottom: 1px solid rgba(139,92,246,0.1); flex-shrink: 0;
    }
    .sum-card {
      background: linear-gradient(135deg, rgba(244,63,94,0.12), #121224);
      border: 1px solid rgba(244,63,94,0.2); border-radius: 16px; padding: 14px;
    }
    .sum-card.month {
      background: linear-gradient(135deg, rgba(108,92,231,0.15), #121224);
      border-color: rgba(139,92,246,0.25);
    }
    .filters {
      padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0;
    }
    .filter-btn {
      padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 600;
      background: #121224; color: #94a3b8; border: 1px solid rgba(139,92,246,0.15);
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .filter-btn.active { background: #6C5CE7; color: #fff; border-color: transparent; }
    .list {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 10px 16px 110px;
    }
    .card {
      background: #121224; border: 1px solid rgba(139,92,246,0.15);
      border-radius: 16px; padding: 14px; margin-bottom: 10px;
      display: flex; justify-content: space-between; gap: 10px;
    }
    .badge {
      font-size: 9px; padding: 3px 8px; border-radius: 8px;
      background: rgba(244,63,94,0.15); color: #fda4af; border: 1px solid rgba(244,63,94,0.25);
      font-weight: 600;
    }
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: calc(64px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(14,14,28,0.95); border-top: 1px solid rgba(139,92,246,0.15);
      display: flex; align-items: center; justify-content: space-between;
      padding-left: 24px; padding-right: 24px; z-index: 40;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: #94a3b8; text-decoration: none; font-size: 9px;
    }
    .nav-item i { font-size: 14px; }

    /* ===== DESKTOP ===== */
    .desktop-shell {
      width: 100%; min-height: 100vh; background: #07070F;
      display: flex; flex-direction: column;
    }
    .desk-topbar {
      height: 68px; background: #0B0B16; border-bottom: 1px solid rgba(139,92,246,0.15);
      display: flex; align-items: center; justify-content: space-between; padding: 0 28px; flex-shrink: 0;
    }
    .desk-content { flex: 1; overflow-y: auto; padding: 28px; }
    .desk-summary {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
    }
    .desk-sum-card {
      background: #121224; border: 1px solid rgba(139,92,246,0.15);
      border-radius: 18px; padding: 20px; position: relative; overflow: hidden;
    }
    .desk-sum-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .desk-sum-card.today::before { background: linear-gradient(90deg, #fb7185, #f43f5e); }
    .desk-sum-card.week::before { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    .desk-sum-card.month::before { background: linear-gradient(90deg, #a78bfa, #6C5CE7); }
    .desk-sum-card.total::before { background: linear-gradient(90deg, #34d399, #10b981); }
    .desk-toolbar {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 16px;
    }
    .desk-filters { display: flex; gap: 8px; }
    .desk-table-wrap {
      background: #121224; border: 1px solid rgba(139,92,246,0.15);
      border-radius: 18px; overflow: hidden;
    }
    .desk-table { width: 100%; border-collapse: collapse; }
    .desk-table th {
      text-align: left; padding: 14px 18px; font-size: 12px; color: #94a3b8;
      background: #0B0B16; border-bottom: 1px solid rgba(139,92,246,0.12); font-weight: 600;
    }
    .desk-table td {
      padding: 14px 18px; font-size: 13px; border-bottom: 1px solid rgba(139,92,246,0.08);
    }
    .desk-table tr:last-child td { border-bottom: none; }
    .desk-table tr:hover td { background: rgba(139,92,246,0.04); }

    /* Shared Modal */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.hidden { display: none; }
    .modal {
      width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
      background: #121224; border: 1px solid rgba(139,92,246,0.3); border-radius: 24px; padding: 24px;
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; font-weight: 500; }
    .field input, .field select {
      width: 100%; background: #191932; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #fff; outline: none;
    }
    .field input:focus, .field select:focus { border-color: #6C5CE7; }
    .btn-save {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(to right, #6C5CE7, #4F46E5); color: #fff;
      font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 6px;
    }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-delete {
      background: none; border: none; font-size: 11px; color: #64748b; cursor: pointer;
    }
    .btn-delete:hover { color: #fb7185; }
  </style>
</head>
<body>
  <!-- ==================== MOBILE ==================== -->
  <div class="mobile-only">
    <div class="iphone-frame">
      <div class="top-bar">
        <div style="display:flex;align-items:center;gap:12px;">
          <a href="dashboard.html" style="color:#cbd5e1;text-decoration:none;"><i class="fa-solid fa-arrow-left"></i></a>
          <div>
            <div style="font-weight:700;font-size:13px;color:#fff;letter-spacing:0.03em;">EXPENSES</div>
            <div style="font-size:10px;color:#94a3b8;">Track every business cost</div>
          </div>
        </div>
        <button class="btn-add" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add</button>
      </div>
      <div class="summary">
        <div class="sum-card">
          <div style="font-size:10px;color:#94a3b8;margin-bottom:4px;">Today</div>
          <div style="font-size:16px;font-weight:800;color:#fb7185;" id="sum-today">₦0</div>
        </div>
        <div class="sum-card month">
          <div style="font-size:10px;color:#94a3b8;margin-bottom:4px;">This Month</div>
          <div style="font-size:16px;font-weight:800;color:#fff;" id="sum-month">₦0</div>
        </div>
      </div>
      <div class="filters custom-scrollbar">
        <button class="filter-btn active" id="f-all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" id="f-today" onclick="setFilter('today')">Today</button>
        <button class="filter-btn" id="f-week" onclick="setFilter('week')">This Week</button>
        <button class="filter-btn" id="f-month" onclick="setFilter('month')">This Month</button>
      </div>
      <div class="list custom-scrollbar" id="expense-list">
        <div style="text-align:center;padding:64px 0;color:#64748b;font-size:12px;">Loading expenses…</div>
      </div>
      <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i>Dashboard</a>
        <a href="inventory.html" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i>Inventory</a>
        <a href="pos.html" class="nav-item"><i class="fa-solid fa-cash-register"></i>POS</a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i>Profile</a>
      </nav>
    </div>
  </div>

  <!-- ==================== DESKTOP ==================== -->
  <div class="desktop-only desktop-shell">
    <div class="desk-topbar">
      <div>
        <div style="font-weight:700;font-size:18px;color:#fff;">Expenses</div>
        <div style="font-size:12px;color:#94a3b8;">Track and control every business cost</div>
      </div>
      <button class="btn-add" onclick="openAddModal()" style="padding:10px 20px;font-size:13px;">
        <i class="fa-solid fa-plus"></i> Record Expense
      </button>
    </div>
    <div class="desk-content custom-scrollbar">
      <div class="desk-summary">
        <div class="desk-sum-card today">
          <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">Today</div>
          <div style="font-size:24px;font-weight:800;color:#fb7185;" id="desk-sum-today">₦0</div>
        </div>
        <div class="desk-sum-card week">
          <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">This Week</div>
          <div style="font-size:24px;font-weight:800;color:#fbbf24;" id="desk-sum-week">₦0</div>
        </div>
        <div class="desk-sum-card month">
          <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">This Month</div>
          <div style="font-size:24px;font-weight:800;color:#a78bfa;" id="desk-sum-month">₦0</div>
        </div>
        <div class="desk-sum-card total">
          <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">All Time</div>
          <div style="font-size:24px;font-weight:800;color:#34d399;" id="desk-sum-total">₦0</div>
        </div>
      </div>
      <div class="desk-toolbar">
        <div class="desk-filters">
          <button class="filter-btn active" id="df-all" onclick="setFilter('all')">All</button>
          <button class="filter-btn" id="df-today" onclick="setFilter('today')">Today</button>
          <button class="filter-btn" id="df-week" onclick="setFilter('week')">This Week</button>
          <button class="filter-btn" id="df-month" onclick="setFilter('month')">This Month</button>
        </div>
        <div style="font-size:13px;color:#94a3b8;" id="desk-count">0 expenses</div>
      </div>
      <div class="desk-table-wrap">
        <table class="desk-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Date</th>
              <th>Recorded By</th>
              <th style="text-align:right;">Action</th>
            </tr>
          </thead>
          <tbody id="desk-expense-body">
            <tr><td colspan="6" style="text-align:center;padding:48px;color:#64748b;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ADD MODAL (shared) -->
  <div id="add-modal" class="modal-bg hidden">
    <div class="modal custom-scrollbar">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
        <h3 style="margin:0;font-size:15px;font-weight:700;color:#fff;">
          <i class="fa-solid fa-receipt" style="color:#fb7185;margin-right:8px;"></i>Record Expense
        </h3>
        <button onclick="closeAddModal()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:16px;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="field">
        <label>What did you spend on? *</label>
        <input type="text" id="ex-title" placeholder="e.g. Fuel to market, Staff lunch">
      </div>
      <div class="field">
        <label>Category *</label>
        <select id="ex-category">
          <option value="Transport">Transport</option>
          <option value="Fuel">Fuel</option>
          <option value="Salary">Salary</option>
          <option value="Rent">Rent</option>
          <option value="Electricity">Electricity</option>
          <option value="Internet">Internet</option>
          <option value="Repairs">Repairs</option>
          <option value="Shop Supplies">Shop Supplies</option>
          <option value="Tax">Tax</option>
          <option value="Other" selected>Other</option>
        </select>
      </div>
      <div class="field">
        <label>Amount (₦) *</label>
        <input type="number" id="ex-amount" placeholder="e.g. 5000" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <input type="text" id="ex-notes" placeholder="Optional note">
      </div>
      <button onclick="saveExpense()" id="save-ex-btn" class="btn-save">Save Expense</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    let userCompanyId = null;
    let recordedBy = 'Owner';
    let allExpenses = [];
    let currentFilter = 'all';
    let isSaving = false;
    let isLoading = false;

    function formatCurrency(n) {
      return '₦' + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }
    function parseMoney(v) {
      if (v == null || v === '') return 0;
      if (typeof v === 'number') return isNaN(v) ? 0 : v;
      var n = parseFloat(String(v).replace(/[₦$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }
    function getLocalDateString(d) {
      var x = new Date(d);
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    }
    function formatTime(iso) {
      return new Date(iso).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }
    function formatFullDate(iso) {
      return new Date(iso).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }
    function openAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }
    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }
    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.mobile-only .filter-btn').forEach(function (b) { b.classList.remove('active'); });
      var mActive = document.getElementById('f-' + f);
      if (mActive) mActive.classList.add('active');
      document.querySelectorAll('.desktop-only .filter-btn').forEach(function (b) { b.classList.remove('active'); });
      var dActive = document.getElementById('df-' + f);
      if (dActive) dActive.classList.add('active');
      renderList();
    }
    function inFilter(ex) {
      var d = getLocalDateString(ex.created_at);
      var today = getLocalDateString(new Date());
      if (currentFilter === 'all') return true;
      if (currentFilter === 'today') return d === today;
      if (currentFilter === 'week') {
        var now = new Date();
        var day = now.getDay() || 7;
        var monday = new Date(now);
        monday.setDate(now.getDate() - day + 1);
        return d >= getLocalDateString(monday);
      }
      if (currentFilter === 'month') return d.indexOf(today.slice(0, 7)) === 0;
      return true;
    }
    function updateSummary() {
      var today = getLocalDateString(new Date());
      var monthPrefix = today.slice(0, 7);
      var now = new Date();
      var day = now.getDay() || 7;
      var monday = new Date(now);
      monday.setDate(now.getDate() - day + 1);
      var weekStart = getLocalDateString(monday);
      var t = 0, w = 0, m = 0, total = 0;
      allExpenses.forEach(function (ex) {
        var amt = parseMoney(ex.amount);
        var d = getLocalDateString(ex.created_at);
        total += amt;
        if (d === today) t += amt;
        if (d >= weekStart) w += amt;
        if (d.indexOf(monthPrefix) === 0) m += amt;
      });
      var elToday = document.getElementById('sum-today');
      var elMonth = document.getElementById('sum-month');
      if (elToday) elToday.textContent = formatCurrency(t);
      if (elMonth) elMonth.textContent = formatCurrency(m);
      var dToday = document.getElementById('desk-sum-today');
      var dWeek = document.getElementById('desk-sum-week');
      var dMonth = document.getElementById('desk-sum-month');
      var dTotal = document.getElementById('desk-sum-total');
      if (dToday) dToday.textContent = formatCurrency(t);
      if (dWeek) dWeek.textContent = formatCurrency(w);
      if (dMonth) dMonth.textContent = formatCurrency(m);
      if (dTotal) dTotal.textContent = formatCurrency(total);
    }
    function renderList() {
      var list = allExpenses.filter(inFilter);
      var container = document.getElementById('expense-list');
      if (container) {
        if (!list.length) {
          container.innerHTML = '<div style="text-align:center;padding:64px 0;color:#64748b;font-size:12px;">No expenses for this period.<br><span style="font-size:10px;">Tap + Add to record one.</span></div>';
        } else {
          container.innerHTML = list.map(function (ex) {
            return ''
              + '<div class="card">'
              + '<div style="min-width:0;flex:1;">'
              + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">'
              + '<span class="badge">' + (ex.category || 'Other') + '</span>'
              + '<span style="font-size:10px;color:#64748b;">' + formatTime(ex.created_at) + '</span>'
              + '</div>'
              + '<div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (ex.title || 'Expense') + '</div>'
              + (ex.notes ? '<div style="font-size:11px;color:#94a3b8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + ex.notes + '</div>' : '')
              + '<div style="font-size:10px;color:#64748b;margin-top:3px;">' + (ex.recorded_by || 'Owner') + '</div>'
              + '</div>'
              + '<div style="text-align:right;flex-shrink:0;">'
              + '<div style="font-weight:700;color:#fb7185;font-size:15px;">' + formatCurrency(ex.amount) + '</div>'
              + '<button class="btn-delete" onclick="deleteExpense(\'' + ex.id + '\')">Delete</button>'
              + '</div>'
              + '</div>';
          }).join('');
        }
      }
      var tbody = document.getElementById('desk-expense-body');
      var countEl = document.getElementById('desk-count');
      if (countEl) countEl.textContent = list.length + ' expense' + (list.length === 1 ? '' : 's');
      if (tbody) {
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:48px;color:#64748b;">No expenses for this period</td></tr>';
        } else {
          tbody.innerHTML = list.map(function (ex) {
            return ''
              + '<tr>'
              + '<td style="font-weight:600;color:#fff;">' + (ex.title || 'Expense') + (ex.notes ? '<div style="font-size:11px;color:#94a3b8;font-weight:400;margin-top:2px;">' + ex.notes + '</div>' : '') + '</td>'
              + '<td><span class="badge">' + (ex.category || 'Other') + '</span></td>'
              + '<td style="font-weight:700;color:#fb7185;">' + formatCurrency(ex.amount) + '</td>'
              + '<td style="color:#94a3b8;font-size:12px;">' + formatFullDate(ex.created_at) + '</td>'
              + '<td style="color:#94a3b8;">' + (ex.recorded_by || 'Owner') + '</td>'
              + '<td style="text-align:right;"><button class="btn-delete" onclick="deleteExpense(\'' + ex.id + '\')">Delete</button></td>'
              + '</tr>';
          }).join('');
        }
      }
    }
    async function loadExpenses() {
      if (!userCompanyId) return;
      if (isLoading) return;
      isLoading = true;
      try {
        var res = await supabaseClient
          .from('expenses')
          .select('id, title, category, amount, notes, recorded_by, created_at')
          .eq('company_id', userCompanyId)
          .order('created_at', { ascending: false })
          .limit(300);
        if (res.error) throw res.error;
        allExpenses = res.data || [];
        updateSummary();
        renderList();
      } catch (err) {
        var msg = err.message || 'Error loading';
        var el = document.getElementById('expense-list');
        if (el) el.innerHTML = '<div style="text-align:center;padding:64px 0;color:#fb7185;font-size:12px;">' + msg + '</div>';
        var tbody = document.getElementById('desk-expense-body');
        if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:48px;color:#fb7185;">' + msg + '</td></tr>';
      } finally {
        isLoading = false;
      }
    }
    async function saveExpense() {
      if (isSaving) return;
      var title = document.getElementById('ex-title').value.trim();
      var category = document.getElementById('ex-category').value;
      var amount = parseFloat(document.getElementById('ex-amount').value);
      var notes = document.getElementById('ex-notes').value.trim();
      if (!title) return alert('Enter what you spent on');
      if (!amount || amount <= 0) return alert('Enter a valid amount');
      if (!userCompanyId) return alert('Company not loaded. Refresh page.');
      isSaving = true;
      var btn = document.getElementById('save-ex-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        var res = await supabaseClient.from('expenses').insert([{
          company_id: userCompanyId,
          title: title,
          category: category,
          amount: amount,
          notes: notes || null,
          recorded_by: recordedBy
        }]);
        if (res.error) throw res.error;
        document.getElementById('ex-title').value = '';
        document.getElementById('ex-amount').value = '';
        document.getElementById('ex-notes').value = '';
        document.getElementById('ex-category').value = 'Other';
        closeAddModal();
        await loadExpenses();
      } catch (err) {
        alert(err.message || 'Could not save');
      } finally {
        isSaving = false;
        btn.disabled = false;
        btn.textContent = 'Save Expense';
      }
    }
    async function deleteExpense(id) {
      if (!confirm('Delete this expense?')) return;
      try {
        var res = await supabaseClient
          .from('expenses')
          .delete()
          .eq('id', id)
          .eq('company_id', userCompanyId);
        if (res.error) throw res.error;
        await loadExpenses();
      } catch (err) {
        alert(err.message || 'Could not delete');
      }
    }
    async function init() {
      try {
        var sessionRes = await supabaseClient.auth.getSession();
        var session = sessionRes.data && sessionRes.data.session;
        if (!session || !session.user) {
          window.location.replace('index.html');
          return;
        }
        var user = session.user;
        recordedBy = ((user.user_metadata && user.user_metadata.full_name) || (user.email && user.email.split('@')[0]) || 'Owner').split(' ')[0];
        var memberRes = await supabaseClient
          .from('company_users')
          .select('company_id')
          .eq('user_id', user.id)
          .maybeSingle();
        var member = memberRes.data;
        if (member && member.company_id) {
          userCompanyId = member.company_id;
        } else {
          var ownedRes = await supabaseClient
            .from('companies').select('id').eq('owner_id', user.id).maybeSingle();
          if (ownedRes.data && ownedRes.data.id) userCompanyId = ownedRes.data.id;
        }
        if (!userCompanyId) {
          var el = document.getElementById('expense-list');
          if (el) el.innerHTML = '<div style="text-align:center;padding:64px 0;color:#64748b;font-size:12px;">No business found. Please re-login.</div>';
          return;
        }
        await loadExpenses();
      } catch (err) {
        console.error(err);
        var el = document.getElementById('expense-list');
        if (el) el.innerHTML = '<div style="text-align:center;padding:64px 0;color:#fb7185;font-size:12px;">Could not load. Refresh page.</div>';
      }
    }
    function enforceView() {
      var isDesktop = window.innerWidth >= 1024;
      document.querySelectorAll('.mobile-only').forEach(function (el) {
        el.style.display = isDesktop ? 'none' : 'block';
      });
      document.querySelectorAll('.desktop-only').forEach(function (el) {
        el.style.display = isDesktop ? 'flex' : 'none';
      });
    }
    window.addEventListener('resize', enforceView);
    window.addEventListener('DOMContentLoaded', function () {
      enforceView();
      init();
    });
  </script>
</body>
</html>
