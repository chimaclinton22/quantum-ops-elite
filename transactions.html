<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History - Quantum OPS Elite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { bg: '#07070F', card: '#121224', purple: '#6C5CE7' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }
    .iphone-frame {
      width: 100%; max-width: 410px; height: 100vh; max-height: 860px;
      background: #0B0B16; border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 0 25px 50px -12px rgba(15, 13, 35, 0.7);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }
    @media (min-width: 768px) {
      body { align-items: center; justify-content: center; display: flex; height: 100vh; }
      .iphone-frame { border-radius: 48px; }
    }
    .tab-active { background: #6C5CE7; color: white; }
    .tab-inactive { background: #121224; color: #94a3b8; border: 1px solid rgba(139,92,246,0.15); }
  </style>
</head>
<body>
  <div class="iphone-frame">
    
    <!-- TOP BAR -->
    <div class="px-4 pt-3 pb-3 flex items-center justify-between bg-[#0B0B16]/90 backdrop-blur-md z-30 flex-shrink-0 border-b border-purple-500/10">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="text-slate-300 hover:text-white transition">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div>
          <h2 class="font-bold tracking-wider text-xs text-white">BUSINESS HISTORY</h2>
          <p class="text-[9px] text-slate-400">Permanent records — never deleted</p>
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div class="px-4 py-2.5 flex gap-2 flex-shrink-0 bg-[#0B0B16]/90 border-b border-purple-500/10">
      <button onclick="setView('transactions')" id="tab-transactions" class="tab-active px-3 py-1.5 rounded-xl text-[11px] font-semibold transition flex-1">Transactions</button>
      <button onclick="setView('sales')" id="tab-sales" class="tab-inactive px-3 py-1.5 rounded-xl text-[11px] font-semibold transition flex-1">Sales</button>
      <button onclick="setView('profit')" id="tab-profit" class="tab-inactive px-3 py-1.5 rounded-xl text-[11px] font-semibold transition flex-1">Profit</button>
    </div>

    <!-- FILTERS + SEARCH -->
    <div class="px-4 py-2 space-y-2 flex-shrink-0 border-b border-purple-500/10 bg-[#0B0B16]/90">
      <div class="flex gap-1.5 overflow-x-auto custom-scrollbar">
        <button onclick="setPeriod('today')" id="period-today" class="period-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-purple-600 text-white flex-shrink-0">Today</button>
        <button onclick="setPeriod('week')" id="period-week" class="period-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 flex-shrink-0">This Week</button>
        <button onclick="setPeriod('month')" id="period-month" class="period-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 flex-shrink-0">This Month</button>
        <button onclick="setPeriod('all')" id="period-all" class="period-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 flex-shrink-0">All Time</button>
      </div>
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-[10px]"></i>
        <input type="text" id="search-input" oninput="applyFilters()" placeholder="Search customer, product, receipt #, payment..." class="w-full bg-[#121224] border border-purple-500/15 rounded-xl pl-8 pr-3 py-2 text-[11px] text-white placeholder-slate-500 focus:outline-none focus:border-purple-500">
      </div>
    </div>

    <!-- SUMMARY BAR -->
    <div class="px-4 py-2.5 flex items-center justify-between bg-[#121224]/80 border-b border-purple-500/10 flex-shrink-0">
      <div>
        <p class="text-[9px] text-slate-400" id="summary-label">Showing</p>
        <p class="text-xs font-bold text-white" id="summary-count">0 records</p>
      </div>
      <div class="text-right">
        <p class="text-[9px] text-slate-400" id="summary-amount-label">Total</p>
        <p class="text-xs font-bold text-purple-300" id="summary-amount">₦0</p>
      </div>
    </div>

    <!-- LIST -->
    <div class="flex-1 overflow-y-auto px-4 py-3 custom-scrollbar pb-20" id="history-list">
      <div class="text-center py-16 text-slate-500 text-xs">Loading history...</div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-[#0E0E1C]/95 backdrop-blur-xl border-t border-purple-500/15 px-6 flex items-center justify-between z-40">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-gauge-high text-sm"></i>
        <span class="text-[9px] font-medium">Dashboard</span>
      </a>
      <a href="inventory.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-boxes-stacked text-sm"></i>
        <span class="text-[9px] font-medium">Inventory</span>
      </a>
      <a href="pos.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-cash-register text-sm"></i>
        <span class="text-[9px] font-medium">POS Sales</span>
      </a>
      <a href="transactions.html" class="flex flex-col items-center gap-1 text-purple-400">
        <i class="fa-solid fa-clock-rotate-left text-sm"></i>
        <span class="text-[9px] font-medium">History</span>
      </a>
    </nav>
  </div>

  <!-- DETAIL MODAL -->
  <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-[#121224] border border-purple-500/30 rounded-3xl p-5 space-y-3 shadow-2xl max-h-[85vh] overflow-y-auto custom-scrollbar">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white">Receipt Details</h3>
        <button onclick="closeDetail()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="detail-content" class="text-xs space-y-2 text-slate-300"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userCompanyId = null;
    let allSales = [];
    let currentView = 'transactions'; // transactions | sales | profit
    let currentPeriod = 'all';

    // Read ?view= from URL
    const urlParams = new URLSearchParams(window.location.search);
    if (['transactions', 'sales', 'profit'].includes(urlParams.get('view'))) {
      currentView = urlParams.get('view');
    }

    function formatCurrency(n) {
      return '₦' + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function getLocalDateString(d) {
      const x = new Date(d);
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    }

    function formatDateLabel(dateStr) {
      const today = getLocalDateString(new Date());
      const yesterday = getLocalDateString(new Date(Date.now() - 86400000));
      if (dateStr === today) return 'Today';
      if (dateStr === yesterday) return 'Yesterday';
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function setView(view) {
      currentView = view;
      ['transactions', 'sales', 'profit'].forEach(v => {
        const el = document.getElementById('tab-' + v);
        el.className = (v === view ? 'tab-active' : 'tab-inactive') + ' px-3 py-1.5 rounded-xl text-[11px] font-semibold transition flex-1';
      });
      applyFilters();
    }

    function setPeriod(period) {
      currentPeriod = period;
      document.querySelectorAll('.period-btn').forEach(b => {
        b.className = 'period-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 flex-shrink-0';
      });
      const active = document.getElementById('period-' + period);
      if (active) active.className = 'period-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-purple-600 text-white flex-shrink-0';
      applyFilters();
    }

    function inPeriod(saleDateStr) {
      const today = getLocalDateString(new Date());
      if (currentPeriod === 'all') return true;
      if (currentPeriod === 'today') return saleDateStr === today;
      if (currentPeriod === 'week') {
        const d = new Date();
        const day = d.getDay() || 7;
        const monday = new Date(d);
        monday.setDate(d.getDate() - day + 1);
        return saleDateStr >= getLocalDateString(monday);
      }
      if (currentPeriod === 'month') {
        return saleDateStr.startsWith(today.slice(0, 7));
      }
      return true;
    }

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }

      const { data: member } = await supabaseClient
        .from('company_users')
        .select('company_id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (member?.company_id) {
        userCompanyId = member.company_id;
      } else {
        const { data: owned } = await supabaseClient
          .from('companies').select('id').eq('owner_id', user.id).maybeSingle();
        if (owned?.id) userCompanyId = owned.id;
      }

      if (!userCompanyId) {
        document.getElementById('history-list').innerHTML =
          '<div class="text-center py-16 text-slate-500 text-xs">No company found. Please re-login.</div>';
        return;
      }

      const { data, error } = await supabaseClient
        .from('sales')
        .select('*')
        .eq('company_id', userCompanyId)
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('history-list').innerHTML =
          '<div class="text-center py-16 text-rose-400 text-xs">Error loading history.</div>';
        return;
      }

      allSales = data || [];
      setView(currentView);
      setPeriod(currentPeriod === 'today' && urlParams.get('view') ? 'today' : 'all');
    }

    function applyFilters() {
      const keyword = (document.getElementById('search-input')?.value || '').toLowerCase();

      let filtered = allSales.filter(s => {
        const dateStr = getLocalDateString(s.created_at);
        if (!inPeriod(dateStr)) return false;
        if (!keyword) return true;

        const itemsText = Array.isArray(s.items)
          ? s.items.map(i => (i.name || '') + ' ' + (i.product_name || '')).join(' ')
          : '';
        const hay = [
          s.customer_name, s.cashier_name, s.payment_method,
          s.sale_number, s.transaction_id, itemsText
        ].join(' ').toLowerCase();
        return hay.includes(keyword);
      });

      if (currentView === 'transactions') renderTransactions(filtered);
      else if (currentView === 'sales') renderDailyAggregate(filtered, 'sales');
      else renderDailyAggregate(filtered, 'profit');
    }

    function renderTransactions(sales) {
      const container = document.getElementById('history-list');
      let total = 0;
      sales.forEach(s => total += parseFloat(s.total_amount || s.total || 0));

      document.getElementById('summary-label').textContent = 'Transactions';
      document.getElementById('summary-count').textContent = sales.length + ' records';
      document.getElementById('summary-amount-label').textContent = 'Total Sales';
      document.getElementById('summary-amount').textContent = formatCurrency(total);

      if (sales.length === 0) {
        container.innerHTML = '<div class="text-center py-16 text-slate-500 text-xs">No transactions found for this period.</div>';
        return;
      }

      // Group by date
      const groups = {};
      sales.forEach(s => {
        const d = getLocalDateString(s.created_at);
        if (!groups[d]) groups[d] = [];
        groups[d].push(s);
      });

      let html = '';
      Object.keys(groups).forEach(dateStr => {
        html += `<div class="mb-4">
          <p class="text-[10px] font-bold text-purple-300 mb-2 sticky top-0 bg-[#0B0B16]/95 py-1">${formatDateLabel(dateStr)}</p>`;
        groups[dateStr].forEach(s => {
          const amount = parseFloat(s.total_amount || s.total || 0);
          const profit = parseFloat(s.profit || s.total_profit || 0);
          let itemLabel = 'Sale';
          if (Array.isArray(s.items) && s.items.length) {
            itemLabel = s.items[0].name || s.items[0].product_name || 'Sale';
            if (s.items.length > 1) itemLabel += ` +${s.items.length - 1} more`;
          }
          const receiptNo = s.sale_number || s.transaction_id || s.id.slice(0, 8);

          html += `
            <div onclick="showDetail('${s.id}')" class="bg-[#121224] border border-purple-500/15 p-3 rounded-2xl mb-2 cursor-pointer hover:border-purple-500/40 transition">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="w-8 h-8 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-[11px] flex-shrink-0">
                    <i class="fa-solid fa-receipt"></i>
                  </div>
                  <div class="min-w-0">
                    <p class="font-semibold text-white text-[11px] truncate">${itemLabel}</p>
                    <p class="text-[9px] text-slate-400">${formatTime(s.created_at)} · ${s.customer_name || 'Walk-in'} · ${s.payment_method || 'Cash'}</p>
                    <p class="text-[8px] text-slate-500 mt-0.5">#${receiptNo}</p>
                  </div>
                </div>
                <div class="text-right flex-shrink-0">
                  <p class="font-bold text-emerald-400 text-[11px]">${formatCurrency(amount)}</p>
                  <p class="text-[9px] text-slate-400">P: ${formatCurrency(profit)}</p>
                </div>
              </div>
            </div>`;
        });
        html += '</div>';
      });
      container.innerHTML = html;
    }

    function renderDailyAggregate(sales, mode) {
      const container = document.getElementById('history-list');
      const byDay = {};

      sales.forEach(s => {
        const d = getLocalDateString(s.created_at);
        if (!byDay[d]) byDay[d] = { sales: 0, profit: 0, count: 0 };
        byDay[d].sales += parseFloat(s.total_amount || s.total || 0);
        byDay[d].profit += parseFloat(s.profit || s.total_profit || 0);
        byDay[d].count += 1;
      });

      const days = Object.keys(byDay).sort((a, b) => b.localeCompare(a));
      let grand = 0;
      days.forEach(d => grand += mode === 'profit' ? byDay[d].profit : byDay[d].sales);

      document.getElementById('summary-label').textContent = mode === 'profit' ? 'Profit by day' : 'Sales by day';
      document.getElementById('summary-count').textContent = days.length + ' days · ' + sales.length + ' txns';
      document.getElementById('summary-amount-label').textContent = mode === 'profit' ? 'Total Profit' : 'Total Sales';
      document.getElementById('summary-amount').textContent = formatCurrency(grand);

      if (days.length === 0) {
        container.innerHTML = '<div class="text-center py-16 text-slate-500 text-xs">No records for this period.</div>';
        return;
      }

      let html = '';
      days.forEach(d => {
        const val = mode === 'profit' ? byDay[d].profit : byDay[d].sales;
        html += `
          <div class="bg-[#121224] border border-purple-500/15 p-3.5 rounded-2xl mb-2 flex items-center justify-between">
            <div>
              <p class="font-semibold text-white text-xs">${formatDateLabel(d)}</p>
              <p class="text-[9px] text-slate-400">${byDay[d].count} transaction${byDay[d].count !== 1 ? 's' : ''}</p>
            </div>
            <div class="text-right">
              <p class="font-bold ${mode === 'profit' ? 'text-emerald-400' : 'text-purple-300'} text-sm">${formatCurrency(val)}</p>
              ${mode === 'sales' ? `<p class="text-[9px] text-slate-400">Profit ${formatCurrency(byDay[d].profit)}</p>` : ''}
            </div>
          </div>`;
      });
      container.innerHTML = html;
    }

    function showDetail(id) {
      const s = allSales.find(x => x.id === id);
      if (!s) return;
      const amount = parseFloat(s.total_amount || s.total || 0);
      const profit = parseFloat(s.profit || s.total_profit || 0);
      let itemsHtml = '';
      if (Array.isArray(s.items) && s.items.length) {
        s.items.forEach(i => {
          const q = i.qty || i.quantity || 1;
          const p = parseFloat(i.price || 0);
          itemsHtml += `<div class="flex justify-between py-1 border-b border-purple-500/10">
            <span>${i.name || i.product_name || 'Item'} × ${q}</span>
            <span class="text-white font-medium">${formatCurrency(p * q)}</span>
          </div>`;
        });
      } else {
        itemsHtml = '<p class="text-slate-500">No line items stored</p>';
      }

      document.getElementById('detail-content').innerHTML = `
        <div class="space-y-1">
          <p><span class="text-slate-500">Receipt:</span> <span class="text-white font-mono">${s.sale_number || s.transaction_id || s.id.slice(0,8)}</span></p>
          <p><span class="text-slate-500">Date:</span> ${new Date(s.created_at).toLocaleString()}</p>
          <p><span class="text-slate-500">Customer:</span> ${s.customer_name || 'Walk-in'}</p>
          <p><span class="text-slate-500">Cashier:</span> ${s.cashier_name || 'Staff'}</p>
          <p><span class="text-slate-500">Payment:</span> ${s.payment_method || 'Cash'}</p>
        </div>
        <div class="pt-2 border-t border-purple-500/20">
          <p class="text-[10px] text-slate-400 mb-1 font-semibold">ITEMS</p>
          ${itemsHtml}
        </div>
        <div class="pt-2 border-t border-purple-500/20 space-y-1">
          <div class="flex justify-between"><span class="text-slate-400">Total</span><span class="text-white font-bold">${formatCurrency(amount)}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Profit</span><span class="text-emerald-400 font-bold">${formatCurrency(profit)}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Paid</span><span class="text-white">${formatCurrency(s.paid_amount || amount)}</span></div>
        </div>`;
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetail() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
