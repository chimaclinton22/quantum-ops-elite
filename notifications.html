<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Quantum OPS Elite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { bg: '#07070F', card: '#121224', purple: '#6C5CE7' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }
    .iphone-frame {
      width: 100%; max-width: 410px; height: 100vh; max-height: 860px;
      background: #0B0B16; border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 0 25px 50px -12px rgba(15, 13, 35, 0.7);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }
    @media (min-width: 768px) {
      body { align-items: center; justify-content: center; display: flex; height: 100vh; }
      .iphone-frame { border-radius: 48px; }
    }
  </style>
</head>
<body>
  <div class="iphone-frame">
    <div class="px-4 pt-3 pb-3 flex items-center justify-between bg-[#0B0B16]/90 backdrop-blur-md z-30 flex-shrink-0 border-b border-purple-500/10">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="text-slate-300 hover:text-white transition">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div>
          <h2 class="font-bold tracking-wider text-xs text-white">NOTIFICATIONS</h2>
          <p class="text-[9px] text-slate-400">What needs your attention</p>
        </div>
      </div>
      <button onclick="markAllRead()" class="text-[10px] text-purple-300 font-semibold hover:text-white transition">
        Mark all read
      </button>
    </div>

    <div class="flex-1 overflow-y-auto px-4 py-3 custom-scrollbar pb-20" id="notif-list">
      <div class="text-center py-16 text-slate-500 text-xs">Loading…</div>
    </div>

    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-[#0E0E1C]/95 backdrop-blur-xl border-t border-purple-500/15 px-6 flex items-center justify-between z-40">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-gauge-high text-sm"></i><span class="text-[9px] font-medium">Dashboard</span>
      </a>
      <a href="inventory.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-boxes-stacked text-sm"></i><span class="text-[9px] font-medium">Inventory</span>
      </a>
      <a href="pos.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-cash-register text-sm"></i><span class="text-[9px] font-medium">POS</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-user text-sm"></i><span class="text-[9px] font-medium">Profile</span>
      </a>
    </nav>
  </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userCompanyId = null;
    let allNotifs = [];

    function getLocalDateString(d) {
      const x = new Date(d);
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    }

    function formatDateLabel(dateStr) {
      const today = getLocalDateString(new Date());
      const yesterday = getLocalDateString(new Date(Date.now() - 86400000));
      if (dateStr === today) return 'Today';
      if (dateStr === yesterday) return 'Yesterday';
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function typeIcon(type) {
      const map = {
        low_stock: '⚠️',
        debt: '💰',
        ai: '🤖',
        sale: '✅',
        summary: '📊',
        system: '🔔'
      };
      return map[type] || '🔔';
    }

    function typeColor(type) {
      const map = {
        low_stock: 'border-amber-500/30 bg-amber-500/10',
        debt: 'border-rose-500/30 bg-rose-500/10',
        ai: 'border-purple-500/30 bg-purple-500/10',
        sale: 'border-emerald-500/30 bg-emerald-500/10',
        summary: 'border-blue-500/30 bg-blue-500/10',
        system: 'border-slate-500/30 bg-slate-500/10'
      };
      return map[type] || 'border-purple-500/20 bg-[#121224]';
    }

    function renderList() {
      const container = document.getElementById('notif-list');
      if (!allNotifs.length) {
        container.innerHTML = `
          <div class="text-center py-16 text-slate-500 text-xs">
            No notifications yet.<br>
            <span class="text-[10px]">Low stock, debts, and AI tips will appear here.</span>
          </div>`;
        return;
      }

      const groups = {};
      allNotifs.forEach(n => {
        const d = getLocalDateString(n.created_at);
        if (!groups[d]) groups[d] = [];
        groups[d].push(n);
      });

      let html = '';
      Object.keys(groups).forEach(dateStr => {
        html += `<p class="text-[10px] font-bold text-purple-300 mb-2 mt-3 first:mt-0">${formatDateLabel(dateStr)}</p>`;
        groups[dateStr].forEach(n => {
          const unread = !n.is_read;
          html += `
            <div onclick="markRead('${n.id}')" class="mb-2 p-3 rounded-2xl border ${typeColor(n.type)} ${unread ? 'ring-1 ring-purple-500/40' : 'opacity-80'} cursor-pointer transition">
              <div class="flex items-start gap-2">
                <span class="text-base leading-none mt-0.5">${typeIcon(n.type)}</span>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between gap-2">
                    <p class="text-[12px] font-semibold text-white truncate">${n.title || 'Notification'}</p>
                    <span class="text-[9px] text-slate-500 flex-shrink-0">${formatTime(n.created_at)}</span>
                  </div>
                  <p class="text-[11px] text-slate-300 mt-0.5 leading-relaxed">${n.message || ''}</p>
                  ${unread ? '<p class="text-[9px] text-purple-300 mt-1">Unread</p>' : ''}
                </div>
              </div>
            </div>`;
        });
      });
      container.innerHTML = html;
    }

    async function loadNotifications() {
      if (!userCompanyId) return;
      const { data, error } = await supabaseClient
        .from('notifications')
        .select('*')
        .eq('company_id', userCompanyId)
        .order('created_at', { ascending: false })
        .limit(100);

      if (error) {
        document.getElementById('notif-list').innerHTML =
          `<div class="text-center py-16 text-rose-400 text-xs">${error.message}</div>`;
        return;
      }
      allNotifs = data || [];
      renderList();
    }

    async function markRead(id) {
      const n = allNotifs.find(x => x.id === id);
      if (!n || n.is_read) return;
      await supabaseClient.from('notifications').update({ is_read: true }).eq('id', id);
      n.is_read = true;
      renderList();
    }

    async function markAllRead() {
      if (!userCompanyId) return;
      await supabaseClient
        .from('notifications')
        .update({ is_read: true })
        .eq('company_id', userCompanyId)
        .eq('is_read', false);
      allNotifs.forEach(n => { n.is_read = true; });
      renderList();
    }

    async function init() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }

      const { data: member } = await supabaseClient
        .from('company_users')
        .select('company_id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (member?.company_id) {
        userCompanyId = member.company_id;
      } else {
        const { data: owned } = await supabaseClient
          .from('companies').select('id').eq('owner_id', user.id).maybeSingle();
        if (owned?.id) userCompanyId = owned.id;
      }

      if (!userCompanyId) {
        document.getElementById('notif-list').innerHTML =
          '<div class="text-center py-16 text-slate-500 text-xs">No business found.</div>';
        return;
      }

      await loadNotifications();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
