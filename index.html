      top: 50%;
      transform: translateY(-50%);
      color: #64748B;
      font-size: 13px;

    .input-wrap input,

      box-shadow: 0 0 0 3px rgba(139,92,255,0.15);
    }
    .input-wrap input::placeholder { color: #475569; }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      color: #64748B;
      cursor: pointer;
      font-size: 14px;

        </div>

        <div id="country-field" class="field hidden">
          <label for="country">Country <span style="color:#FF5A7A;">*</span></label>
          <div class="input-wrap">

            <select id="country" name="country">

            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" autocomplete="new-password">

          <i class="fa-solid fa-arrow-right" style="font-size:12px;"></i>
        </button>

    function populateCountrySelect() {
      const sel = document.getElementById("country");
      if (!sel) return;
      // Keep first placeholder option, then add sorted countries (Nigeria first)
      const sorted = COUNTRIES.slice().sort(function (a, b) {
        if (a.code === "NG") return -1;
        if (b.code === "NG") return 1;
        return a.name.localeCompare(b.name);
      });
      sorted.forEach(function (c) {
        const opt = document.createElement("option");
        opt.value = c.code;
        opt.textContent = c.name + " (" + c.symbol + " " + c.currency + ")";
        sel.appendChild(opt);
      });
    }
    populateCountrySelect();

    function getCountryData(code) {
      if (!code) return null;
      for (let i = 0; i < COUNTRIES.length; i++) {
        if (COUNTRIES[i].code === code) return COUNTRIES[i];
      }
      return null;
    }

    /* Phone → dashboard.html | Desktop → desktop.html */
    function getDashboardTarget() {
      const ua = navigator.userAgent || "";
      const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      const isSmallScreen = window.innerWidth < 1024;
      if (isMobileUA || isSmallScreen) return "dashboard.html";
      return "desktop.html";
    }

    function goToApp() {
      const target = getDashboardTarget();
      window.location.replace(target);
    }

    async function checkExistingSession() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          goToApp();
        }
      } catch (e) {}
    }
    checkExistingSession();

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function showAlert(msg, isError) {
      const alertBox = document.getElementById("alert");
      const alertText = document.getElementById("alert-text");
      const alertIcon = document.getElementById("alert-icon");
      alertText.textContent = msg;
      alertBox.className = "alert show " + (isError ? "error" : "success");
      alertIcon.className = isError ? "fa-solid fa-circle-exclamation" : "fa-solid fa-circle-check";
    }

    function setBusy(busy) {
      isBusy = busy;
      const btn = document.getElementById("submit-btn");
      btn.disabled = busy;
      const span = btn.querySelector("span");
      if (span) {
        if (busy) {
          span.setAttribute("data-old", span.textContent);
          span.textContent = currentMode === "signup" ? "Creating account…" : "Signing in…";
        } else if (span.getAttribute("data-old")) {
          span.textContent = span.getAttribute("data-old");
          span.removeAttribute("data-old");
        }
      }
    }

    function showSignUp() {
      currentMode = "signup";
      document.getElementById("form-title").textContent = "Create your Elite account";
      document.getElementById("form-subtitle").textContent = "Start managing your business in minutes";
      document.getElementById("name-field").classList.remove("hidden");
      document.getElementById("confirm-field").classList.remove("hidden");
      document.getElementById("country-field").classList.remove("hidden");
      document.getElementById("trial-badge").classList.add("show");
      document.getElementById("submit-btn").querySelector("span").textContent = "Create Account";
      document.getElementById("password").setAttribute("autocomplete", "new-password");
      document.getElementById("toggle-signup").classList.add("hidden");
      document.getElementById("toggle-login").classList.remove("hidden");
      document.getElementById("alert").classList.remove("show");
    }

    function showLogin() {
      currentMode = "login";
      document.getElementById("form-title").textContent = "Sign in to your account";
      document.getElementById("form-subtitle").textContent = "Enter your email and password to continue";

      document.getElementById("confirm-field").classList.add("hidden");

      document.getElementById("toggle-signup").classList.remove("hidden");
      document.getElementById("toggle-login").classList.add("hidden");

    async function createCompanyForUser(user, shopName, countryData) {
      const name = (shopName && shopName.trim())
        ? shopName.trim()
        : (user.email ? user.email.split("@")[0] : "My Business");

      // Defaults if no country provided (login fallback)
      const c = countryData || {
        code: "NG",
        name: "Nigeria",
        currency: "NGN",
        symbol: "₦",
        language: "en"
      };

      const { data: existing } = await supabaseClient
        .from("companies")
        .select("id")
        .eq("owner_id", user.id)
        .maybeSingle();

      if (existing && existing.id) {
        const { data: link } = await supabaseClient
          .from("company_users")
          .select("id")
          .eq("user_id", user.id)
          .eq("company_id", existing.id)
          .maybeSingle();
        if (!link) {
          await supabaseClient.from("company_users").insert([{
            company_id: existing.id,
            user_id: user.id,
            role: "owner"
          }]);
        }
        return existing;
      }

      const trialEnds = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString();
      const { data: company, error: companyError } = await supabaseClient
        .from("companies")
        .insert([{
          owner_id: user.id,
          company_name: name,
          country_code: c.code,
          country_name: c.name,
          currency: c.currency,
          currency_symbol: c.symbol,
          language: c.language || "en",
          subscription_status: "trial",
          trial_ends_at: trialEnds
        }])
        .select()
        .single();

      if (companyError) throw new Error("Could not create business: " + companyError.message);

      const { error: linkError } = await supabaseClient
        .from("company_users")
        .insert([{
          company_id: company.id,
          user_id: user.id,
          role: "owner"
        }]);

      if (linkError) throw new Error("Could not link account: " + linkError.message);
      return company;
    }

    document.getElementById("auth-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      if (isBusy) return;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const fullName = document.getElementById("full_name").value.trim();
      const confirmPassword = document.getElementById("confirm_password").value;
      const countryCode = document.getElementById("country").value;

      setBusy(true);
      document.getElementById("alert").classList.remove("show");

      try {
        if (currentMode === "signup") {
          if (!fullName) throw new Error("Please enter your Full Name or Shop Name");
          if (!countryCode) throw new Error("Please select your country");
          if (!password || password.length < 6) throw new Error("Password must be at least 6 characters");
          if (password !== confirmPassword) throw new Error("Passwords do not match");

          const countryData = getCountryData(countryCode);
          if (!countryData) throw new Error("Please select a valid country");

          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: fullName,
                country_code: countryData.code,
                country_name: countryData.name
              }
            }
          });
          if (error) throw error;
          if (!data.user) throw new Error("Account created but something went wrong. Please try again.");

          try {
            await createCompanyForUser(data.user, fullName, countryData);
          } catch (ce) {
            console.error(ce);
          }

          showAlert("Account created successfully! Please sign in.", false);
          setTimeout(function () {
            showLogin();
            document.getElementById("email").value = email;
            document.getElementById("password").value = "";
            document.getElementById("country").value = "";
          }, 1400);

        } else {
          if (!password) throw new Error("Please enter your password");

          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });
          if (error) throw error;
          if (!data.user) throw new Error("Login failed. Please try again.");

          const { data: link } = await supabaseClient
            .from("company_users")
            .select("id")
            .eq("user_id", data.user.id)
            .maybeSingle();

          if (!link) {
            const name = (data.user.user_metadata && data.user.user_metadata.full_name)
              || (data.user.email ? data.user.email.split("@")[0] : "My Business");
            // Prefer country from user_metadata if present, else NG defaults
            let countryData = null;
            if (data.user.user_metadata && data.user.user_metadata.country_code) {
              countryData = getCountryData(data.user.user_metadata.country_code);
            }
            await createCompanyForUser(data.user, name, countryData);
          }

          showAlert("Login successful! Redirecting…", false);
          setTimeout(goToApp, 500);
        }
      } catch (err) {
        showAlert(err.message || "Something went wrong. Please try again.", true);
      } finally {
        setBusy(false);
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js")
          .then(function (reg) { console.log("SW registered:", reg.scope); })
          .catch(function (err) { console.log("SW failed:", err); });
      });
    }
  </script>
</body>
</html>
