<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>Quantum OPS Elite - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05060B;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #F8FAFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #101326;
      border: 1px solid rgba(139,92,255,0.25);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 0 40px rgba(108,92,231,0.12);
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .logo-box {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6C5CE7, #4F46E5);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
      color: #fff;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(108,92,231,0.35);
    }
    .logo-area h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .logo-area p {
      font-size: 11px;
      color: #A78BFA;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }
    .form-title {
      text-align: center;
      margin-bottom: 24px;
    }
    .form-title h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .form-title p {
      font-size: 13px;
      color: #94A3B8;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: #A8B3CF;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i.left-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748B;
      font-size: 13px;
    }
    .input-wrap input {
      width: 100%;
      background: #0B0B16;
      border: 1px solid rgba(139,92,255,0.2);
      border-radius: 12px;
      padding: 13px 44px 13px 40px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-wrap input:focus {
      border-color: #8B5CFF;
    }
    .input-wrap input::placeholder {
      color: #475569;
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748B;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }
    .toggle-password:hover {
      color: #A78BFA;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #5B3DFF, #8B5CFF);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
    }
    .alert.show {
      display: flex;
    }
    .alert.error {
      background: rgba(255,90,122,0.12);
      border: 1px solid rgba(255,90,122,0.3);
      color: #FF5A7A;
    }
    .alert.success {
      background: rgba(34,245,160,0.1);
      border: 1px solid rgba(34,245,160,0.3);
      color: #22F5A0;
    }
    .toggle-mode {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #94A3B8;
      border-top: 1px solid rgba(139,92,255,0.12);
      padding-top: 20px;
    }
    .toggle-mode a {
      color: #A78BFA;
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }
    .toggle-mode a:hover {
      text-decoration: underline;
    }
    .hidden {
      display: none !important;
    }
    @media (min-width: 640px) {
      .auth-card {
        padding: 40px 36px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-area">
      <div class="logo-box">Q</div>
      <h1>QUANTUM OPS</h1>
      <p>AI BUSINESS OS</p>
    </div>
    <div class="form-title">
      <h2 id="form-title">Sign in to your account</h2>
      <p id="form-subtitle">Enter your email and password to continue</p>
    </div>
    <div id="alert" class="alert">
      <i id="alert-icon" class="fa-solid fa-circle-info"></i>
      <span id="alert-text"></span>
    </div>
    <form id="auth-form">
      <!-- Full Name (Signup only) -->
      <div id="name-field" class="field hidden">
        <label>Full Name / Shop Name</label>
        <div class="input-wrap">
          <i class="fa-regular fa-user left-icon"></i>
          <input type="text" id="full_name" placeholder="e.g. Rise Beyond">
        </div>
      </div>
      <!-- Email -->
      <div class="field">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fa-regular fa-envelope left-icon"></i>
          <input type="email" id="email" required placeholder="owner@company.com">
        </div>
      </div>
      <!-- Password -->
      <div id="password-field" class="field">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock left-icon"></i>
          <input type="password" id="password" placeholder="••••••••">
          <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>
      <!-- Confirm Password (Signup only) -->
      <div id="confirm-field" class="field hidden">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock left-icon"></i>
          <input type="password" id="confirm_password" placeholder="••••••••">
          <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" id="submit-btn" class="btn-primary">
        <span>Sign In</span>
        <i class="fa-solid fa-arrow-right" style="font-size:12px;"></i>
      </button>
    </form>
    <div class="toggle-mode">
      <p id="toggle-signup">
        Don't have an account?
        <a href="#" onclick="showSignUp(); return false;">Create Account</a>
      </p>
      <p id="toggle-login" class="hidden">
        Already have an account?
        <a href="#" onclick="showLogin(); return false;">Sign In</a>
      </p>
    </div>
  </div>
  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    let currentMode = "login";
    let isBusy = false;

    // Check if already logged in
    async function checkExistingSession() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.user) {
          window.location.replace("dashboard.html");
        }
      } catch (e) {}
    }
    checkExistingSession();

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function showAlert(msg, isError = true) {
      const alertBox = document.getElementById("alert");
      const alertText = document.getElementById("alert-text");
      const alertIcon = document.getElementById("alert-icon");
      alertText.textContent = msg;
      alertBox.className = "alert show " + (isError ? "error" : "success");
      alertIcon.className = isError ? "fa-solid fa-circle-exclamation" : "fa-solid fa-circle-check";
    }

    function setBusy(busy) {
      isBusy = busy;
      const btn = document.getElementById("submit-btn");
      btn.disabled = busy;
      btn.style.opacity = busy ? "0.7" : "1";
    }

    function showSignUp() {
      currentMode = "signup";
      document.getElementById("form-title").textContent = "Create an Elite Account";
      document.getElementById("form-subtitle").textContent = "Start your 14-day free trial";
      document.getElementById("name-field").classList.remove("hidden");
      document.getElementById("confirm-field").classList.remove("hidden");
      document.getElementById("submit-btn").querySelector("span").textContent = "Create Account";
      document.getElementById("toggle-signup").classList.add("hidden");
      document.getElementById("toggle-login").classList.remove("hidden");
      document.getElementById("alert").classList.remove("show");
    }

    function showLogin() {
      currentMode = "login";
      document.getElementById("form-title").textContent = "Sign in to your account";
      document.getElementById("form-subtitle").textContent = "Enter your email and password to continue";
      document.getElementById("name-field").classList.add("hidden");
      document.getElementById("confirm-field").classList.add("hidden");
      document.getElementById("submit-btn").querySelector("span").textContent = "Sign In";
      document.getElementById("toggle-signup").classList.remove("hidden");
      document.getElementById("toggle-login").classList.add("hidden");
      document.getElementById("alert").classList.remove("show");
    }

    async function createCompanyForUser(user, shopName) {
      const name = (shopName && shopName.trim()) ? shopName.trim() : (user.email?.split('@')[0] || 'My Business');

      // Check if company already exists
      const { data: existing } = await supabaseClient
        .from('companies')
        .select('id')
        .eq('owner_id', user.id)
        .maybeSingle();

      if (existing?.id) {
        const { data: link } = await supabaseClient
          .from('company_users')
          .select('id')
          .eq('user_id', user.id)
          .eq('company_id', existing.id)
          .maybeSingle();

        if (!link) {
          await supabaseClient.from('company_users').insert([{
            company_id: existing.id,
            user_id: user.id,
            role: 'owner'
          }]);
        }
        return existing;
      }

      // Create new company with 14-day trial
      const trialEnds = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString();

      const { data: company, error: companyError } = await supabaseClient
        .from('companies')
        .insert([{
          owner_id: user.id,
          company_name: name,
          currency: 'NGN',
          subscription_status: 'trial',
          trial_ends_at: trialEnds
        }])
        .select()
        .single();

      if (companyError) throw new Error('Could not create business: ' + companyError.message);

      const { error: linkError } = await supabaseClient
        .from('company_users')
        .insert([{
          company_id: company.id,
          user_id: user.id,
          role: 'owner'
        }]);

      if (linkError) throw new Error('Could not link account: ' + linkError.message);

      return company;
    }

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (isBusy) return;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const fullName = document.getElementById("full_name").value.trim();
      const confirmPassword = document.getElementById("confirm_password").value;

      setBusy(true);
      document.getElementById("alert").classList.remove("show");

      try {
        if (currentMode === "signup") {
          if (!fullName) throw new Error("Please enter your Full Name or Shop Name");
          if (!password || password.length < 6) throw new Error("Password must be at least 6 characters");
          if (password !== confirmPassword) throw new Error("Passwords do not match");

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName } }
          });

          if (error) throw error;
          if (!data.user) throw new Error("Account created but something went wrong. Please try again.");

          // Create company with 14-day trial
          try {
            await createCompanyForUser(data.user, fullName);
          } catch (ce) {
            console.error(ce);
          }

          // Always go to Login after signup
          showAlert("Account created successfully! Please sign in.", false);
          setTimeout(() => {
            showLogin();
            document.getElementById("email").value = email;
            document.getElementById("password").value = "";
          }, 1500);

        } else if (currentMode === "login") {
          if (!password) throw new Error("Please enter your password");

          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          if (!data.user) throw new Error("Login failed. Please try again.");

          // Make sure company exists
          const { data: link } = await supabaseClient
            .from('company_users')
            .select('id')
            .eq('user_id', data.user.id)
            .maybeSingle();

          if (!link) {
            const name = data.user.user_metadata?.full_name || data.user.email.split('@')[0];
            await createCompanyForUser(data.user, name);
          }

          showAlert("Login successful! Redirecting...", false);
          setTimeout(() => {
            window.location.replace("dashboard.html");
          }, 600);
        }
      } catch (err) {
        showAlert(err.message || "Something went wrong. Please try again.", true);
      } finally {
        setBusy(false);
      }
    });

    // ========== REGISTER SERVICE WORKER ==========
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => {
            console.log('Service Worker registered:', reg.scope);
          })
          .catch((err) => {
            console.log('Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
