<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quantum OPS">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <title>Quantum OPS Elite — Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05060B;
      color: #F8FAFF;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(108,92,231,0.22), transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(79,70,229,0.12), transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(108,92,231,0.08), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .auth-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }
    .auth-card {
      background: rgba(16,19,38,0.92);
      border: 1px solid rgba(139,92,255,0.22);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 24px 60px rgba(0,0,0,0.45),
        0 0 40px rgba(108,92,231,0.1);
      backdrop-filter: blur(16px);
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .logo-box {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #6C5CE7, #4F46E5);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 26px;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px rgba(108,92,231,0.4);
      letter-spacing: -0.5px;
    }
    .logo-area h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #fff;
    }
    .logo-area p {
      font-size: 11px;
      color: #A78BFA;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .form-title {
      text-align: center;
      margin-bottom: 26px;
    }
    .form-title h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }
    .form-title p {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.45;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      color: #A8B3CF;
      margin-bottom: 7px;
      font-weight: 500;
    }
    .input-wrap { position: relative; }
    .input-wrap i.left-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748B;
      font-size: 13px;
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      background: #0B0B16;
      border: 1px solid rgba(139,92,255,0.2);
      border-radius: 12px;
      padding: 13px 44px 13px 40px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input:focus {
      border-color: #8B5CFF;
      box-shadow: 0 0 0 3px rgba(139,92,255,0.15);
    }
    .input-wrap input::placeholder { color: #475569; }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748B;
      cursor: pointer;
      font-size: 14px;
      padding: 6px;
      border-radius: 6px;
    }
    .toggle-password:hover { color: #A78BFA; }
    .btn-primary {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #5B3DFF, #8B5CFF);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 8px 24px rgba(108,92,231,0.35);
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.95; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 18px;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
    }
    .alert.show { display: flex; }
    .alert.error {
      background: rgba(255,90,122,0.12);
      border: 1px solid rgba(255,90,122,0.3);
      color: #FF5A7A;
    }
    .alert.success {
      background: rgba(34,245,160,0.1);
      border: 1px solid rgba(34,245,160,0.3);
      color: #22F5A0;
    }
    .alert i { margin-top: 2px; flex-shrink: 0; }
    .toggle-mode {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #94A3B8;
      border-top: 1px solid rgba(139,92,255,0.12);
      padding-top: 20px;
    }
    .toggle-mode a {
      color: #A78BFA;
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }
    .toggle-mode a:hover { text-decoration: underline; }
    .trial-badge {
      display: none;
      text-align: center;
      margin-bottom: 18px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(108,92,231,0.12);
      border: 1px solid rgba(139,92,255,0.25);
      font-size: 12px;
      color: #C4B5FD;
      font-weight: 500;
    }
    .trial-badge.show { display: block; }
    .hidden { display: none !important; }
    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #64748B;
    }
    @media (min-width: 640px) {
      .auth-card { padding: 42px 40px; }
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="logo-area">
        <div class="logo-box">Q</div>
        <h1>QUANTUM OPS</h1>
        <p>AI Business OS</p>
      </div>

      <div class="form-title">
        <h2 id="form-title">Sign in to your account</h2>
        <p id="form-subtitle">Enter your email and password to continue</p>
      </div>

      <div id="trial-badge" class="trial-badge">
        <i class="fa-solid fa-gift" style="margin-right:6px;"></i>
        14-day free trial · No card required
      </div>

      <div id="alert" class="alert">
        <i id="alert-icon" class="fa-solid fa-circle-info"></i>
        <span id="alert-text"></span>
      </div>

      <form id="auth-form" autocomplete="on">
        <div id="name-field" class="field hidden">
          <label for="full_name">Full Name / Shop Name</label>
          <div class="input-wrap">
            <i class="fa-regular fa-user left-icon"></i>
            <input type="text" id="full_name" name="name" placeholder="e.g. Rise Beyond" autocomplete="organization">
          </div>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope left-icon"></i>
            <input type="email" id="email" name="email" required placeholder="owner@company.com" autocomplete="email">
          </div>
        </div>

        <div id="password-field" class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock left-icon"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div id="confirm-field" class="field hidden">
          <label for="confirm_password">Confirm Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock left-icon"></i>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" autocomplete="new-password">
            <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right" style="font-size:12px;"></i>
        </button>
      </form>

      <div class="toggle-mode">
        <p id="toggle-signup">
          Don't have an account?
          <a href="#" onclick="showSignUp(); return false;">Create Account</a>
        </p>
        <p id="toggle-login" class="hidden">
          Already have an account?
          <a href="#" onclick="showLogin(); return false;">Sign In</a>
        </p>
      </div>
    </div>

    <p class="footer-note">Secure login · Powered by Quantum OPS Elite</p>
  </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let currentMode = "login";
    let isBusy = false;

    /* Phone → mobile.html | Desktop → desktop.html | NEVER dashboard.html */
    function getDashboardTarget() {
  const ua = navigator.userAgent || "";
  const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  const isSmallScreen = window.innerWidth < 1024;
  if (isMobileUA || isSmallScreen) return "dashboard.html";  // was mobile.html
  return "desktop.html";
}

    function goToApp() {
      const target = getDashboardTarget();
      window.location.replace(target);
    }

    async function checkExistingSession() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          goToApp();
        }
      } catch (e) {}
    }
    checkExistingSession();

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function showAlert(msg, isError) {
      const alertBox = document.getElementById("alert");
      const alertText = document.getElementById("alert-text");
      const alertIcon = document.getElementById("alert-icon");
      alertText.textContent = msg;
      alertBox.className = "alert show " + (isError ? "error" : "success");
      alertIcon.className = isError ? "fa-solid fa-circle-exclamation" : "fa-solid fa-circle-check";
    }

    function setBusy(busy) {
      isBusy = busy;
      const btn = document.getElementById("submit-btn");
      btn.disabled = busy;
      const span = btn.querySelector("span");
      if (span) {
        if (busy) {
          span.setAttribute("data-old", span.textContent);
          span.textContent = currentMode === "signup" ? "Creating account…" : "Signing in…";
        } else if (span.getAttribute("data-old")) {
          span.textContent = span.getAttribute("data-old");
          span.removeAttribute("data-old");
        }
      }
    }

    function showSignUp() {
      currentMode = "signup";
      document.getElementById("form-title").textContent = "Create your Elite account";
      document.getElementById("form-subtitle").textContent = "Start managing your business in minutes";
      document.getElementById("name-field").classList.remove("hidden");
      document.getElementById("confirm-field").classList.remove("hidden");
      document.getElementById("trial-badge").classList.add("show");
      document.getElementById("submit-btn").querySelector("span").textContent = "Create Account";
      document.getElementById("password").setAttribute("autocomplete", "new-password");
      document.getElementById("toggle-signup").classList.add("hidden");
      document.getElementById("toggle-login").classList.remove("hidden");
      document.getElementById("alert").classList.remove("show");
    }

    function showLogin() {
      currentMode = "login";
      document.getElementById("form-title").textContent = "Sign in to your account";
      document.getElementById("form-subtitle").textContent = "Enter your email and password to continue";
      document.getElementById("name-field").classList.add("hidden");
      document.getElementById("confirm-field").classList.add("hidden");
      document.getElementById("trial-badge").classList.remove("show");
      document.getElementById("submit-btn").querySelector("span").textContent = "Sign In";
      document.getElementById("password").setAttribute("autocomplete", "current-password");
      document.getElementById("toggle-signup").classList.remove("hidden");
      document.getElementById("toggle-login").classList.add("hidden");
      document.getElementById("alert").classList.remove("show");
    }

    async function createCompanyForUser(user, shopName) {
      const name = (shopName && shopName.trim())
        ? shopName.trim()
        : (user.email ? user.email.split("@")[0] : "My Business");

      const { data: existing } = await supabaseClient
        .from("companies")
        .select("id")
        .eq("owner_id", user.id)
        .maybeSingle();

      if (existing && existing.id) {
        const { data: link } = await supabaseClient
          .from("company_users")
          .select("id")
          .eq("user_id", user.id)
          .eq("company_id", existing.id)
          .maybeSingle();
        if (!link) {
          await supabaseClient.from("company_users").insert([{
            company_id: existing.id,
            user_id: user.id,
            role: "owner"
          }]);
        }
        return existing;
      }

      const trialEnds = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString();
      const { data: company, error: companyError } = await supabaseClient
        .from("companies")
        .insert([{
          owner_id: user.id,
          company_name: name,
          currency: "NGN",
          subscription_status: "trial",
          trial_ends_at: trialEnds
        }])
        .select()
        .single();

      if (companyError) throw new Error("Could not create business: " + companyError.message);

      const { error: linkError } = await supabaseClient
        .from("company_users")
        .insert([{
          company_id: company.id,
          user_id: user.id,
          role: "owner"
        }]);

      if (linkError) throw new Error("Could not link account: " + linkError.message);
      return company;
    }

    document.getElementById("auth-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      if (isBusy) return;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const fullName = document.getElementById("full_name").value.trim();
      const confirmPassword = document.getElementById("confirm_password").value;

      setBusy(true);
      document.getElementById("alert").classList.remove("show");

      try {
        if (currentMode === "signup") {
          if (!fullName) throw new Error("Please enter your Full Name or Shop Name");
          if (!password || password.length < 6) throw new Error("Password must be at least 6 characters");
          if (password !== confirmPassword) throw new Error("Passwords do not match");

          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: { data: { full_name: fullName } }
          });
          if (error) throw error;
          if (!data.user) throw new Error("Account created but something went wrong. Please try again.");

          try {
            await createCompanyForUser(data.user, fullName);
          } catch (ce) {
            console.error(ce);
          }

          showAlert("Account created successfully! Please sign in.", false);
          setTimeout(function () {
            showLogin();
            document.getElementById("email").value = email;
            document.getElementById("password").value = "";
          }, 1400);

        } else {
          if (!password) throw new Error("Please enter your password");

          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });
          if (error) throw error;
          if (!data.user) throw new Error("Login failed. Please try again.");

          const { data: link } = await supabaseClient
            .from("company_users")
            .select("id")
            .eq("user_id", data.user.id)
            .maybeSingle();

          if (!link) {
            const name = (data.user.user_metadata && data.user.user_metadata.full_name)
              || (data.user.email ? data.user.email.split("@")[0] : "My Business");
            await createCompanyForUser(data.user, name);
          }

          showAlert("Login successful! Redirecting…", false);
          setTimeout(goToApp, 500);
        }
      } catch (err) {
        showAlert(err.message || "Something went wrong. Please try again.", true);
      } finally {
        setBusy(false);
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js")
          .then(function (reg) { console.log("SW registered:", reg.scope); })
          .catch(function (err) { console.log("SW failed:", err); });
      });
    }
  </script>
</body>
</html>
