  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }

    .mobile-only { display: block !important; }
    .desktop-only { display: none !important; }
    @media (min-width: 1024px) {
      .mobile-only { display: none !important; }
      .desktop-only { display: flex !important; }
    }

    /* ===== MOBILE ===== */
    .iphone-frame {
      width: 100%; max-width: 100%; height: 100dvh; height: 100vh;
      background: #0B0B16; position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .top-bar {
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(11,11,22,0.95); border-bottom: 1px solid rgba(139,92,246,0.1);
      flex-shrink: 0; z-index: 20;
    }
    .chat-area {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 12px;
    }
    .msg-ai {
      margin-right: 20px; padding: 12px 14px; border-radius: 16px 16px 16px 6px;
      background: #121224; border: 1px solid rgba(139,92,246,0.2);

    }
    .msg-user {
      margin-left: 28px; padding: 12px 14px; border-radius: 16px 16px 6px 16px;
      background: linear-gradient(135deg, #6C5CE7, #5B4BC4);
      font-size: 12px; color: #fff; line-height: 1.5; margin-bottom: 10px;
    }
    .chips {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px;
      border-top: 1px solid rgba(139,92,246,0.1); background: rgba(11,11,22,0.95); flex-shrink: 0;
    }
    .chip {

      font-size: 10px; font-weight: 600; background: #121224;
      border: 1px solid rgba(139,92,246,0.25); color: #e2e8f0; cursor: pointer;
    }
    .chip.primary {
      background: linear-gradient(135deg, #6C5CE7, #4F46E5);
      border: none; color: #fff;
    }
    .input-bar {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1px solid rgba(139,92,246,0.1); background: #0E0E1C; flex-shrink: 0;
    }
    .input-bar input {
      flex: 1; background: #121224; border: 1px solid rgba(139,92,246,0.2);

      width: 42px; height: 42px; border: none; border-radius: 12px;

    .bottom-nav {

    /* ===== DESKTOP ===== */
    .desktop-shell {

    }
    .desk-topbar {
      height: 64px; background: #0B0B16; border-bottom: 1px solid rgba(139,92,246,0.15);

    .desk-chat {

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .stat-box { background: #191932; border-radius: 12px; padding: 10px; border: 1px solid rgba(139,92,246,0.15); }
    .stat-box p { margin: 0; font-size: 10px; color: #94a3b8; }
    .stat-box h4 { margin: 3px 0 0; font-size: 15px; font-weight: 700; color: #fff; }
    .rec-box { margin-top: 10px; padding: 12px; border-radius: 12px; background: rgba(108,92,231,0.15); border: 1px solid rgba(139,92,246,0.3); }

    .action-btn {

    /* ===== DAY THEME ===== */

    body.text-xlarge .msg-ai, body.text-xlarge .msg-user { font-size: 14px; }

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    const LOW_STOCK_UNITS = 3;
    const DEAD_STOCK_DAYS = 21;
    let userCompanyId = null;
    let ownerName = 'Boss';
    let companyName = 'your shop';
    let biz = { sales: [], products: [], debtors: [], expenses: [] };
    let ready = false;
    let lastTopic = null;

    /* ========== THEME + TEXT SIZE ========== */
    function getSavedTheme() {
      return localStorage.getItem('quantum_theme') || 'night';
    }
    function resolveTheme(pref) {
      if (pref === 'system') {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
      }
      return pref;
    }
    function applyTheme(pref) {
      const resolved = resolveTheme(pref);
      document.body.classList.remove('theme-day', 'theme-night');
      document.body.classList.add(resolved === 'day' ? 'theme-day' : 'theme-night');
      try {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', resolved === 'day' ? '#F4F6FB' : '#6C5CE7');
      } catch (e) {}
    }
    function getSavedTextSize() {
      return localStorage.getItem('quantum_text_size') || 'medium';
    }
    function applyTextSize(size) {
      document.body.classList.remove('text-small', 'text-medium', 'text-large', 'text-xlarge');
      document.body.classList.add('text-' + size);
    }
    function applyUserPreferences() {
      applyTheme(getSavedTheme());
      applyTextSize(getSavedTextSize());
    }

    function formatCurrency(n) {
      return '₦' + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }
    function parseMoney(v) {
      if (v == null || v === '') return 0;
      if (typeof v === 'number') return isNaN(v) ? 0 : v;
      const n = parseFloat(String(v).replace(/[₦$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }
    function getLocalDateString(d) {
      const x = new Date(d);
      return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    }
    function daysAgo(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return getLocalDateString(d);
    }
    function greeting() {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 17) return 'Good afternoon';
      return 'Good evening';
    }
    function addMessage(html, isUser) {
      const areas = [
        document.getElementById('chat-area'),
        document.getElementById('desk-chat-area')
      ];
      areas.forEach(area => {
        if (!area) return;
        const div = document.createElement('div');
        div.className = isUser ? 'msg-user' : 'msg-ai';
        div.innerHTML = html;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
      });
    }
    function clearChat() {
      ['chat-area', 'desk-chat-area'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '';
      });
    }

    // ===== DATA HELPERS =====
    function todaySales() {
      const t = getLocalDateString(new Date());
      return biz.sales.filter(s => getLocalDateString(s.created_at) === t);
    }
    function salesInRange(fromStr, toStr) {
      return biz.sales.filter(s => {
        const d = getLocalDateString(s.created_at);
        return d >= fromStr && d <= toStr;
      });
    }
    function sumAmount(list) {
      return list.reduce((a, s) => a + parseMoney(s.total_amount ?? s.total), 0);
    }
    function sumProfit(list) {
      return list.reduce((a, s) => a + parseMoney(s.profit ?? s.total_profit), 0);
    }
    function todayExpenses() {
      const t = getLocalDateString(new Date());
      return biz.expenses
        .filter(e => getLocalDateString(e.created_at) === t)
        .reduce((a, e) => a + parseMoney(e.amount), 0);
    }
    function weekExpenses() {
      const from = daysAgo(6);
      const to = getLocalDateString(new Date());
      return biz.expenses
        .filter(e => {
          const d = getLocalDateString(e.created_at);
          return d >= from && d <= to;
        })
        .reduce((a, e) => a + parseMoney(e.amount), 0);
    }
    function monthExpenses() {
      const prefix = getLocalDateString(new Date()).slice(0, 7);
      return biz.expenses
        .filter(e => getLocalDateString(e.created_at).indexOf(prefix) === 0)
        .reduce((a, e) => a + parseMoney(e.amount), 0);
    }
    function productStats(list) {
      const map = {};
      list.forEach(s => {
        if (!Array.isArray(s.items)) return;
        s.items.forEach(i => {
          const name = i.name || i.product_name || 'Product';
          if (!map[name]) map[name] = { qty: 0, revenue: 0, profit: 0, lastSold: s.created_at };
          const qty = parseInt(i.qty || i.quantity || 1);
          const price = parseMoney(i.price);
          const cost = parseMoney(i.cost_price ?? i.unit_cost);
          map[name].qty += qty;
          map[name].revenue += price * qty;
          map[name].profit += (price - cost) * qty;
          if (new Date(s.created_at) > new Date(map[name].lastSold)) map[name].lastSold = s.created_at;
        });
      });
      return map;
    }
    function topProducts(list, by, limit) {
      return Object.entries(productStats(list))
        .map(([name, d]) => ({ name, ...d }))
        .sort((a, b) => b[by] - a[by])
        .slice(0, limit || 5);
    }
    function lowStockProducts() {
      return biz.products.filter(p => {
        const pieces = parseFloat(p.stock || 0);
        const pack = parseFloat(p.items_per_pack || 24) || 24;
        return pieces > 0 && (pieces / pack) <= LOW_STOCK_UNITS;
      }).map(p => {
        const pieces = parseFloat(p.stock || 0);
        const pack = parseFloat(p.items_per_pack || 24) || 24;
        return { name: p.name || 'Product', units: (pieces / pack).toFixed(1), pieces, id: p.id };
      });
    }
    function outOfStockProducts() {
      return biz.products.filter(p => parseFloat(p.stock || 0) <= 0)
        .map(p => ({ name: p.name || 'Product', id: p.id }));
    }
    function debtTotal() {
      return biz.debtors.reduce((a, d) => a + parseMoney(d.amount_owing), 0);
    }
    function topDebtors(limit) {
      return [...biz.debtors]
        .sort((a, b) => parseMoney(b.amount_owing) - parseMoney(a.amount_owing))
        .slice(0, limit || 5);
    }
    function deadStockProducts() {
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - DEAD_STOCK_DAYS);
      const soldRecently = new Set();
      biz.sales.forEach(s => {
        if (new Date(s.created_at) >= cutoff && Array.isArray(s.items)) {
          s.items.forEach(i => {
            if (i.name) soldRecently.add(i.name.toLowerCase());
            if (i.id) soldRecently.add(String(i.id));
          });
        }
      });
      return biz.products.filter(p => {
        const pieces = parseFloat(p.stock || 0);
        if (pieces <= 0) return false;
        const name = (p.name || '').toLowerCase();
        return !soldRecently.has(name) && !soldRecently.has(String(p.id));
      }).map(p => ({
        name: p.name || 'Product',
        pieces: parseFloat(p.stock || 0),
        value: parseFloat(p.stock || 0) * parseMoney(p.unit_cost || p.selling_price || 0)
      }));
    }
    function profitKillers() {
      const week = salesInRange(daysAgo(13), getLocalDateString(new Date()));
      return Object.entries(productStats(week))
        .map(([name, d]) => ({ name, ...d, margin: d.revenue > 0 ? (d.profit / d.revenue) * 100 : 0 }))
        .filter(p => p.qty > 0 && p.margin < 15)
        .sort((a, b) => a.margin - b.margin)
        .slice(0, 5);
    }
    function cashFlowScore() {
      let score = 70;
      const today = todaySales();
      const sales = sumAmount(today);
      const profit = sumProfit(today);
      const exp = todayExpenses();
      const debts = debtTotal();
      const low = lowStockProducts().length;
      const dead = deadStockProducts().length;
      if (debts > sales * 2 && sales > 0) score -= 20;
      else if (debts > 0) score -= 10;
      if (exp > profit && today.length) score -= 15;
      if (low > 3) score -= 10;
      if (dead > 5) score -= 10;
      if (today.length === 0 && new Date().getHours() >= 14) score -= 10;
      if (profit > 0 && exp < profit * 0.4) score += 10;
      if (debts === 0) score += 5;
      return Math.max(10, Math.min(100, score));
    }
    function scoreLabel(score) {
      if (score >= 80) return { text: 'Healthy', color: '#34d399' };
      if (score >= 60) return { text: 'Fair', color: '#fbbf24' };
      if (score >= 40) return { text: 'At Risk', color: '#fb923c' };
      return { text: 'Critical', color: '#fb7185' };
    }
    function findProductByName(q) {
      const t = q.toLowerCase();
      return biz.products.find(p => (p.name || '').toLowerCase().includes(t)) || null;

      const t = q.toLowerCase();
      return biz.debtors.find(d => (d.customer_name || '').toLowerCase().includes(t)) || null;

    function handleQuestion(q) {
      const t = q.toLowerCase().trim();

      // Product lookup
      const prodAns = answerProduct(t);
      if (prodAns && (t.includes('stock') || t.includes('how many') || t.includes('price') || t.includes('left') || biz.products.some(p => (p.name||'').toLowerCase().includes(t)))) {
        return prodAns;
      }
      // Debtor lookup
      const debtAns = answerDebtor(t);
      if (debtAns && (t.includes('owe') || t.includes('debt') || t.includes('balance') || biz.debtors.some(d => (d.customer_name||'').toLowerCase().includes(t)))) {
        return debtAns;
      }

      if (/what should i do|what do i do|priority|today action|advise me|help me today/.test(t)) return answerToday();
      if (/profit|margin|net profit|how much.*(make|made|earn)/.test(t)) return answerProfit();
      if (/restock|low stock|running low|almost finish|finish soon/.test(t)) return answerRestock();
      if (/debt|owe|owes|debtor|collect|who owes|outstanding/.test(t)) return answerDebtors();
      if (/cash ?flow|liquidity|money locked|cash health/.test(t)) return answerCashflow();
      if (/dead stock|slow.?moving|not selling|sitting|no sale/.test(t)) return answerDeadstock();
      if (/week|weekly|7 day|this week|last 7/.test(t)) return answerWeekly();
      if (/inventory|stock overview|how many product|total product|catalogue/.test(t)) return answerInventory();
      if (/expense|cost|spent|spending|overhead/.test(t)) return answerExpenses();
      if (/best.?sell|top.?sell|popular|most.?sold|fast.?moving/.test(t)) {
        const week = salesInRange(daysAgo(6), getLocalDateString(new Date()));
        const tops = topProducts(week, 'revenue', 5);
        if (!tops.length) return '<p style="margin:0;">No sales data yet this week.</p>';
        const lines = tops.map((p, i) => (i + 1) + '. <b>' + p.name + '</b> — ' + p.qty + ' sold · ' + formatCurrency(p.revenue)).join('<br>');
        return `<p style="font-weight:700;margin:0 0 6px;" class="prod-name">🔥 Best Sellers (7 days)</p><p style="margin:0;font-size:11px;">${lines}</p>`;
      }
      if (/risk|problem|warning|issue|danger|trouble/.test(t)) return answerRisks();
      if (/today|sales today|how much.*(make|made)|revenue today|transaction/.test(t)) return answerSales();
      if (/hello|hi |hey|good morning|good afternoon|good evening|briefing|summary|overview|how is my business|how am i doing/.test(t)) return buildBriefing();
      if (/thank|thanks|ok|okay|got it|cool|nice|great/.test(t)) {
        return `<p style="margin:0;">You're welcome, ${ownerName}. I'm always here. Ask me anything about ${companyName} anytime.</p>`;
      }
      if (/who are you|what can you do|help|how do you work/.test(t)) {
        return `<p style="margin:0;">I'm your AI CEO for <b>${companyName}</b>. I read your live sales, inventory, debtors and expenses and give you clear advice.</p>
          <p style="margin:6px 0 0;font-size:11px;">You can ask me things like:</p>
          <p style="margin:4px 0 0;font-size:11px;">• “What should I do today?”<br>• “Who owes me money?”<br>• “Which products are low?”<br>• “Show me profit this week”<br>• “How is cash flow?”<br>• Or just type a product or customer name.</p>`;
      }

      // Fallback smarter response
      return `<p style="margin:0;">I understand you're asking about <b>"${q}"</b>.</p>
        <p style="margin:6px 0 0;">I can help with sales, profit, inventory, low stock, debtors, expenses, cash flow, dead stock and weekly reports.</p>
        <p style="margin:6px 0 0;font-size:11px;color:#94a3b8;">Try: “What should I do today?” · “Who owes me?” · “Show low stock” · “Profit this week” · or type a product/customer name.</p>`;
    }
    function sendMessage() {
      if (!ready) return;
      const mobileInput = document.getElementById('chat-input');
      const deskInput = document.getElementById('desk-chat-input');
      const q = ((mobileInput && mobileInput.value) || (deskInput && deskInput.value) || '').trim();
      if (!q) return;
      addMessage(q, true);
      if (mobileInput) mobileInput.value = '';
      if (deskInput) deskInput.value = '';
      setTimeout(() => addMessage(handleQuestion(q), false), 220);
    }
    function updateSidebar() {
      const score = cashFlowScore();
      const sLabel = scoreLabel(score);
      const scoreEl = document.getElementById('side-score');
      const labelEl = document.getElementById('side-score-label');
      if (scoreEl) {
        scoreEl.textContent = score;
        scoreEl.style.background = sLabel.color + '22';
        scoreEl.style.color = sLabel.color;
        scoreEl.style.border = '2px solid ' + sLabel.color;
      }
      if (labelEl) {
        labelEl.textContent = sLabel.text;
        labelEl.style.color = sLabel.color;
      }
      const insights = document.getElementById('side-insights');
      if (insights) {
        const today = todaySales();
        insights.innerHTML = `
          Sales today: <b>${formatCurrency(sumAmount(today))}</b><br>
          Profit: <b style="color:#34d399;">${formatCurrency(sumProfit(today))}</b><br>
          Expenses: <b style="color:#fb7185;">${formatCurrency(todayExpenses())}</b><br>
          Debt: <b style="color:#fb7185;">${formatCurrency(debtTotal())}</b><br>
          Low stock: <b>${lowStockProducts().length}</b> · Dead stock: <b>${deadStockProducts().length}</b>
        `;
      }
      const actions = document.getElementById('side-actions');
      if (actions) {
        const list = [];
        const topD = topDebtors(1)[0];
        if (topD) list.push(`Collect from ${topD.customer_name || 'debtor'}`);
        const low = lowStockProducts();
        if (low[0]) list.push(`Restock ${low[0].name}`);
        if (deadStockProducts().length) list.push('Clear dead stock');
        if (!list.length) list.push('Keep selling & recording');
        actions.innerHTML = list.map((a, i) => (i + 1) + '. ' + a).join('<br>');
      }
    }
    async function init() {
      applyUserPreferences();
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session || !session.user) {
          window.location.replace('index.html');
          return;
        }
        const user = session.user;
        ownerName = (user.user_metadata && user.user_metadata.full_name) || (user.email || 'Boss').split('@')[0] || 'Boss';
        ownerName = String(ownerName).split(' ')[0];
        ownerName = ownerName.charAt(0).toUpperCase() + ownerName.slice(1).toLowerCase();

        const { data: member } = await supabaseClient
          .from('company_users')
          .select('company_id')
          .eq('user_id', user.id)
          .maybeSingle();
        if (member && member.company_id) {
          userCompanyId = member.company_id;
        } else {
          const { data: owned } = await supabaseClient
            .from('companies').select('id, name').eq('owner_id', user.id).maybeSingle();
          if (owned && owned.id) {
            userCompanyId = owned.id;
            if (owned.name) companyName = owned.name;
          }
        }
        if (userCompanyId) {
          const { data: company } = await supabaseClient
            .from('companies').select('name').eq('id', userCompanyId).maybeSingle();
          if (company && company.name) companyName = company.name;
        }
        if (!userCompanyId) {
          clearChat();
          addMessage('<p style="color:#fb7185;margin:0;">No business found. Please re-login.</p>', false);
          document.getElementById('ceo-status').textContent = 'Offline';
          const ds = document.getElementById('desk-ceo-status');
          if (ds) ds.textContent = 'Offline';
          return;
        }
        const [salesRes, productsRes, debtorsRes, expensesRes] = await Promise.all([
          supabaseClient.from('sales')
            .select('id, total_amount, total, profit, total_profit, created_at, items, payment_method')
            .eq('company_id', userCompanyId)
            .order('created_at', { ascending: false })
            .limit(250),
          supabaseClient.from('products')
            .select('id, name, stock, items_per_pack, unit_cost, selling_price')
            .eq('company_id', userCompanyId)
            .limit(200),
          supabaseClient.from('debtors')
            .select('id, customer_name, amount_owing, status, created_at')
            .eq('company_id', userCompanyId)
            .limit(100),
          supabaseClient.from('expenses')
            .select('id, amount, created_at')
            .eq('company_id', userCompanyId)
            .order('created_at', { ascending: false })
            .limit(120)
        ]);
        biz.sales = salesRes.data || [];
        biz.products = productsRes.data || [];
        biz.debtors = debtorsRes.data || [];
        biz.expenses = expensesRes.data || [];
        document.getElementById('ceo-status').textContent = 'Ready · Live data';
        const ds = document.getElementById('desk-ceo-status');
        if (ds) ds.textContent = 'Ready · Live data';
        clearChat();
        addMessage(buildBriefing(), false);
        updateSidebar();
        ready = true;
      } catch (err) {
        console.error(err);
        clearChat();
        addMessage('<p style="color:#fb7185;margin:0;">Could not load data. Check connection and refresh.</p>', false);
        document.getElementById('ceo-status').textContent = 'Error';
      }
    }

    window.addEventListener('DOMContentLoaded', function () {
      applyUserPreferences();
      init();
    });
  </script>
</body>
</html>
