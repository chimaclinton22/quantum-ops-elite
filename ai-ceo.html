<script>
  const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {

  });
  const LOW_STOCK_UNITS = 3;
  const DEAD_STOCK_DAYS = 21;
  const AI_CACHE_KEY = "quantum_ai_ceo_cache_v1";

  let userCompanyId = null;
  let ownerName = "Boss";
  let companyName = "your shop";
  let biz = { sales: [], products: [], debtors: [], expenses: [] };
  let ready = false;
  let isStreaming = false;

  /* ===== CURRENCY + LANGUAGE ===== */
  let companyCurrency = "NGN";
  let companySymbol = "₦";
  let companyLanguage = "en";

  function t(key, fallback) { return fallback != null ? fallback : key; }

  function formatCurrency(n) {
    const amount = Number(n || 0);
    try {
      if (companyCurrency && companyCurrency.length === 3) {
        return new Intl.NumberFormat(undefined, {
          style: "currency",
          currency: companyCurrency,
          maximumFractionDigits: 0,
          minimumFractionDigits: 0
        }).format(amount);
      }
    } catch (e) {}
    return (companySymbol || "₦") + amount.toLocaleString(undefined, { maximumFractionDigits: 0 });
  }

  function goBack() {
    if (window.innerWidth >= 768) window.location.href = "desktop.html";
    else window.location.href = "dashboard.html";
  }

  /* ===== THEME ===== */
  function getSavedTheme() { return localStorage.getItem("quantum_theme") || "night"; }
  function resolveTheme(pref) {
    if (pref === "system") {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "day" : "night";
    }
    return pref === "day" ? "day" : "night";
  }
  function applyTheme(pref) {
    const resolved = resolveTheme(pref || getSavedTheme());
    document.body.classList.remove("theme-day", "theme-night");
    document.body.classList.add(resolved === "day" ? "theme-day" : "theme-night");
    try {
      document.querySelector('meta[name="theme-color"]').setAttribute("content", resolved === "day" ? "#F4F6FB" : "#6C5CE7");
    } catch (e) {}
  }
  function getSavedTextSize() { return localStorage.getItem("quantum_text_size") || "medium"; }
  function applyTextSize(size) {
    document.body.classList.remove("text-small", "text-medium", "text-large", "text-xlarge");
    document.body.classList.add("text-" + size);
  }
  function applyUserPreferences() {
    applyTheme(getSavedTheme());
    applyTextSize(getSavedTextSize());
  }

  /* ===== DATE HELPERS ===== */
  function getLocalDateString(d) {
    const x = new Date(d);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  }
  function daysAgo(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return getLocalDateString(d);
  }
  function saleAmount(s) {
    return parseFloat(s.total_amount != null ? s.total_amount : s.total) || 0;
  }
  function saleProfit(s) {
    return parseFloat(s.profit != null ? s.profit : s.total_profit) || 0;
  }
  function todaySales() {
    const t = getLocalDateString(new Date());
    return biz.sales.filter(function (s) { return getLocalDateString(s.created_at) === t; });
  }
  function salesInRange(fromStr, toStr) {
    return biz.sales.filter(function (s) {
      const d = getLocalDateString(s.created_at);
      return d >= fromStr && d <= toStr;
    });
  }
  function sumAmount(arr) { return arr.reduce(function (a, s) { return a + saleAmount(s); }, 0); }
  function sumProfit(arr) { return arr.reduce(function (a, s) { return a + saleProfit(s); }, 0); }
  function todayExpenses() {
    const t = getLocalDateString(new Date());
    return biz.expenses.filter(function (e) { return getLocalDateString(e.created_at) === t; })
      .reduce(function (a, e) { return a + (parseFloat(e.amount) || 0); }, 0);
  }
  function weekExpenses() {
    const from = daysAgo(6);
    const to = getLocalDateString(new Date());
    return biz.expenses.filter(function (e) {
      const d = getLocalDateString(e.created_at);
      return d >= from && d <= to;
    }).reduce(function (a, e) { return a + (parseFloat(e.amount) || 0); }, 0);
  }
  function monthExpenses() {
    const now = new Date();
    const from = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-01";
    const to = getLocalDateString(now);
    return biz.expenses.filter(function (e) {
      const d = getLocalDateString(e.created_at);
      return d >= from && d <= to;
    }).reduce(function (a, e) { return a + (parseFloat(e.amount) || 0); }, 0);
  }
  function debtTotal() {
    return biz.debtors.filter(function (d) {
      const st = (d.status || "unpaid").toLowerCase();
      return st === "unpaid" || st === "partial" || !st;
    }).reduce(function (a, d) { return a + (parseFloat(d.amount_owing) || 0); }, 0);
  }
  function topDebtors(n) {
    return biz.debtors.filter(function (d) {
      const st = (d.status || "unpaid").toLowerCase();
      return st === "unpaid" || st === "partial" || !st;
    }).sort(function (a, b) { return (parseFloat(b.amount_owing) || 0) - (parseFloat(a.amount_owing) || 0); }).slice(0, n || 5);
  }
  function lowStockProducts() {
    return biz.products.filter(function (p) {
      const pieces = parseFloat(p.stock || 0);
      const pack = parseFloat(p.items_per_pack || 24) || 24;
      const units = pieces / pack;
      return pieces > 0 && units <= LOW_STOCK_UNITS;
    }).map(function (p) {
      const pieces = parseFloat(p.stock || 0);
      const pack = parseFloat(p.items_per_pack || 24) || 24;
      return { name: p.name, units: (pieces / pack).toFixed(1), pieces: pieces };
    });
  }
  function outOfStockProducts() {
    return biz.products.filter(function (p) { return parseFloat(p.stock || 0) <= 0; });
  }
  function topProducts(salesArr, by, limit) {
    const map = {};
    (salesArr || []).forEach(function (s) {
      let items = s.items;
      if (typeof items === "string") { try { items = JSON.parse(items); } catch (e) { items = []; } }
      if (!Array.isArray(items)) return;
      items.forEach(function (it) {
        const name = it.name || "Product";
        if (!map[name]) map[name] = { name: name, qty: 0, revenue: 0 };
        map[name].qty += Number(it.qty || 1);
        map[name].revenue += Number(it.price || 0) * Number(it.qty || 1);
      });
    });
    return Object.values(map).sort(function (a, b) {
      return by === "qty" ? b.qty - a.qty : b.revenue - a.revenue;
    }).slice(0, limit || 5);
  }
  function deadStockProducts() {
    const soldNames = {};
    const cutoff = daysAgo(DEAD_STOCK_DAYS);
    biz.sales.forEach(function (s) {
      if (getLocalDateString(s.created_at) < cutoff) return;
      let items = s.items;
      if (typeof items === "string") { try { items = JSON.parse(items); } catch (e) { items = []; } }
      if (!Array.isArray(items)) return;
      items.forEach(function (it) {
        if (it.name) soldNames[String(it.name).toLowerCase()] = true;
      });
    });
    return biz.products.filter(function (p) {
      const pieces = parseFloat(p.stock || 0);
      if (pieces <= 0) return false;
      return !soldNames[String(p.name || "").toLowerCase()];
    });
  }
  function cashFlowScore() {
    let score = 70;
    const debt = debtTotal();
    const today = sumAmount(todaySales());
    const profit = sumProfit(todaySales());
    const exp = todayExpenses();
    const low = lowStockProducts().length;
    if (debt > today * 2 && today > 0) score -= 20;
    else if (debt > 0) score -= 10;
    if (low > 5) score -= 15;
    else if (low > 0) score -= 8;
    if (exp > profit && profit > 0) score -= 15;
    if (today === 0 && new Date().getHours() >= 14) score -= 10;
    return Math.max(20, Math.min(100, score));
  }
  function scoreLabel(score) {
    if (score >= 80) return { text: "Excellent", color: "#34d399" };
    if (score >= 60) return { text: "Good", color: "#a78bfa" };
    if (score >= 40) return { text: "Fair", color: "#fbbf24" };
    return { text: "Needs attention", color: "#fb7185" };
  }
  function findProductByName(q) {
    const t = q.toLowerCase();
    return biz.products.find(function (p) { return (p.name || "").toLowerCase().indexOf(t) >= 0; });
  }
  function findDebtorByName(q) {
    const t = q.toLowerCase();
    return biz.debtors.find(function (d) { return (d.customer_name || "").toLowerCase().indexOf(t) >= 0; });
  }

  /* ===== CHAT UI + STREAMING ===== */
  function getChatAreas() {
    return [
      document.getElementById("chat-area"),
      document.getElementById("desk-chat-area")
    ].filter(Boolean);
  }
  function scrollChatToBottom() {
    getChatAreas().forEach(function (el) {
      el.scrollTop = el.scrollHeight;
    });
  }
  function clearChat() {

  }
  function addMessage(html, isUser) {
    getChatAreas().forEach(function (area) {
      const div = document.createElement("div");
      div.className = isUser ? "msg-user" : "msg-ai";
      if (isUser) div.textContent = html;
      else div.innerHTML = html;
      area.appendChild(div);
    });
    scrollChatToBottom();
  }
  function showThinking() {
    const id = "thinking-" + Date.now();
    getChatAreas().forEach(function (area) {
      const div = document.createElement("div");
      div.className = "msg-thinking";
      div.id = id + (area.id === "desk-chat-area" ? "-desk" : "-mob");
      div.innerHTML = '<div class="thinking-dots"><span></span><span></span><span></span></div> Analyzing your business…';
      area.appendChild(div);
    });
    scrollChatToBottom();
    return id;
  }
  function removeThinking(id) {
    ["-mob", "-desk"].forEach(function (sfx) {
      const el = document.getElementById(id + sfx);
      if (el) el.remove();
    });
  }
  /** Stream HTML answer character-by-character for Grok-like UX */
  function streamAnswer(html, thinkingId) {
    if (isStreaming) return;
    isStreaming = true;
    removeThinking(thinkingId);

    const nodes = [];
    getChatAreas().forEach(function (area) {
      const div = document.createElement("div");
      div.className = "msg-ai";
      area.appendChild(div);
      nodes.push(div);
    });

    // Stream as plain progressive HTML (chunk by words for speed + readability)
    const plain = html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
    const words = html.match(/<[^>]+>|[^<]+/g) || [html];
    let i = 0;
    let acc = "";

    function step() {
      if (i >= words.length) {
        nodes.forEach(function (n) { n.innerHTML = html; });
        isStreaming = false;
        scrollChatToBottom();
        return;
      }
      acc += words[i];
      i++;
      nodes.forEach(function (n) { n.innerHTML = acc; });
      scrollChatToBottom();
      // Faster for tags, slightly slower for text chunks
      const delay = words[i - 1].charAt(0) === "<" ? 8 : 18;
      setTimeout(step, delay);
    }
    step();
  }
 /* ===== AI ANSWERS (real data) ===== */

  function handleQuestion(q) {
    const t = q.toLowerCase().trim();
    const prodAns = answerProduct(t);
    if (prodAns && (t.indexOf("stock") >= 0 || t.indexOf("how many") >= 0 || t.indexOf("price") >= 0 || t.indexOf("left") >= 0 || biz.products.some(function (p) { return (p.name || "").toLowerCase().indexOf(t) >= 0; }))) {
      return prodAns;
    }
    const debtAns = answerDebtor(t);
    if (debtAns && (t.indexOf("owe") >= 0 || t.indexOf("debt") >= 0 || t.indexOf("balance") >= 0 || biz.debtors.some(function (d) { return (d.customer_name || "").toLowerCase().indexOf(t) >= 0; }))) {
      return debtAns;
    }
    if (/what should i do|what do i do|priority|today action|advise me|help me today/.test(t)) return answerToday();
    if (/profit|margin|net profit|how much.*(make|made|earn)/.test(t)) return answerProfit();
    if (/restock|low stock|running low|almost finish|finish soon/.test(t)) return answerRestock();
    if (/debt|owe|owes|debtor|collect|who owes|outstanding/.test(t)) return answerDebtors();
    if (/cash ?flow|liquidity|money locked|cash health/.test(t)) return answerCashflow();
    if (/dead stock|slow.?moving|not selling|sitting|no sale/.test(t)) return answerDeadstock();
    if (/week|weekly|7 day|this week|last 7/.test(t)) return answerWeekly();
    if (/inventory|stock overview|how many product|total product|catalogue/.test(t)) return answerInventory();
    if (/expense|cost|spent|spending|overhead/.test(t)) return answerExpenses();
    if (/best.?sell|top.?sell|popular|most.?sold|fast.?moving/.test(t)) {
      const week = salesInRange(daysAgo(6), getLocalDateString(new Date()));
      const tops = topProducts(week, "revenue", 5);
      if (!tops.length) return "<p style=\"margin:0;\">No sales data yet this week.</p>";
      const lines = tops.map(function (p, i) {
        return (i + 1) + ". <b>" + p.name + "</b> — " + p.qty + " sold · " + formatCurrency(p.revenue);
      }).join("<br>");
      return `<p style="font-weight:700;margin:0 0 6px;" class="prod-name">🔥 Best Sellers (7 days)</p><p style="margin:0;font-size:12px;">${lines}</p>`;
    }
    if (/risk|problem|warning|issue|danger|trouble/.test(t)) return answerRisks();
    if (/today|sales today|how much.*(make|made)|revenue today|transaction/.test(t)) return answerSales();
    if (/hello|hi |hey|good morning|good afternoon|good evening|briefing|summary|overview|how is my business|how am i doing/.test(t)) return buildBriefing();
    if (/thank|thanks|ok|okay|got it|cool|nice|great/.test(t)) {
      return `<p style="margin:0;">You're welcome, ${ownerName}. Ask me anything about ${companyName} anytime.</p>`;
    }
    if (/who are you|what can you do|help|how do you work/.test(t)) {
      return `<p style="margin:0;">I'm your AI CEO for <b>${companyName}</b>. I read live sales, inventory, debtors and expenses and give clear advice.</p>
        <p style="margin:6px 0 0;font-size:12px;">Try: “What should I do today?” · “Who owes me?” · “Show low stock” · “Profit this week”</p>`;
    }
    return `<p style="margin:0;">I understood: <b>"${q}"</b>.</p>
      <p style="margin:6px 0 0;">I can help with sales, profit, inventory, low stock, debtors, expenses, cash flow, dead stock and weekly reports.</p>
      <p style="margin:6px 0 0;font-size:12px;">Try: “What should I do today?” · “Who owes me?” · “Show low stock” · or type a product/customer name.</p>`;
  }

  function runAction(key) {
    if (!ready || isStreaming) return;
    const map = {
      today: answerToday, sales: answerSales, profit: answerProfit, restock: answerRestock,
      debtors: answerDebtors, cashflow: answerCashflow, deadstock: answerDeadstock,
      weekly: answerWeekly, risks: answerRisks, inventory: answerInventory, expenses: answerExpenses
    };
    if (!map[key]) return;
    const thinkingId = showThinking();
    setTimeout(function () {
      streamAnswer(map[key](), thinkingId);
    }, 280);
  }

  function sendMessage() {
    if (!ready || isStreaming) return;
    const mobileInput = document.getElementById("chat-input");
    const deskInput = document.getElementById("desk-chat-input");
    const q = ((mobileInput && mobileInput.value) || (deskInput && deskInput.value) || "").trim();
    if (!q) return;
    addMessage(q, true);
    if (mobileInput) mobileInput.value = "";
    if (deskInput) deskInput.value = "";
    const thinkingId = showThinking();
    setTimeout(function () {
      streamAnswer(handleQuestion(q), thinkingId);
    }, 320);
  }

  function updateSidebar() {
    const score = cashFlowScore();
    const sLabel = scoreLabel(score);
    const scoreEl = document.getElementById("side-score");
    const labelEl = document.getElementById("side-score-label");
    if (scoreEl) {
      scoreEl.textContent = score;
      scoreEl.style.background = sLabel.color + "22";
      scoreEl.style.color = sLabel.color;
      scoreEl.style.border = "2px solid " + sLabel.color;
    }
    if (labelEl) {
      labelEl.textContent = sLabel.text;
      labelEl.style.color = sLabel.color;
    }
    const insights = document.getElementById("side-insights");
    if (insights) {
      const today = todaySales();
      insights.innerHTML =
        "Sales today: <b>" + formatCurrency(sumAmount(today)) + "</b><br>" +
        "Profit: <b style=\"color:#34d399;\">" + formatCurrency(sumProfit(today)) + "</b><br>" +
        "Expenses: <b style=\"color:#fb7185;\">" + formatCurrency(todayExpenses()) + "</b><br>" +
        "Debt: <b style=\"color:#fb7185;\">" + formatCurrency(debtTotal()) + "</b><br>" +
        "Low stock: <b>" + lowStockProducts().length + "</b> · Dead: <b>" + deadStockProducts().length + "</b>";
    }
    const actions = document.getElementById("side-actions");
    if (actions) {
      const list = [];
      const topD = topDebtors(1)[0];
      if (topD) list.push("Collect from " + (topD.customer_name || "debtor"));
      const low = lowStockProducts();
      if (low[0]) list.push("Restock " + low[0].name);
      if (deadStockProducts().length) list.push("Clear dead stock");
      if (!list.length) list.push("Keep selling & recording");
      actions.innerHTML = list.map(function (a, i) { return (i + 1) + ". " + a; }).join("<br>");
    }
  }

  function saveAiCache() {
    try {
      if (!userCompanyId) return;
      localStorage.setItem(AI_CACHE_KEY, JSON.stringify({
        companyId: userCompanyId,
        currency: companyCurrency,
        symbol: companySymbol,
        language: companyLanguage,
        companyName: companyName,
        ownerName: ownerName,
        ts: Date.now()
      }));
    } catch (e) {}
  }

  async function init() {
    applyUserPreferences();
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session || !session.user) {
        window.location.replace("index.html");
        return;
      }
      const user = session.user;
      ownerName = (user.user_metadata && user.user_metadata.full_name) || (user.email || "Boss").split("@")[0] || "Boss";
      ownerName = String(ownerName).split(" ")[0];
      ownerName = ownerName.charAt(0).toUpperCase() + ownerName.slice(1).toLowerCase();

      const { data: member } = await supabaseClient
        .from("company_users")
        .select("company_id, companies(company_name, name, currency, currency_symbol, language)")
        .eq("user_id", user.id)
        .maybeSingle();

      if (member && member.company_id) {
        userCompanyId = member.company_id;
        const c = member.companies || {};
        companyName = c.company_name || c.name || companyName;
        if (c.currency) companyCurrency = c.currency;
        if (c.currency_symbol) companySymbol = c.currency_symbol;
        if (c.language) companyLanguage = c.language;
      } else {
        const { data: owned } = await supabaseClient
          .from("companies")
          .select("id, company_name, name, currency, currency_symbol, language")
          .eq("owner_id", user.id)
          .maybeSingle();
        if (owned && owned.id) {
          userCompanyId = owned.id;
          companyName = owned.company_name || owned.name || companyName;
          if (owned.currency) companyCurrency = owned.currency;
          if (owned.currency_symbol) companySymbol = owned.currency_symbol;
          if (owned.language) companyLanguage = owned.language;
        }
      }

      if (!userCompanyId) {
        clearChat();
        addMessage('<p style="color:#fb7185;margin:0;">No business found. Please re-login.</p>', false);
        document.getElementById("ceo-status").textContent = "Offline";
        const ds = document.getElementById("desk-ceo-status");
        if (ds) ds.textContent = "Offline";
        return;
      }

      saveAiCache();

      const [salesRes, productsRes, debtorsRes, expensesRes] = await Promise.all([
        supabaseClient.from("sales")
          .select("id, total_amount, total, profit, total_profit, created_at, items, payment_method")
          .eq("company_id", userCompanyId)
          .order("created_at", { ascending: false })
          .limit(250),
        supabaseClient.from("products")
          .select("id, name, stock, items_per_pack, unit_cost, selling_price")
          .eq("company_id", userCompanyId)
          .limit(200),
        supabaseClient.from("debtors")
          .select("id, customer_name, amount_owing, status, created_at")
          .eq("company_id", userCompanyId)
          .limit(100),
        supabaseClient.from("expenses")
          .select("id, amount, created_at")
          .eq("company_id", userCompanyId)
          .order("created_at", { ascending: false })
          .limit(120)
      ]);

      biz.sales = salesRes.data || [];
      biz.products = productsRes.data || [];
      biz.debtors = debtorsRes.data || [];
      biz.expenses = expensesRes.data || [];

      document.getElementById("ceo-status").textContent = "Ready · Live data";
      const ds = document.getElementById("desk-ceo-status");
      if (ds) ds.textContent = "Ready · Live data";

      clearChat();
      const thinkingId = showThinking();
      setTimeout(function () {
        streamAnswer(buildBriefing(), thinkingId);
      }, 200);
      updateSidebar();
      ready = true;
    } catch (err) {
      console.error(err);
      clearChat();
      addMessage('<p style="color:#fb7185;margin:0;">Could not load data. Check connection and refresh.</p>', false);
      document.getElementById("ceo-status").textContent = "Error";
    }
  }

  window.addEventListener("DOMContentLoaded", function () {
    applyUserPreferences();
    init();
  });
  window.addEventListener("pageshow", function () {
    applyUserPreferences();
  });
</script>
</body>
</html>
