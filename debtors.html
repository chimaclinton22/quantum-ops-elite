<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Quantum OPS Elite - Debtors Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; min-height: 100vh; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }

    .mobile-only { display: block !important; }
    .desktop-only { display: none !important; }
    @media (min-width: 1024px) {
      .mobile-only { display: none !important; }
      .desktop-only { display: flex !important; }
    }

    /* ===== MOBILE ===== */
    .iphone-frame {
      width: 100%; max-width: 100%; height: 100dvh; height: 100vh;
      background: #0B0B16; position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .top-bar {
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(11,11,22,0.95); border-bottom: 1px solid rgba(139,92,246,0.1);
      flex-shrink: 0; z-index: 20;
    }
    .main {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 16px; padding-bottom: 110px;
    }
    .summary {
      background: linear-gradient(90deg, rgba(136,19,55,0.35), #121224, rgba(88,28,135,0.25));
      border: 1px solid rgba(244,63,94,0.2); border-radius: 16px; padding: 16px;
      display: flex; justify-content: space-between; margin-bottom: 16px;
    }
    .card {
      background: #121224; border: 1px solid rgba(139,92,246,0.15);
      border-radius: 16px; padding: 16px; margin-bottom: 12px;
    }
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-wrap i { position: absolute; left: 12px; top: 12px; color: #64748b; font-size: 12px; }
    .search-wrap input {
      width: 100%; background: #121224; border: 1px solid rgba(139,92,246,0.15);
      border-radius: 12px; padding: 10px 12px 10px 36px; font-size: 12px; color: #fff; outline: none;
    }
    .btn-add {
      padding: 6px 10px; background: #6C5CE7; border: none; border-radius: 12px;
      color: #fff; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .btn-paid {
      padding: 4px 10px; background: rgba(5,150,105,0.2); border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px; color: #6ee7b7; font-size: 10px; font-weight: 500; cursor: pointer;
    }
    .btn-wa {
      padding: 4px 10px; background: rgba(37,211,102,0.15); border: 1px solid rgba(37,211,102,0.35);
      border-radius: 8px; color: #25D366; font-size: 10px; font-weight: 500; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-sms {
      padding: 4px 10px; background: rgba(108,92,231,0.2); border: 1px solid rgba(108,92,231,0.35);
      border-radius: 8px; color: #A78BFA; font-size: 10px; font-weight: 500; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-call {
      padding: 4px 10px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px; color: #34d399; font-size: 10px; font-weight: 500; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: calc(64px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(14,14,28,0.95); border-top: 1px solid rgba(139,92,246,0.15);
      display: flex; align-items: center; justify-content: space-between;
      padding-left: 24px; padding-right: 24px; z-index: 40;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: #94a3b8; text-decoration: none; font-size: 9px;
    }
    .nav-item i { font-size: 14px; }

    /* ===== DESKTOP ===== */
    .desktop-shell {
      width: 100%; min-height: 100vh; background: #07070F;
      display: flex; flex-direction: column;
    }
    .desk-topbar {
      height: 64px; background: #0B0B16; border-bottom: 1px solid rgba(139,92,246,0.15);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;
    }
    .desk-content { flex: 1; overflow-y: auto; padding: 24px; }
    .desk-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .desk-summary-card {
      background: linear-gradient(135deg, rgba(136,19,55,0.25), #121224);
      border: 1px solid rgba(244,63,94,0.2); border-radius: 16px; padding: 20px;
    }
    .desk-table {
      width: 100%; border-collapse: collapse; background: #121224;
      border-radius: 16px; overflow: hidden; border: 1px solid rgba(139,92,246,0.15);
    }
    .desk-table th {
      text-align: left; padding: 14px 16px; font-size: 12px; color: #94a3b8;
      background: #0B0B16; border-bottom: 1px solid rgba(139,92,246,0.12);
    }
    .desk-table td { padding: 14px 16px; font-size: 13px; border-bottom: 1px solid rgba(139,92,246,0.08); }
    .desk-table tr:last-child td { border-bottom: none; }
    .desk-table tr:hover td { background: rgba(139,92,246,0.05); }

    /* Modal */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.hidden { display: none; }
    .modal {
      width: 100%; max-width: 400px; background: #121224;
      border: 1px solid rgba(139,92,246,0.3); border-radius: 24px; padding: 20px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
    .field input {
      width: 100%; background: #191932; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 10px 12px; font-size: 12px; color: #fff; outline: none;
    }
    .btn-save {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(to right, #6C5CE7, #4F46E5); color: #fff;
      font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
    .hidden { display: none !important; }

    .prod-name { font-weight: 700; color: #fff; }
    .prod-meta { color: #94a3b8; }

    /* ===== DAY THEME ===== */
    body.theme-day {
      background: #F4F6FB !important;
      color: #0F172A !important;
    }
    body.theme-day .iphone-frame,
    body.theme-day .desktop-shell {
      background: #F4F6FB !important;
    }
    body.theme-day .top-bar,
    body.theme-day .bottom-nav,
    body.theme-day .desk-topbar {
      background: #FFFFFF !important;
      border-color: #E2E8F0 !important;
    }
    body.theme-day .card,
    body.theme-day .desk-summary-card,
    body.theme-day .desk-table,
    body.theme-day .modal {
      background: #FFFFFF !important;
      border-color: #E2E8F0 !important;
    }
    body.theme-day .desk-table th {
      background: #F8FAFC !important;
      color: #64748B !important;
      border-color: #E2E8F0 !important;
    }
    body.theme-day .desk-table td {
      border-color: #F1F5F9 !important;
      color: #0F172A !important;
    }
    body.theme-day .search-wrap input,
    body.theme-day .field input {
      background: #F8FAFC !important;
      border-color: #E2E8F0 !important;
      color: #0F172A !important;
    }
    body.theme-day .nav-item { color: #64748B !important; }
    body.theme-day .prod-name { color: #0F172A !important; }
    body.theme-day .prod-meta { color: #64748B !important; }
    body.theme-day .summary {
      background: linear-gradient(90deg, rgba(254,226,226,0.9), #FFFFFF, rgba(243,232,255,0.5)) !important;
      border-color: #FECACA !important;
    }

    /* ===== TEXT SIZE ===== */
    body.text-small .nav-item { font-size: 8px; }
    body.text-medium .nav-item { font-size: 9px; }
    body.text-large .nav-item { font-size: 10px; }
    body.text-xlarge .nav-item { font-size: 11px; }
  </style>
</head>
<body>
  <!-- ==================== MOBILE ==================== -->

    <div class="iphone-frame">
      <div class="top-bar">
        <div style="display:flex;align-items:center;gap:12px;">
          <a href="dashboard.html" style="color:#cbd5e1;text-decoration:none;"><i class="fa-solid fa-arrow-left"></i></a>
          <span style="font-weight:700;font-size:12px;color:#fff;letter-spacing:0.05em;" class="prod-name">CUSTOMER DEBTS</span>

  <!-- ==================== DESKTOP ==================== -->
  <div class="desktop-only desktop-shell">
    <div class="desk-topbar">
      <div>
        <div style="font-weight:700;font-size:18px;color:#fff;" class="prod-name">Customer Debts</div>
        <div style="font-size:12px;color:#94a3b8;" class="prod-meta">Manage outstanding balances</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="position:relative;width:280px;">
          <i class="fa-solid fa-magnifying-glass" style="position:absolute;left:12px;top:11px;color:#64748b;font-size:13px;"></i>
          <input type="text" id="desk-search-debtor" oninput="filterDebtors()" placeholder="Search customer, phone or item..."
            style="width:100%;background:#121224;border:1px solid rgba(139,92,246,0.2);border-radius:10px;padding:10px 12px 10px 36px;font-size:13px;color:#fff;outline:none;">
        </div>
        <button onclick="openAddDebtModal()" style="padding:10px 18px;border-radius:10px;background:linear-gradient(135deg,#6C5CE7,#4F46E5);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">
          <i class="fa-solid fa-plus"></i> Add Debt
        </button>

    <div class="desk-content custom-scrollbar">
      <div class="desk-summary">

          <div style="font-size:28px;font-weight:800;color:#fb7185;" id="desk-val-total-debt">₦0</div>

        <div class="desk-summary-card" style="background:linear-gradient(135deg,rgba(88,28,135,0.25),#121224);border-color:rgba(139,92,246,0.2);">
          <div style="font-size:13px;color:#94a3b8;margin-bottom:6px;" class="prod-meta">Total Debtors</div>
          <div style="font-size:28px;font-weight:800;color:#fff;" id="desk-val-total-count" class="prod-name">0</div>

  <!-- ADD DEBT MODAL -->
  <div id="debt-modal" class="modal-bg hidden">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="margin:0;font-size:14px;font-weight:700;color:#fff;" class="prod-name">
          <i class="fa-solid fa-file-invoice-dollar" style="color:#fb7185;margin-right:8px;"></i>Record New Debt
        </h3>
        <button onclick="closeAddDebtModal()" style="background:none;border:none;color:#94a3b8;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>

        <input type="number" id="debt-amount" placeholder="e.g. 25000">
      </div>

        <label>Due Date</label>
        <input type="date" id="debt-duedate">
      </div>
      <button onclick="submitNewDebt()" id="save-debt-btn" class="btn-save">Save Debt Record</button>
    </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    let userCompanyId = null;
    let businessName = 'Our Shop';
    let bankName = '';
    let accountName = '';
    let accountNumber = '';
    let allDebtors = [];
    let isSaving = false;
    let isFetching = false;

    /* ========== THEME + TEXT SIZE ========== */
    function getSavedTheme() {
      return localStorage.getItem('quantum_theme') || 'night';
    }
    function resolveTheme(pref) {
      if (pref === 'system') {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
      }
      return pref;
    }
    function applyTheme(pref) {
      const resolved = resolveTheme(pref);
      document.body.classList.remove('theme-day', 'theme-night');
      document.body.classList.add(resolved === 'day' ? 'theme-day' : 'theme-night');
      try {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', resolved === 'day' ? '#F4F6FB' : '#6C5CE7');
      } catch (e) {}
    }
    function getSavedTextSize() {
      return localStorage.getItem('quantum_text_size') || 'medium';
    }
    function applyTextSize(size) {
      document.body.classList.remove('text-small', 'text-medium', 'text-large', 'text-xlarge');
      document.body.classList.add('text-' + size);
    }
    function applyUserPreferences() {
      applyTheme(getSavedTheme());
      applyTextSize(getSavedTextSize());
    }

    function formatCurrency(amount) {
      return '₦' + Number(amount || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }
    function parseMoney(v) {
      if (v == null || v === '') return 0;
      if (typeof v === 'number') return isNaN(v) ? 0 : v;
      const n = parseFloat(String(v).replace(/[₦$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }
    function formatDate(isoString) {
      if (!isoString) return 'N/A';
      const d = new Date(isoString);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
        ' at ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function formatShortDate(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }
    function cleanPhone(phone) {
      if (!phone) return '';
      return String(phone).replace(/[^\d+]/g, '').trim();
    }
    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return 'Good morning';
      if (hour < 17) return 'Good afternoon';
      return 'Good evening';
    }

    function buildWhatsAppReminder(debt) {
      const name = debt.customer_name || 'Customer';
      const amount = formatCurrency(parseMoney(debt.amount_owing));
      const item = debt.item_bought || 'General Goods';
      const date = formatShortDate(debt.created_at);
      const biz = (businessName || 'Our Shop').toUpperCase();

      let msg = `*${biz}*\nPayment Reminder\n\n`;
      msg += `${getGreeting()}, ${name}.\n\n`;
      msg += `This is a friendly payment reminder regarding your outstanding balance.\n\n`;
      msg += `*ITEM:* ${item}\n`;
      msg += `*PURCHASE DATE:* ${date}\n`;
      msg += `*AMOUNT DUE:* ${amount}\n\n`;
      msg += `━━━━━━━━━━━━━━\n\n`;

      if (bankName || accountNumber || accountName) {
        msg += `*PAYMENT DETAILS*\n\n`;
        if (bankName) msg += `Bank: ${bankName}\n`;
        if (accountName) msg += `Account Name: ${accountName}\n`;
        if (accountNumber) msg += `Account Number: ${accountNumber}\n`;
        msg += `Amount: ${amount}\n\n`;
        msg += `━━━━━━━━━━━━━━\n\n`;
      }

      msg += `Kindly settle the outstanding balance at your earliest convenience.\n\n`;
      msg += `Thank you for your business.\n\n`;
      msg += `${businessName || 'Our Shop'}\n`;
      msg += `_Powered by Quantum Ops Elite_`;

      return msg;
    }

    function buildSmsReminder(debt) {
      const amount = formatCurrency(parseMoney(debt.amount_owing));
      const item = debt.item_bought || 'General Goods';
      const date = formatShortDate(debt.created_at);
      const biz = businessName || 'Our Shop';

      let msg = `${biz}: Payment reminder. Your outstanding balance is ${amount} for ${item} purchased on ${date}.`;

      if (bankName || accountNumber || accountName) {
        msg += `\n\nPayment:`;
        if (bankName) msg += `\n${bankName}`;
        if (accountName) msg += `\n${accountName}`;
        if (accountNumber) msg += `\n${accountNumber}`;
        msg += `\nAmount: ${amount}`;
      }

      msg += `\n\nKindly settle your outstanding balance. Thank you.\n— ${biz} | Quantum Ops Elite`;

      return msg;
    }

    function openAddDebtModal() {
      document.getElementById('debt-modal').classList.remove('hidden');
    }
    function closeAddDebtModal() {
      document.getElementById('debt-modal').classList.add('hidden');
    }

    async function initializeDebtors() {
      applyUserPreferences();
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session || !session.user) {
          window.location.replace('index.html');
          return;
        }
        userCompanyId = null;
        businessName = 'Our Shop';
        bankName = '';
        accountName = '';
        accountNumber = '';
        const { data: member } = await supabaseClient
          .from('company_users')
          .select('company_id, companies(company_name, bank_name, account_name, account_number)')
          .eq('user_id', session.user.id)
          .maybeSingle();
        if (member && member.company_id) {
          userCompanyId = member.company_id;
          if (member.companies) {
            if (member.companies.company_name) businessName = member.companies.company_name;
            if (member.companies.bank_name) bankName = member.companies.bank_name;
            if (member.companies.account_name) accountName = member.companies.account_name;
            if (member.companies.account_number) accountNumber = member.companies.account_number;
          }
        } else {
          const { data: owned } = await supabaseClient
            .from('companies')
            .select('id, company_name, bank_name, account_name, account_number')
            .eq('owner_id', session.user.id)
            .maybeSingle();
          if (owned && owned.id) {
            userCompanyId = owned.id;
            if (owned.company_name) businessName = owned.company_name;
            if (owned.bank_name) bankName = owned.bank_name;
            if (owned.account_name) accountName = owned.account_name;
            if (owned.account_number) accountNumber = owned.account_number;
          }
        }
        await fetchDebtors();
      } catch (err) {
        console.error('Init error:', err);
      }
    }

    async function fetchDebtors() {
      if (!userCompanyId) {
        allDebtors = [];
        renderDebtors([]);
        return;
      }
      if (isFetching) return;
      isFetching = true;
      try {
        const { data, error } = await supabaseClient
          .from('debtors')
          .select('id, customer_name, phone, item_bought, amount_owing, due_date, status, created_at')
          .eq('company_id', userCompanyId)
          .order('created_at', { ascending: false })
          .limit(200);
        if (error) throw error;
        allDebtors = data || [];
        filterDebtors();
      } catch (err) {
        console.error('Fetch error:', err);
      } finally {
        isFetching = false;
      }
    }

    function renderDebtors(debtors) {
      let totalAmount = 0;
      debtors.forEach(d => totalAmount += parseMoney(d.amount_owing));
      document.getElementById('val-total-debt').textContent = formatCurrency(totalAmount);
      document.getElementById('val-total-count').textContent = String(debtors.length);
      const deskDebt = document.getElementById('desk-val-total-debt');
      const deskCount = document.getElementById('desk-val-total-count');
      if (deskDebt) deskDebt.textContent = formatCurrency(totalAmount);
      if (deskCount) deskCount.textContent = String(debtors.length);

      const container = document.getElementById('debtors-list-container');
      if (container) {
        if (!debtors.length) {
          container.innerHTML = '<div style="text-align:center;padding:48px 16px;background:#121224;border:1px solid rgba(139,92,246,0.1);border-radius:16px;"><i class="fa-solid fa-circle-check" style="color:#34d399;font-size:24px;"></i><p style="color:#cbd5e1;font-size:12px;font-weight:500;margin:8px 0 4px;">No outstanding debts found</p><p style="color:#64748b;font-size:10px;margin:0;">All customer balances are fully settled.</p></div>';
        } else {
          container.innerHTML = debtors.map(d => buildMobileCard(d)).join('');
        }
      }

      const tbody = document.getElementById('desk-debtors-body');
      if (tbody) {
        if (!debtors.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#64748b;">No outstanding debts found</td></tr>';
        } else {
          tbody.innerHTML = debtors.map(d => buildDesktopRow(d)).join('');
        }
      }
    }

    function buildActionButtons(debt) {
      const phoneClean = cleanPhone(debt.phone);
      if (!phoneClean) return '';
      let waNumber = phoneClean;
      if (waNumber.startsWith('0')) waNumber = '234' + waNumber.slice(1);
      if (!waNumber.startsWith('234') && !waNumber.startsWith('+')) waNumber = '234' + waNumber;
      const waMessage = encodeURIComponent(buildWhatsAppReminder(debt));
      const smsBody = encodeURIComponent(buildSmsReminder(debt));
      const callNumber = phoneClean;
      return `
        <a class="btn-wa" href="https://wa.me/${waNumber}?text=${waMessage}" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </a>
        <a class="btn-sms" href="sms:${callNumber}?body=${smsBody}">
          <i class="fa-solid fa-comment-sms"></i> SMS
        </a>
        <a class="btn-call" href="tel:${callNumber}">
          <i class="fa-solid fa-phone"></i> Call
        </a>
      `;
    }

    function buildMobileCard(debt) {
      const amount = parseMoney(debt.amount_owing);
      const itemBought = debt.item_bought || 'General Goods';
      const phone = debt.phone || '';
      const phoneDisplay = phone ? phone : 'No phone';
      return `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:32px;height:32px;border-radius:12px;background:rgba(225,29,72,0.2);color:#fb7185;display:flex;align-items:center;justify-content:center;border:1px solid rgba(244,63,94,0.3);font-size:12px;"><i class="fa-solid fa-user"></i></div>
              <div>
                <div class="prod-name" style="font-size:12px;">${debt.customer_name || 'Unknown'}</div>
                <div class="prod-meta" style="font-size:10px;margin-top:2px;"><i class="fa-solid fa-phone" style="color:#a78bfa;margin-right:4px;"></i>${phoneDisplay}</div>
                <div class="prod-meta" style="font-size:10px;margin-top:2px;"><i class="fa-solid fa-bag-shopping" style="color:#a78bfa;margin-right:4px;"></i>${itemBought}</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:700;color:#fb7185;font-size:12px;">${formatCurrency(amount)}</div>
              <div style="font-size:9px;color:#64748b;">Unpaid</div>
            </div>
          </div>
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(139,92,246,0.1);display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#94a3b8;gap:8px;flex-wrap:wrap;">
            <span><i class="fa-regular fa-clock" style="margin-right:4px;"></i>${formatDate(debt.created_at)}</span>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              ${buildActionButtons(debt)}
              <button class="btn-paid" onclick="markAsPaid('${debt.id}')"><i class="fa-solid fa-check"></i> Paid</button>
            </div>
          </div>
        </div>
      `;
    }

    function buildDesktopRow(debt) {
      const amount = parseMoney(debt.amount_owing);
      const itemBought = debt.item_bought || 'General Goods';
      const phone = debt.phone || '—';
      return `
        <tr>
          <td style="font-weight:600;" class="prod-name">${debt.customer_name || 'Unknown'}</td>
          <td class="prod-meta">${phone}</td>
          <td class="prod-meta">${itemBought}</td>
          <td style="font-weight:700;color:#fb7185;">${formatCurrency(amount)}</td>
          <td class="prod-meta" style="font-size:12px;">${formatDate(debt.created_at)}</td>
          <td style="text-align:right;">
            <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;">
              ${buildActionButtons(debt)}
              <button class="btn-paid" onclick="markAsPaid('${debt.id}')"><i class="fa-solid fa-check"></i> Paid</button>
            </div>
          </td>
        </tr>
      `;
    }

    function filterDebtors() {
      const mobileSearch = document.getElementById('search-debtor');
      const deskSearch = document.getElementById('desk-search-debtor');
      const keyword = ((mobileSearch && mobileSearch.value) || (deskSearch && deskSearch.value) || '').toLowerCase();
      if (mobileSearch && deskSearch) {
        if (document.activeElement === deskSearch) mobileSearch.value = deskSearch.value;
        else if (document.activeElement === mobileSearch) deskSearch.value = mobileSearch.value;
      }
      const filtered = allDebtors.filter(function (d) {
        return (d.customer_name || '').toLowerCase().includes(keyword) ||
          (d.phone || '').toLowerCase().includes(keyword) ||
          (d.item_bought || '').toLowerCase().includes(keyword);
      });
      renderDebtors(filtered);
    }

    async function submitNewDebt() {
      if (isSaving) return;
      const customer = document.getElementById('debt-customer').value.trim();
      const phone = document.getElementById('debt-phone').value.trim();
      const item = document.getElementById('debt-item').value.trim();
      const amount = document.getElementById('debt-amount').value;
      const duedate = document.getElementById('debt-duedate').value;
      if (!customer) return alert('Please enter Customer Name.');
      if (!amount || parseFloat(amount) <= 0) return alert('Please enter a valid Amount.');
      if (!userCompanyId) return alert('Company not loaded. Please refresh the page.');
      isSaving = true;
      const btn = document.getElementById('save-debt-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const payload = {
          company_id: userCompanyId,
          customer_name: customer,
          item_bought: item || 'General Goods',
          amount_owing: parseFloat(amount),
          due_date: duedate || null,
          status: 'unpaid'
        };
        if (phone) payload.phone = phone;
        const { error } = await supabaseClient.from('debtors').insert([payload]);
        if (error) throw error;

        try {
          await supabaseClient.from('notifications').insert([{
            company_id: userCompanyId,
            title: 'New Debt Recorded',
            message: `${customer} owes ${formatCurrency(amount)} for ${item || 'General Goods'}`,
            type: 'debt',
            is_read: false
          }]);
        } catch (e) {}

        closeAddDebtModal();
        document.getElementById('debt-customer').value = '';
        document.getElementById('debt-phone').value = '';
        document.getElementById('debt-item').value = '';
        document.getElementById('debt-amount').value = '';
        document.getElementById('debt-duedate').value = '';
        await fetchDebtors();
      } catch (err) {
        alert('Error saving debt: ' + (err.message || 'Try again'));
      } finally {
        isSaving = false;
        btn.disabled = false;
        btn.textContent = 'Save Debt Record';
      }
    }

    async function markAsPaid(debtId) {
      if (!confirm('Mark this debt as fully paid? It will be removed from the list.')) return;
      try {
        const { error } = await supabaseClient
          .from('debtors')
          .delete()
          .eq('id', debtId)
          .eq('company_id', userCompanyId);
        if (error) throw error;
        await fetchDebtors();
      } catch (err) {
        alert('Error: ' + (err.message || 'Try again'));
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      applyUserPreferences();
      initializeDebtors();
    });
  </script>
</body>
</html>
