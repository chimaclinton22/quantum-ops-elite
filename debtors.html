<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Quantum OPS Elite - Debtors Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }
    .iphone-frame {
      width: 100%; max-width: 100%; height: 100dvh;
      background: #0B0B16; position: relative; overflow: hidden;
      display: flex; flex-direction: column;
    }
    @media (min-width: 768px) {
      body { display: flex; align-items: center; justify-content: center; height: 100vh; }
      .iphone-frame {
        max-width: 410px; max-height: 860px; border-radius: 48px;
        border: 1px solid rgba(139,92,246,0.2);
        box-shadow: 0 25px 50px -12px rgba(15,13,35,0.7);
      }
    }
    .top-bar {
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      background: rgba(11,11,22,0.95); border-bottom: 1px solid rgba(139,92,246,0.1); flex-shrink: 0;
    }
    .main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 96px; }
    .summary {
      background: linear-gradient(90deg, rgba(136,19,55,0.35), #121224, rgba(88,28,135,0.25));
      border: 1px solid rgba(244,63,94,0.2); border-radius: 16px; padding: 16px;
      display: flex; justify-content: space-between; margin-bottom: 16px;
    }
    .card {
      background: #121224; border: 1px solid rgba(139,92,246,0.15);
      border-radius: 16px; padding: 16px; margin-bottom: 12px;
    }
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-wrap i { position: absolute; left: 12px; top: 12px; color: #64748b; font-size: 12px; }
    .search-wrap input {
      width: 100%; background: #121224; border: 1px solid rgba(139,92,246,0.15);
      border-radius: 12px; padding: 10px 12px 10px 36px; font-size: 12px; color: #fff; outline: none;
    }
    .btn-add {
      padding: 6px 10px; background: #6C5CE7; border: none; border-radius: 12px;
      color: #fff; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .btn-paid {
      padding: 4px 12px; background: rgba(5,150,105,0.2); border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px; color: #6ee7b7; font-size: 10px; font-weight: 500; cursor: pointer;
    }
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
      background: rgba(14,14,28,0.95); border-top: 1px solid rgba(139,92,246,0.15);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 40;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: #94a3b8; text-decoration: none; font-size: 9px;
    }
    .nav-item i { font-size: 14px; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.hidden { display: none; }
    .modal {
      width: 100%; max-width: 384px; background: #121224;
      border: 1px solid rgba(139,92,246,0.3); border-radius: 24px; padding: 20px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
    .field input {
      width: 100%; background: #191932; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 12px; padding: 10px 12px; font-size: 12px; color: #fff; outline: none;
    }
    .btn-save {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(to right, #6C5CE7, #4F46E5); color: #fff;
      font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="iphone-frame">
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="dashboard.html" style="color:#cbd5e1;text-decoration:none;"><i class="fa-solid fa-arrow-left"></i></a>
        <span style="font-weight:700;font-size:12px;color:#fff;letter-spacing:0.05em;">CUSTOMER DEBTS</span>
      </div>
      <button class="btn-add" onclick="openAddDebtModal()"><i class="fa-solid fa-plus" style="font-size:10px;"></i> Add Debt</button>
    </div>

    <div class="main custom-scrollbar">
      <div class="summary">
        <div>
          <div style="font-size:10px;color:#94a3b8;">Total Outstanding</div>
          <div style="font-size:18px;font-weight:800;color:#fb7185;" id="val-total-debt">₦0</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:10px;color:#94a3b8;">Total Debtors</div>
          <div style="font-size:18px;font-weight:800;color:#fff;" id="val-total-count">0</div>
        </div>
      </div>

      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-debtor" oninput="filterDebtors()" placeholder="Search customer or item bought...">
      </div>

      <div id="debtors-list-container">
        <div style="text-align:center;padding:40px 0;color:#64748b;font-size:12px;">Loading customer debts...</div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i>Dashboard</a>
      <a href="inventory.html" class="nav-item"><i class="fa-solid fa-boxes-stacked"></i>Inventory</a>
      <a href="pos.html" class="nav-item"><i class="fa-solid fa-cash-register"></i>POS Sales</a>
      <a href="ai-ceo.html" class="nav-item"><i class="fa-solid fa-robot" style="color:#a78bfa;"></i>AI CEO</a>
    </nav>
  </div>

  <div id="debt-modal" class="modal-bg hidden">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="margin:0;font-size:14px;font-weight:700;color:#fff;">
          <i class="fa-solid fa-file-invoice-dollar" style="color:#fb7185;margin-right:8px;"></i>Record New Debt
        </h3>
        <button onclick="closeAddDebtModal()" style="background:none;border:none;color:#94a3b8;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="field">
        <label>Customer Name *</label>
        <input type="text" id="debt-customer" placeholder="e.g. John Doe">
      </div>
      <div class="field">
        <label>Item Bought</label>
        <input type="text" id="debt-item" placeholder="e.g. iPhone 13 Case, Sneakers">
      </div>
      <div class="field">
        <label>Amount Owing (₦) *</label>
        <input type="number" id="debt-amount" placeholder="e.g. 25000">
      </div>
      <div class="field">
        <label>Due Date</label>
        <input type="date" id="debt-duedate">
      </div>
      <button onclick="submitNewDebt()" id="save-debt-btn" class="btn-save">Save Debt Record</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let userCompanyId = null;
    let allDebtors = [];
    let isSaving = false;
    let isFetching = false;

    function formatCurrency(amount) {
      return '₦' + Number(amount || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
    }

    function parseMoney(v) {
      if (v == null || v === '') return 0;
      if (typeof v === 'number') return isNaN(v) ? 0 : v;
      const n = parseFloat(String(v).replace(/[₦$,\s]/g, ''));
      return isNaN(n) ? 0 : n;
    }

    function formatDate(isoString) {
      if (!isoString) return 'N/A';
      const d = new Date(isoString);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
        ' at ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function openAddDebtModal() {
      document.getElementById('debt-modal').classList.remove('hidden');
    }

    function closeAddDebtModal() {
      document.getElementById('debt-modal').classList.add('hidden');
    }

    async function initializeDebtors() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session || !session.user) {
          window.location.replace('index.html');
          return;
        }
        userCompanyId = null;
        const { data: member } = await supabaseClient
          .from('company_users')
          .select('company_id')
          .eq('user_id', session.user.id)
          .maybeSingle();

        if (member && member.company_id) {
          userCompanyId = member.company_id;
        } else {
          const { data: owned } = await supabaseClient
            .from('companies').select('id').eq('owner_id', session.user.id).maybeSingle();
          if (owned && owned.id) userCompanyId = owned.id;
        }
        await fetchDebtors();
      } catch (err) {
        console.error('Init error:', err);
        document.getElementById('debtors-list-container').innerHTML =
          '<div style="text-align:center;padding:40px 0;color:#fb7185;font-size:12px;">Could not load. Refresh page.</div>';
      }
    }

    async function fetchDebtors() {
      if (!userCompanyId) {
        allDebtors = [];
        renderDebtors([]);
        return;
      }
      if (isFetching) return;
      isFetching = true;
      try {
        const { data, error } = await supabaseClient
          .from('debtors')
          .select('id, customer_name, item_bought, amount_owing, due_date, status, created_at')
          .eq('company_id', userCompanyId)
          .order('created_at', { ascending: false })
          .limit(200);
        if (error) throw error;
        allDebtors = data || [];
        filterDebtors();
      } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('debtors-list-container').innerHTML =
          '<div style="text-align:center;padding:40px 0;color:#fb7185;font-size:12px;">Error loading debts.</div>';
      } finally {
        isFetching = false;
      }
    }

    function renderDebtors(debtors) {
      const container = document.getElementById('debtors-list-container');
      let totalAmount = 0;

      if (!debtors.length) {
        container.innerHTML =
          '<div style="text-align:center;padding:48px 16px;background:#121224;border:1px solid rgba(139,92,246,0.1);border-radius:16px;">'
          + '<i class="fa-solid fa-circle-check" style="color:#34d399;font-size:24px;"></i>'
          + '<p style="color:#cbd5e1;font-size:12px;font-weight:500;margin:8px 0 4px;">No outstanding debts found</p>'
          + '<p style="color:#64748b;font-size:10px;margin:0;">All customer balances are fully settled.</p></div>';
        document.getElementById('val-total-debt').textContent = formatCurrency(0);
        document.getElementById('val-total-count').textContent = '0';
        return;
      }

      container.innerHTML = debtors.map(function (debt) {
        const amount = parseMoney(debt.amount_owing);
        totalAmount += amount;
        const itemBought = debt.item_bought || 'General Goods';
        return ''
          + '<div class="card">'
          +   '<div style="display:flex;justify-content:space-between;align-items:center;">'
          +     '<div style="display:flex;align-items:center;gap:10px;">'
          +       '<div style="width:32px;height:32px;border-radius:12px;background:rgba(225,29,72,0.2);color:#fb7185;display:flex;align-items:center;justify-content:center;border:1px solid rgba(244,63,94,0.3);font-size:12px;"><i class="fa-solid fa-user"></i></div>'
          +       '<div>'
          +         '<div style="font-weight:700;color:#fff;font-size:12px;">' + (debt.customer_name || 'Unknown') + '</div>'
          +         '<div style="font-size:10px;color:#94a3b8;"><i class="fa-solid fa-bag-shopping" style="color:#a78bfa;margin-right:4px;"></i>' + itemBought + '</div>'
          +       '</div>'
          +     '</div>'
          +     '<div style="text-align:right;">'
          +       '<div style="font-weight:700;color:#fb7185;font-size:12px;">' + formatCurrency(amount) + '</div>'
          +       '<div style="font-size:9px;color:#64748b;">Unpaid</div>'
          +     '</div>'
          +   '</div>'
          +   '<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(139,92,246,0.1);display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#94a3b8;">'
          +     '<span><i class="fa-regular fa-clock" style="margin-right:4px;"></i>' + formatDate(debt.created_at) + '</span>'
          +     '<button class="btn-paid" onclick="markAsPaid(\'' + debt.id + '\')"><i class="fa-solid fa-check" style="margin-right:4px;"></i>Mark as Paid</button>'
          +   '</div>'
          + '</div>';
      }).join('');

      document.getElementById('val-total-debt').textContent = formatCurrency(totalAmount);
      document.getElementById('val-total-count').textContent = String(debtors.length);
    }

    function filterDebtors() {
      const keyword = (document.getElementById('search-debtor').value || '').toLowerCase();
      const filtered = allDebtors.filter(function (d) {
        return (d.customer_name || '').toLowerCase().includes(keyword) ||
          (d.item_bought || '').toLowerCase().includes(keyword);
      });
      renderDebtors(filtered);
    }

    async function submitNewDebt() {
      if (isSaving) return;
      const customer = document.getElementById('debt-customer').value.trim();
      const item = document.getElementById('debt-item').value.trim();
      const amount = document.getElementById('debt-amount').value;
      const duedate = document.getElementById('debt-duedate').value;

      if (!customer) return alert('Please enter Customer Name.');
      if (!amount || parseFloat(amount) <= 0) return alert('Please enter a valid Amount.');
      if (!userCompanyId) return alert('Company not loaded. Please refresh the page.');

      isSaving = true;
      const btn = document.getElementById('save-debt-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const { error } = await supabaseClient.from('debtors').insert([{
          company_id: userCompanyId,
          customer_name: customer,
          item_bought: item || 'General Goods',
          amount_owing: parseFloat(amount),
          due_date: duedate || null,
          status: 'unpaid'
        }]);
        if (error) throw error;

        closeAddDebtModal();
        document.getElementById('debt-customer').value = '';
        document.getElementById('debt-item').value = '';
        document.getElementById('debt-amount').value = '';
        document.getElementById('debt-duedate').value = '';
        await fetchDebtors();
      } catch (err) {
        alert('Error saving debt: ' + (err.message || 'Try again'));
      } finally {
        isSaving = false;
        btn.disabled = false;
        btn.textContent = 'Save Debt Record';
      }
    }

    async function markAsPaid(debtId) {
      if (!confirm('Mark this debt as fully paid? It will be removed from the list.')) return;
      try {
        const { error } = await supabaseClient
          .from('debtors')
          .delete()
          .eq('id', debtId)
          .eq('company_id', userCompanyId);
        if (error) throw error;
        await fetchDebtors();
      } catch (err) {
        alert('Error: ' + (err.message || 'Try again'));
      }
    }

    window.addEventListener('DOMContentLoaded', initializeDebtors);
  </script>
</body>
</html>
