<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum OPS Elite - Inventory & POS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { bg: '#07070F', card: '#121224', sidebar: '#0E0E1C', purple: '#6C5CE7', accent: '#8B5CF6' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }
    .iphone-frame {
      width: 100%; max-width: 410px; height: 100vh; max-height: 860px;
      background: #0B0B16; border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 0 25px 50px -12px rgba(15, 13, 35, 0.7);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }
    @media (min-width: 768px) {
      body { align-items: center; justify-content: center; display: flex; height: 100vh; }
      .iphone-frame { border-radius: 48px; }
    }
  </style>
</head>
<body>

  <div class="iphone-frame">
    <!-- TOP BAR -->
    <div class="px-4 pt-3 pb-3 flex items-center justify-between bg-[#0B0B16]/90 backdrop-blur-md z-30 flex-shrink-0 border-b border-purple-500/10">
      <div class="flex items-center gap-3">
        <h2 class="font-bold tracking-wider text-xs text-white">Quantum OPS Elite</h2>
      </div>
      <button onclick="openAddProductModal()" class="w-8 h-8 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-xs border border-purple-500/30">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <!-- MAIN VIEWPORT -->
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4 custom-scrollbar pb-24" id="main-viewport">
      <!-- Dynamic views load here -->
    </div>

    <!-- BOTTOM FLOATING NAVIGATION BAR -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-[#0E0E1C]/95 backdrop-blur-xl border-t border-purple-500/15 px-6 flex items-center justify-between z-40">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-purple-400">
        <i class="fa-solid fa-gauge-high text-sm"></i>
        <span class="text-[9px] font-medium">Dashboard</span>
      </button>
      <button onclick="switchTab('inventory')" id="nav-inventory" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-boxes-stacked text-sm"></i>
        <span class="text-[9px] font-medium">Inventory</span>
      </button>
      <button onclick="switchTab('pos')" id="nav-pos" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-cash-register text-sm"></i>
        <span class="text-[9px] font-medium">POS Sales</span>
      </button>
      <button onclick="switchTab('ai')" id="nav-ai" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-robot text-sm text-purple-400"></i>
        <span class="text-[9px] font-medium">AI CEO</span>
      </button>
    </nav>
  </div>

  <!-- ADD / EDIT PRODUCT MODAL (BULK & PIECES) -->
  <div id="product-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-[#121224] border border-purple-500/30 rounded-3xl p-5 space-y-3 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      <div class="flex items-center justify-between border-b border-purple-500/10 pb-2">
        <h3 class="text-xs font-bold text-white" id="modal-product-title">Add New Bulk / Product</h3>
        <button onclick="closeProductModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="edit-product-id">

      <div class="space-y-2 text-xs">
        <div>
          <label class="text-[10px] text-slate-400 font-medium">Product Name</label>
          <input type="text" id="p-name" placeholder="e.g. iPhone 13" class="w-full bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 font-medium">Bulks Bought (Cartons/Packs)</label>
            <input type="number" id="p-bulks" value="1" oninput="calculateBulkStock()" class="w-full bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-medium">Pieces Per Bulk</label>
            <input type="number" id="p-pieces-per-bulk" value="24" oninput="calculateBulkStock()" class="w-full bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
        </div>
        <div>
          <label class="text-[10px] text-slate-400 font-medium">Total Bulk Cost Price (₦)</label>
          <input type="number" id="p-total-bulk-cost" placeholder="e.g. 50000" oninput="calculateBulkStock()" class="w-full bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div class="p-2.5 bg-purple-600/10 border border-purple-500/20 rounded-xl text-[10px] space-y-1 text-purple-300">
          <p>📦 Total Pieces Stock: <b id="calc-total-pieces" class="text-white">24</b></p>
          <p>🏷️ Cost Price Per Single Piece: <b id="calc-single-cost" class="text-white">₦0</b></p>
        </div>
        <div>
          <label class="text-[10px] text-slate-400 font-medium">Selling Price Per Single Piece (₦)</label>
          <input type="number" id="p-selling-price" placeholder="e.g. 2500" oninput="calculateBulkStock()" class="w-full bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>
        <div class="p-2 bg-emerald-600/10 border border-emerald-500/20 rounded-xl text-[10px] text-emerald-300">
          ✨ Expected Profit Per Piece: <b id="calc-single-profit" class="text-white">₦0</b>
        </div>
      </div>

      <button onclick="saveProduct()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl text-white font-bold text-xs shadow-lg shadow-purple-600/30">
        Save Product & Stock
      </button>
    </div>
  </div>

  <!-- SCRIPT ENGINE -->
  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTab = 'dashboard';
    let userCompanyId = null;
    let inventoryCatalog = [];
    let salesHistory = [];
    let cart = [];
    let selectedPaymentMethod = 'Cash';
    let selectedCustomer = 'Walk-in Customer';

    function formatCurrency(amount) {
      return '₦' + Number(amount || 0).toLocaleString();
    }

    async function initApp() {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          const { data: memberData } = await supabaseClient
            .from('company_users')
            .select('company_id')
            .eq('user_id', user.id)
            .single();
          if (memberData) userCompanyId = memberData.company_id;
        }
        await fetchData();
        switchTab('dashboard');
      } catch (e) {
        console.error("Init Error:", e);
        await fetchData();
        switchTab('dashboard');
      }
    }

    async function fetchData() {
      let invQuery = supabaseClient.from('products').select('*');
      let salesQuery = supabaseClient.from('sales').select('*');
      if (userCompanyId) {
        invQuery = invQuery.eq('company_id', userCompanyId);
        salesQuery = salesQuery.eq('company_id', userCompanyId);
      }

      const [invRes, salesRes] = await Promise.all([invQuery, salesQuery]);
      inventoryCatalog = invRes.data || [];
      salesHistory = salesRes.data || [];
    }

    function switchTab(tab) {
      currentTab = tab;
      ['dashboard', 'inventory', 'pos', 'ai'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if(btn) btn.className = t === tab ? "flex flex-col items-center gap-1 text-purple-400" : "flex flex-col items-center gap-1 text-slate-400 hover:text-white transition";
      });

      const viewport = document.getElementById('main-viewport');
      if (tab === 'dashboard') renderDashboardView(viewport);
      else if (tab === 'inventory') renderInventoryView(viewport);
      else if (tab === 'pos') renderPOSView(viewport);
      else if (tab === 'ai') renderAIView(viewport);
    }

    // --- DASHBOARD VIEW ---
    function renderDashboardView(container) {
      const totalSales = salesHistory.reduce((acc, s) => acc + parseFloat(s.total_amount || 0), 0);
      const totalProfit = salesHistory.reduce((acc, s) => acc + parseFloat(s.total_profit || 0), 0);
      const lowStockCount = inventoryCatalog.filter(i => parseInt(i.stock || 0) <= 5).length;

      let html = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-bold text-sm text-white">Good day, User 👋</h3>
              <p class="text-[10px] text-slate-400">Live Business Performance</p>
            </div>
          </div>

          <!-- METRICS GRID -->
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-[#121224] border border-purple-500/20 p-3 rounded-2xl space-y-1">
              <p class="text-[10px] text-slate-400">Total Sales (Live)</p>
              <h4 class="text-base font-extrabold text-white">${formatCurrency(totalSales)}</h4>
            </div>
            <div class="bg-[#121224] border border-purple-500/20 p-3 rounded-2xl space-y-1">
              <p class="text-[10px] text-slate-400">Total Profit (Live)</p>
              <h4 class="text-base font-extrabold text-emerald-400">${formatCurrency(totalProfit)}</h4>
            </div>
            <div class="bg-[#121224] border border-purple-500/20 p-3 rounded-2xl space-y-1">
              <p class="text-[10px] text-slate-400">Transactions Count</p>
              <h4 class="text-base font-extrabold text-white">${salesHistory.length}</h4>
            </div>
            <div class="bg-[#121224] border border-purple-500/20 p-3 rounded-2xl space-y-1">
              <p class="text-[10px] text-slate-400">Low Stock Alerts</p>
              <h4 class="text-base font-extrabold text-amber-400">${lowStockCount} Items</h4>
            </div>
          </div>

          <!-- RECENT TRANSACTIONS -->
          <div class="bg-[#121224] border border-purple-500/15 p-3 rounded-2xl space-y-2">
            <h4 class="text-xs font-bold text-white">Recent Transactions (Tap for Details)</h4>
            <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
      `;

      if (salesHistory.length === 0) {
        html += `<div class="text-center py-4 text-slate-500 text-xs">No transactions recorded yet.</div>`;
      } else {
        salesHistory.slice().reverse().forEach(s => {
          html += `
            <div onclick='viewTransactionDetails(${JSON.stringify(s)})' class="bg-[#191932] p-2.5 rounded-xl border border-purple-500/10 cursor-pointer hover:border-purple-500 transition flex items-center justify-between">
              <div>
                <p class="font-bold text-white text-[11px]">${s.transaction_id || 'Sale'} (${s.customer_name || 'Walk-in'})</p>
                <p class="text-[9px] text-slate-400">${new Date(s.created_at).toLocaleString()}</p>
              </div>
              <div class="text-right">
                <p class="font-bold text-purple-300 text-xs">${formatCurrency(s.total_amount)}</p>
                <p class="text-[9px] text-emerald-400">Profit: ${formatCurrency(s.total_profit)}</p>
              </div>
            </div>
          `;
        });
      }

      html += `</div></div></div>`;
      container.innerHTML = html;
    }

    // --- INVENTORY VIEW ---
    function renderInventoryView(container) {
      let html = `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-sm text-white">All Products (${inventoryCatalog.length})</h3>
            <button onclick="openAddProductModal()" class="px-3 py-1.5 bg-purple-600 text-white rounded-xl text-xs font-bold">+ Add Product</button>
          </div>
          <div class="space-y-2 max-h-[65vh] overflow-y-auto custom-scrollbar">
      `;

      if (inventoryCatalog.length === 0) {
        html += `<div class="text-center py-8 text-slate-500 text-xs">No products in inventory. Add one above!</div>`;
      } else {
        inventoryCatalog.forEach(item => {
          const stock = parseInt(item.stock || 0);
          const isLow = stock <= 5;
          html += `
            <div class="bg-[#121224] border border-purple-500/15 p-3 rounded-2xl flex items-center justify-between">
              <div class="space-y-0.5 flex-1 pr-2">
                <div class="flex items-center gap-2">
                  <h4 class="font-bold text-white text-xs">${item.name}</h4>
                  <span class="px-2 py-0.5 rounded-full text-[8px] font-bold ${isLow ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400'}">
                    ${stock} units left
                  </span>
                </div>
                <p class="text-[10px] text-purple-300 font-semibold">${formatCurrency(item.selling_price)} <span class="text-slate-400 font-normal">| Cost: ${formatCurrency(item.cost_price)}</span></p>
              </div>
              <!-- 3-Dot Options Menu -->
              <div class="relative">
                <button onclick="toggleProductMenu('${item.id}')" class="p-2 text-slate-400 hover:text-white"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                <div id="menu-${item.id}" class="hidden absolute right-0 top-8 bg-[#191932] border border-purple-500/30 rounded-xl shadow-2xl z-20 w-28 py-1">
                  <button onclick="editProduct('${item.id}')" class="w-full text-left px-3 py-1.5 text-[10px] text-slate-300 hover:bg-purple-600/20 hover:text-white"><i class="fa-solid fa-pen mr-1"></i> Edit</button>
                  <button onclick="deleteProduct('${item.id}')" class="w-full text-left px-3 py-1.5 text-[10px] text-rose-400 hover:bg-rose-600/20"><i class="fa-solid fa-trash mr-1"></i> Delete</button>
                </div>
              </div>
            </div>
          `;
        });
      }
      html += `</div></div>`;
      container.innerHTML = html;
    }

    // --- POS VIEW ---
    function renderPOSView(container) {
      container.innerHTML = `
        <div class="space-y-3">
          <div class="bg-[#121224] border border-purple-500/15 p-3 rounded-2xl space-y-2">
            <h4 class="text-xs font-bold text-white">Select Products to Sell</h4>
            <div class="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar">
              ${inventoryCatalog.map(i => `
                <div onclick="addToCart('${i.id}')" class="flex items-center justify-between p-2 bg-[#191932] border border-purple-500/10 rounded-xl cursor-pointer hover:border-purple-500">
                  <div>
                    <p class="font-bold text-white text-[11px]">${i.name}</p>
                    <p class="text-[9px] text-slate-400">Stock: ${i.stock} pieces</p>
                  </div>
                  <span class="text-xs font-bold text-purple-300">${formatCurrency(i.selling_price)}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- CART -->
          <div class="bg-[#121224] border border-purple-500/15 p-3 rounded-2xl space-y-2">
            <h4 class="text-xs font-bold text-white">Cart Items</h4>
            <div id="pos-cart-items" class="space-y-2 max-h-36 overflow-y-auto custom-scrollbar">
              <div class="text-slate-500 text-[11px] text-center py-2">Cart is empty</div>
            </div>
            <div class="pt-2 border-t border-purple-500/10 flex justify-between items-center text-sm font-extrabold text-purple-400">
              <span>Grand Total:</span>
              <span id="pos-grand-total">₦0</span>
            </div>
          </div>

          <button onclick="completeSale()" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl text-white font-bold text-xs shadow-lg shadow-purple-600/30">
            Complete Sale & Deduct Stock
          </button>
        </div>
      `;
      renderCart();
    }

    function renderAIView(container) {
      container.innerHTML = `
        <div class="space-y-3 text-center py-10">
          <i class="fa-solid fa-robot text-4xl text-purple-400"></i>
          <h3 class="font-bold text-sm text-white">AI CEO Business Assistant</h3>
          <p class="text-xs text-slate-400 px-4">Your store generated ${formatCurrency(salesHistory.reduce((a,b)=>a+parseFloat(b.total_amount||0),0))} total sales. Keep restocking low inventory items promptly!</p>
        </div>
      `;
    }

    // --- BULK & STOCK LOGIC ---
    function calculateBulkStock() {
      const bulks = parseFloat(document.getElementById('p-bulks').value || 1);
      const perBulk = parseFloat(document.getElementById('p-pieces-per-bulk').value || 1);
      const totalCost = parseFloat(document.getElementById('p-total-bulk-cost').value || 0);
      const sellingPrice = parseFloat(document.getElementById('p-selling-price').value || 0);

      const totalPieces = bulks * perBulk;
      const singleCost = totalPieces > 0 ? totalCost / totalPieces : 0;
      const singleProfit = sellingPrice - singleCost;

      document.getElementById('calc-total-pieces').textContent = totalPieces;
      document.getElementById('calc-single-cost').textContent = formatCurrency(singleCost);
      document.getElementById('calc-single-profit').textContent = formatCurrency(singleProfit);
    }

    function openAddProductModal() {
      document.getElementById('edit-product-id').value = '';
      document.getElementById('modal-product-title').textContent = "Add New Bulk / Product";
      document.getElementById('p-name').value = '';
      document.getElementById('p-bulks').value = '1';
      document.getElementById('p-pieces-per-bulk').value = '24';
      document.getElementById('p-total-bulk-cost').value = '';
      document.getElementById('p-selling-price').value = '';
      calculateBulkStock();
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('product-modal').classList.add('hidden');
    }

    async function saveProduct() {
      const id = document.getElementById('edit-product-id').value;
      const name = document.getElementById('p-name').value;
      const bulks = parseFloat(document.getElementById('p-bulks').value || 1);
      const perBulk = parseFloat(document.getElementById('p-pieces-per-bulk').value || 1);
      const totalCost = parseFloat(document.getElementById('p-total-bulk-cost').value || 0);
      const sellingPrice = parseFloat(document.getElementById('p-selling-price').value || 0);

      const totalPieces = bulks * perBulk;
      const costPrice = totalPieces > 0 ? totalCost / totalPieces : 0;

      const payload = {
        company_id: userCompanyId,
        name: name,
        stock: totalPieces,
        cost_price: costPrice,
        selling_price: sellingPrice
      };

      let error;
      if (id) {
        const res = await supabaseClient.from('products').update(payload).eq('id', id);
        error = res.error;
      } else {
        const res = await supabaseClient.from('products').insert([payload]);
        error = res.error;
      }

      if (error) {
        alert('Error saving product: ' + error.message);
        return;
      }

      closeProductModal();
      await fetchData();
      switchTab('inventory');
    }

    function toggleProductMenu(id) {
      const menu = document.getElementById(`menu-${id}`);
      menu.classList.toggle('hidden');
    }

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      await supabaseClient.from('products').delete().eq('id', id);
      await fetchData();
      switchTab('inventory');
    }

    async function editProduct(id) {
      const item = inventoryCatalog.find(i => i.id === id);
      if (!item) return;
      document.getElementById('edit-product-id').value = item.id;
      document.getElementById('modal-product-title').textContent = "Edit Product";
      document.getElementById('p-name').value = item.name;
      document.getElementById('p-bulks').value = '1';
      document.getElementById('p-pieces-per-bulk').value = item.stock;
      document.getElementById('p-total-bulk-cost').value = item.cost_price * item.stock;
      document.getElementById('p-selling-price').value = item.selling_price;
      calculateBulkStock();
      document.getElementById('product-modal').classList.remove('hidden');
    }

    // --- POS & STOCK DEDUCTION ---
    function addToCart(itemId) {
      const product = inventoryCatalog.find(i => i.id === itemId);
      if (!product || product.stock <= 0) {
        alert('Product out of stock!');
        return;
      }

      const existing = cart.find(c => c.id === itemId);
      if (existing) {
        if (existing.qty < product.stock) existing.qty += 1;
        else alert('Cannot exceed available stock pieces!');
      } else {
        cart.push({ id: itemId, name: product.name, price: product.selling_price, cost_price: product.cost_price, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('pos-cart-items');
      if (!container) return;

      if (cart.length === 0) {
        container.innerHTML = `<div class="text-slate-500 text-[11px] text-center py-2">Cart is empty</div>`;
        document.getElementById('pos-grand-total').textContent = formatCurrency(0);
        return;
      }

      let grandTotal = 0;
      container.innerHTML = cart.map(i => {
        const total = i.price * i.qty;
        grandTotal += total;
        return `
          <div class="flex items-center justify-between bg-[#191932] p-2 rounded-xl text-xs">
            <div>
              <p class="font-bold text-white">${i.name}</p>
              <p class="text-[10px] text-purple-400">${formatCurrency(i.price)} x ${i.qty}</p>
            </div>
            <span class="font-bold text-white">${formatCurrency(total)}</span>
          </div>
        `;
      }).join('');
      document.getElementById('pos-grand-total').textContent = formatCurrency(grandTotal);
    }

    async function completeSale() {
      if (cart.length === 0) {
        alert('Cart is empty.');
        return;
      }

      const totalAmount = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const totalProfit = cart.reduce((acc, i) => acc + ((i.price - (i.cost_price || 0)) * i.qty), 0);
      const trxId = 'SAL-' + Math.floor(100000 + Math.random() * 900000);

      // Save sale
      const { error: saleError } = await supabaseClient.from('sales').insert([{
        company_id: userCompanyId,
        transaction_id: trxId,
        customer_name: selectedCustomer,
        items: cart,
        total_amount: totalAmount,
        total_profit: totalProfit,
        payment_method: selectedPaymentMethod,
        created_at: new Date().toISOString()
      }]);

      if (saleError) {
        alert('Sale error: ' + saleError.message);
        return;
      }

      // Deduct stock piece by piece from inventory
      for (const item of cart) {
        const prod = inventoryCatalog.find(p => p.id === item.id);
        if (prod) {
          const newStock = Math.max(0, parseInt(prod.stock) - item.qty);
          await supabaseClient.from('products').update({ stock: newStock }).eq('id', item.id);
        }
      }

      alert('Sale completed successfully! Stock deducted and profit recorded.');
      cart = [];
      await fetchData();
      switchTab('dashboard');
    }

    function viewTransactionDetails(s) {
      alert(`Transaction: ${s.transaction_id}\nCustomer: ${s.customer_name}\nTotal Sales: ${formatCurrency(s.total_amount)}\nTotal Profit: ${formatCurrency(s.total_profit)}\nPayment: ${s.payment_method}`);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
