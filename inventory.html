<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum OPS Elite - Inventory</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#07070F',
              card: '#121224',
              sidebar: '#0E0E1C',
              purple: '#6C5CE7',
              accent: '#8B5CF6'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #07070F; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2D2D48; border-radius: 4px; }
    .iphone-frame {
      width: 100%;
      max-width: 410px;
      height: 100vh;
      max-height: 860px;
      background: #0B0B16;
      border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 0 25px 50px -12px rgba(15, 13, 35, 0.7);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      body { align-items: center; justify-content: center; display: flex; height: 100vh; }
      .iphone-frame { border-radius: 48px; }
    }
  </style>
</head>
<body>

  <!-- MOBILE DEVICE FRAME CONTAINER -->
  <div class="iphone-frame">
    
    <!-- TOP APP BAR -->
    <div class="px-4 pt-4 pb-3 flex items-center justify-between bg-[#0B0B16]/90 backdrop-blur-md z-30 flex-shrink-0 border-b border-purple-500/10">
      <div>
        <h1 class="font-extrabold text-white text-base tracking-tight">All Products</h1>
        <p class="text-[10px] text-slate-400" id="product-count-label">0 products</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleSearch()" class="w-8 h-8 rounded-full bg-[#121224] border border-purple-500/20 flex items-center justify-center text-slate-300 hover:text-white transition">
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </button>
        <button onclick="openAddProductModal()" class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-white shadow-md shadow-purple-900/50 hover:bg-purple-500 transition">
          <i class="fa-solid fa-plus text-xs"></i>
        </button>
      </div>
    </div>

    <!-- HIDDEN SEARCH BAR -->
    <div id="search-container" class="px-4 py-2 bg-[#0E0E1C] hidden border-b border-purple-500/10">
      <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search product name or SKU..." class="w-full bg-[#16162d] border border-purple-500/20 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-purple-500">
    </div>

    <!-- FILTER TABS -->
    <div class="px-4 py-2.5 flex items-center gap-2 overflow-x-auto custom-scrollbar flex-shrink-0 bg-[#0B0B16]/90">
      <button onclick="setFilter('all', this)" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-purple-600 text-white transition flex-shrink-0 shadow-sm">All</button>
      <button onclick="setFilter('instock', this)" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 hover:text-white transition flex-shrink-0">In Stock</button>
      <button onclick="setFilter('lowstock', this)" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 hover:text-white transition flex-shrink-0">Low Stock</button>
      <button onclick="setFilter('outofstock', this)" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 hover:text-white transition flex-shrink-0">Out of Stock</button>
    </div>

    <!-- MAIN SCROLLABLE VIEWPORT -->
    <div class="flex-1 overflow-y-auto px-4 py-2 space-y-3 custom-scrollbar pb-24" id="products-list-container">
      <div class="text-center py-16 text-slate-500 text-xs">Loading products...</div>
    </div>

    <!-- BOTTOM FLOATING NAVIGATION BAR -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-[#0E0E1C]/95 backdrop-blur-xl border-t border-purple-500/15 px-6 flex items-center justify-between z-40">
      <a href="dashboard.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-gauge-high text-sm"></i>
        <span class="text-[9px] font-medium">Dashboard</span>
      </a>
      <a href="inventory.html" class="flex flex-col items-center gap-1 text-purple-400 transition">
        <i class="fa-solid fa-boxes-stacked text-sm"></i>
        <span class="text-[9px] font-medium">Inventory</span>
      </a>
      <a href="pos.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-cash-register text-sm"></i>
        <span class="text-[9px] font-medium">POS Sales</span>
      </a>
      <a href="ai-ceo.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-robot text-sm"></i>
        <span class="text-[9px] font-medium">AI CEO</span>
      </a>
    </nav>

  </div>

  <!-- ADD / EDIT PRODUCT MODAL WITH PHOTO & BARCODE -->
  <div id="product-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm max-h-[90vh] overflow-y-auto custom-scrollbar bg-[#121224] border border-purple-500/30 rounded-3xl p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 id="modal-title" class="text-sm font-bold text-white"><i class="fa-solid fa-box text-purple-400 mr-2"></i>Add New Product</h3>
        <button onclick="closeAddProductModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="edit-prod-id">

      <div class="space-y-3 text-xs">
        <!-- Product Photo Upload -->
        <div>
          <label class="text-[10px] text-slate-400 font-medium">Product Photo</label>
          <div class="mt-1 flex items-center gap-3 bg-[#191932] border border-purple-500/20 rounded-xl p-2">
            <div id="photo-preview-box" class="w-12 h-12 rounded-lg bg-purple-950/40 border border-purple-500/30 flex items-center justify-center text-purple-400 text-xs overflow-hidden flex-shrink-0">
              <i class="fa-solid fa-image"></i>
            </div>
            <div class="flex-1">
              <input type="file" id="product-image-file" accept="image/*" onchange="previewImage(event)" class="w-full text-[10px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500">
            </div>
          </div>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-medium">Product Name *</label>
          <input type="text" id="prod-name" placeholder="e.g. iPhone 13" class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
        </div>

        <div>
          <label class="text-[10px] text-slate-400 font-medium">Barcode / SKU (Optional)</label>
          <div class="relative mt-1">
            <input type="text" id="prod-sku" placeholder="e.g., 123456789 or scan" class="w-full bg-[#191932] border border-purple-500/20 rounded-xl pl-3 pr-10 py-2 text-white focus:outline-none focus:border-purple-500">
            <button type="button" onclick="triggerBarcodeScan()" class="absolute right-2.5 top-2 text-purple-400 hover:text-purple-300">
              <i class="fa-solid fa-camera text-sm"></i>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 font-medium">Items Per Bulk Pack (Pieces per Unit)</label>
            <input type="number" id="prod-pack" value="1" oninput="calculateUnitCost()" class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-medium">Bulk Cost Price (₦)</label>
            <input type="number" id="prod-bulk-cost" placeholder="0" oninput="calculateUnitCost()" class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 font-medium">Single Unit Cost (₦)</label>
            <input type="number" id="prod-unit-cost" placeholder="Auto" readonly class="w-full mt-1 bg-[#15152a] text-slate-400 border border-purple-500/10 rounded-xl px-3 py-2 focus:outline-none cursor-not-allowed">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-medium">Selling Price (₦) *</label>
            <input type="number" id="prod-selling" placeholder="e.g. 500000" oninput="calculateProfit()" class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 font-medium">Initial Total Pieces *</label>
            <input type="number" id="prod-stock" value="24" class="w-full mt-1 bg-[#191932] border border-purple-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 font-medium">Expected Profit / Unit</label>
            <input type="text" id="prod-expected-profit" value="₦0" readonly class="w-full mt-1 bg-[#15152a] text-emerald-400 font-bold border border-purple-500/10 rounded-xl px-3 py-2 focus:outline-none cursor-not-allowed">
          </div>
        </div>

        <button onclick="submitProductForm()" id="modal-submit-btn" class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl text-white font-bold text-xs shadow-lg shadow-purple-600/30 hover:opacity-95 transition">Save Product to Inventory</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    const SUPABASE_URL = "https://ptznejibslwmzlxzmsgh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_eVTCV7q1AFmD76R9XX5Esg_3QwAcr32";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userCompanyId = null;
    let allProducts = [];
    let currentFilter = 'all';
    let uploadedImageBase64 = '';

    function formatCurrency(amount) {
      return '₦' + Number(amount || 0).toLocaleString();
    }

    function toggleSearch() {
      const container = document.getElementById('search-container');
      container.classList.toggle('hidden');
      if (!container.classList.contains('hidden')) {
        document.getElementById('search-input').focus();
      }
    }

    function openAddProductModal() {
      document.getElementById('edit-prod-id').value = '';
      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-box text-purple-400 mr-2"></i>Add New Product`;
      document.getElementById('modal-submit-btn').textContent = 'Save Product to Inventory';
      
      // Reset form fields
      document.getElementById('prod-name').value = '';
      document.getElementById('prod-sku').value = '';
      document.getElementById('prod-pack').value = '24';
      document.getElementById('prod-bulk-cost').value = '';
      document.getElementById('prod-unit-cost').value = '';
      document.getElementById('prod-selling').value = '';
      document.getElementById('prod-stock').value = '48';
      document.getElementById('prod-expected-profit').value = '₦0';
      uploadedImageBase64 = '';
      document.getElementById('photo-preview-box').innerHTML = `<i class="fa-solid fa-image"></i>`;
      document.getElementById('product-image-file').value = '';

      document.getElementById('product-modal').classList.remove('hidden');
    }

    function openEditProductModal(id) {
      const p = allProducts.find(item => item.id === id);
      if (!p) return;

      document.getElementById('edit-prod-id').value = p.id;
      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-purple-400 mr-2"></i>Edit Product`;
      document.getElementById('modal-submit-btn').textContent = 'Update Product';

      document.getElementById('prod-name').value = p.name || '';
      document.getElementById('prod-sku').value = p.sku || '';
      document.getElementById('prod-pack').value = p.items_per_pack || p.pack || 24;
      document.getElementById('prod-bulk-cost').value = p.bulk_cost || '';
      document.getElementById('prod-unit-cost').value = p.unit_cost || '';
      document.getElementById('prod-selling').value = p.selling_price || p.price || '';
      document.getElementById('prod-stock').value = p.stock || 0;
      
      uploadedImageBase64 = p.image_url || '';
      if (uploadedImageBase64) {
        document.getElementById('photo-preview-box').innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-full object-cover">`;
      } else {
        document.getElementById('photo-preview-box').innerHTML = `<i class="fa-solid fa-image"></i>`;
      }

      calculateProfit();
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function closeAddProductModal() {
      document.getElementById('product-modal').classList.add('hidden');
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImageBase64 = e.target.result;
          document.getElementById('photo-preview-box').innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-full object-cover">`;
        };
        reader.readAsDataURL(file);
      }
    }

    function triggerBarcodeScan() {
      const randomBarcode = 'SKU-' + Math.floor(100000 + Math.random() * 900000);
      document.getElementById('prod-sku').value = randomBarcode;
      alert('Barcode scanned successfully: ' + randomBarcode);
    }

    function calculateUnitCost() {
      const pack = parseFloat(document.getElementById('prod-pack').value) || 1;
      const bulkCost = parseFloat(document.getElementById('prod-bulk-cost').value) || 0;
      const unitCost = bulkCost / pack;
      document.getElementById('prod-unit-cost').value = unitCost.toFixed(2);
      calculateProfit();
    }

    function calculateProfit() {
      const unitCost = parseFloat(document.getElementById('prod-unit-cost').value) || 0;
      const sellingPrice = parseFloat(document.getElementById('prod-selling').value) || 0;
      const profit = sellingPrice - unitCost;
      const profitField = document.getElementById('prod-expected-profit');
      profitField.value = formatCurrency(profit);
      profitField.className = `w-full mt-1 bg-[#15152a] font-bold border border-purple-500/10 rounded-xl px-3 py-2 focus:outline-none cursor-not-allowed ${profit >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
    }

    async function initializeInventory() {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          const { data: memberData } = await supabaseClient
            .from('company_users')
            .select('company_id')
            .eq('user_id', user.id)
            .single();

          if (memberData) {
            userCompanyId = memberData.company_id;
          }
        }
        await fetchProducts();
      } catch (err) {
        console.error("Initialization error:", err);
      }
    }

    async function fetchProducts() {
      let query = supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (userCompanyId) {
        query = query.eq('company_id', userCompanyId);
      }

      const { data, error } = await query;
      if (error) {
        console.error("Error fetching products:", error);
        return;
      }

      allProducts = data || [];
      renderProducts(allProducts);
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => {
        b.className = "filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[#121224] text-slate-400 border border-purple-500/15 hover:text-white transition flex-shrink-0";
      });
      btn.className = "filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-purple-600 text-white transition flex-shrink-0 shadow-sm";
      filterProducts();
    }

    function filterProducts() {
      const keyword = (document.getElementById('search-input')?.value || '').toLowerCase();
      
      const filtered = allProducts.filter(p => {
        const nameMatch = p.name.toLowerCase().includes(keyword) || (p.sku && p.sku.toLowerCase().includes(keyword));
        const stock = parseInt(p.stock || 0);

        if (!nameMatch) return false;

        if (currentFilter === 'instock') return stock > 5;
        if (currentFilter === 'lowstock') return stock > 0 && stock <= 5;
        if (currentFilter === 'outofstock') return stock === 0;
        return true;
      });

      renderProducts(filtered);
    }

    function toggleCardMenu(event, id) {
      event.stopPropagation();
      document.querySelectorAll('[id^="menu-"]').forEach(m => {
        if (m.id !== `menu-${id}`) m.classList.add('hidden');
      });
      const menu = document.getElementById(`menu-${id}`);
      menu.classList.toggle('hidden');
    }

    window.addEventListener('click', () => {
      document.querySelectorAll('[id^="menu-"]').forEach(m => m.classList.add('hidden'));
    });

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      const { error } = await supabaseClient.from('products').delete().eq('id', id);
      if (error) {
        alert('Error deleting product: ' + error.message);
        return;
      }
      await fetchProducts();
    }

    function renderProducts(products) {
      const container = document.getElementById('products-list-container');
      document.getElementById('product-count-label').textContent = `${products.length} products`;

      if (products.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-[#121224] border border-purple-500/10 rounded-2xl space-y-2">
            <i class="fa-solid fa-boxes-stacked text-purple-400 text-2xl"></i>
            <p class="text-slate-300 text-xs font-medium">No products found</p>
            <p class="text-slate-500 text-[10px]">Tap the '+' button above to add your first product.</p>
          </div>
        `;
        return;
      }

      let html = '';
      products.forEach(p => {
        const totalPieces = parseInt(p.stock || 0);
        const piecesPerUnit = parseInt(p.items_per_pack || p.pack || 24) || 24;
        
        // Calculate dynamic units and remaining pieces cleanly
        const calculatedUnits = (totalPieces / piecesPerUnit).toFixed(1);
        const displayUnits = totalPieces % piecesPerUnit === 0 ? Math.floor(totalPieces / piecesPerUnit) : calculatedUnits;

        let badgeBg = 'bg-emerald-950/50 text-emerald-400 border-emerald-500/30';
        let badgeText = 'In Stock';

        if (totalPieces === 0) {
          badgeBg = 'bg-rose-950/50 text-rose-400 border-rose-500/30';
          badgeText = 'Out of Stock';
        } else if (totalPieces <= 5) {
          badgeBg = 'bg-amber-950/50 text-amber-400 border-amber-500/30';
          badgeText = 'Low Stock';
        }

        const cost = parseFloat(p.unit_cost || p.cost_price || 0);
        const price = parseFloat(p.selling_price || p.price || 0);
        const profit = price - cost;
        const imgUrl = p.image_url || 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=150';

        html += `
          <div class="bg-[#121224] border border-purple-500/15 p-3.5 rounded-2xl flex items-center justify-between shadow-xl gap-3 relative">
            <div class="flex items-center gap-3">
              <img src="${imgUrl}" class="w-14 h-14 rounded-xl object-cover bg-purple-950/30 border border-purple-500/20 flex-shrink-0">
              <div class="space-y-1">
                <h4 class="font-bold text-white text-xs">${p.name}</h4>
                <p class="text-[10px] text-slate-400">SKU: ${p.sku || 'N/A'}</p>
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 rounded-md text-[9px] font-semibold border ${badgeBg}">${badgeText}</span>
                  <span class="text-[10px] text-purple-300 font-bold">${displayUnits} unit <span class="text-slate-400 font-normal">(${totalPieces} pcs)</span></span>
                </div>
              </div>
            </div>
            <div class="text-right space-y-0.5 flex-shrink-0 flex items-center gap-2">
              <div>
                <span class="font-extrabold text-white text-xs block">${formatCurrency(price)}</span>
                <p class="text-[10px] text-slate-400">Cost: ${formatCurrency(cost)}</p>
                <p class="text-[10px] font-semibold ${profit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">Profit: ${formatCurrency(profit)}</p>
              </div>
              <div class="relative">
                <button onclick="toggleCardMenu(event, '${p.id}')" class="p-2 text-slate-400 hover:text-white transition rounded-lg">
                  <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
                </button>
                <div id="menu-${p.id}" class="hidden absolute right-0 top-8 w-28 bg-[#191932] border border-purple-500/30 rounded-xl shadow-2xl z-20 py-1 text-left">
                  <button onclick="openEditProductModal('${p.id}')" class="w-full px-3 py-1.5 text-[10px] text-purple-300 hover:bg-purple-600/20 flex items-center gap-2"><i class="fa-solid fa-pen"></i> Edit</button>
                  <button onclick="deleteProduct('${p.id}')" class="w-full px-3 py-1.5 text-[10px] text-rose-400 hover:bg-rose-600/20 flex items-center gap-2"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    async function submitProductForm() {
      const editId = document.getElementById('edit-prod-id').value;
      const name = document.getElementById('prod-name').value;
      const sku = document.getElementById('prod-sku').value;
      const pack = parseInt(document.getElementById('prod-pack').value) || 24;
      const bulkCost = parseFloat(document.getElementById('prod-bulk-cost').value) || 0;
      const unitCost = parseFloat(document.getElementById('prod-unit-cost').value) || 0;
      const sellingPrice = parseFloat(document.getElementById('prod-selling').value) || 0;
      const stock = parseInt(document.getElementById('prod-stock').value) || 0;

      if (!name || !sellingPrice) {
        alert('Please fill in the Product Name and Selling Price.');
        return;
      }

      const productData = {
        company_id: userCompanyId,
        name: name,
        sku: sku || 'SKU-' + Math.floor(1000 + Math.random() * 9000),
        items_per_pack: pack,
        bulk_cost: bulkCost,
        unit_cost: unitCost,
        selling_price: sellingPrice,
        stock: stock,
        image_url: uploadedImageBase64 || 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=150'
      };

      let error;
      if (editId) {
        const res = await supabaseClient.from('products').update(productData).eq('id', editId);
        error = res.error;
      } else {
        const res = await supabaseClient.from('products').insert([productData]);
        error = res.error;
      }

      if (error) {
        alert('Error saving product: ' + error.message);
      } else {
        closeAddProductModal();
        fetchProducts();
      }
    }

    window.addEventListener('DOMContentLoaded', initializeInventory);
  </script>
</body>
</html>
